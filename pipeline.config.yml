verify: "npm run verify"

paths:
  source: ["packages/*/src/**", "packages/*/viewer/**"]
  tests: ["**/*.test.ts", "**/*.test.tsx"]
  docs: ["docs/**"]

designSystem:
  path: "packages/design-system"
  tokens: "packages/design-system/src/tokens.css"

vcs: github

engineering:
  tier: production

models:
  design: high
  review: high
  build: fast

rules:
  code: .claude/rules/typescript.md          # → write-code, architecture, review
  testing: .claude/rules/testing.md           # → write-tests, review
  design-system: .claude/rules/design-system.md  # → design, design-critique, write-code, review
  frontend: .claude/rules/frontend.md         # → design, write-code, review
  visual: .claude/rules/visual-regression.md  # → design-critique, review
  aesthetics: .claude/rules/aesthetic-quality.md  # → design, design-critique
