<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ArtifactEmbed — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    body { background: var(--surface-3); color: var(--text-hi); font-family: var(--ui); padding: 24px; }
    /* The review-message container owns the chrome (background, border, radius).
       Embed itself MUST NOT contribute bg/border/rounded/shadow. */
    .review-message {
      background: var(--surface-2);
      border-radius: var(--r1);
      padding: 12px 16px;
    }
    .artifact-embed { display: flex; flex-direction: column; gap: 4px; }
    .embed-identity {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-lo);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .embed-identity .arrow { margin-left: auto; cursor: pointer; padding: 4px 6px; }
    .embed-identity .arrow:hover { color: var(--text-hi); }
    .embed-view { color: var(--text-mid); font-family: var(--ui); font-size: 13px; text-transform: none; letter-spacing: 0; }
    .sep { color: var(--text-lo); }
    .artifact-kind-badge { display: inline-flex; padding: 2px 8px; border-radius: var(--r2); background: var(--surface-ghost); color: var(--text-mid); font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="review-message">
    <p>Here is the diff for review:</p>
    <div class="artifact-embed" data-component="ArtifactEmbed" data-tier="2">
      <div class="embed-identity">
        <span class="artifact-kind-badge">CODE DIFF</span>
        <span class="sep">·</span>
        <span>Implement auth flow</span>
        <span class="sep">·</span>
        <span>$0.42</span>
        <span class="sep">·</span>
        <span>12 min ago</span>
        <span class="arrow" role="button" aria-label="Open artifact">→</span>
      </div>
      <div class="embed-view">[ delegated ArtifactView mount ]</div>
    </div>
    <p>Mostly clean — one nit on naming.</p>
  </div>
</body>
</html>
