<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SearchField — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .search-field {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-field__icon {
      position: absolute;
      left: 8px;
      display: flex;
      align-items: center;
      pointer-events: none;
      color: var(--text-lo);
    }

    .search-field__input {
      width: 100%;
      height: 32px;
      padding: 0 56px 0 32px;
      background: var(--surface-3);
      border: 1px solid transparent;
      border-radius: var(--r2);
      font-family: var(--ui);
      font-size: 13px;
      color: var(--text-hi);
      transition: border-color var(--motion-fast) ease, background var(--motion-fast) ease;
    }

    .search-field__input::placeholder {
      color: var(--text-lo);
    }

    .search-field__input:focus {
      border-color: var(--primary);
      background: var(--surface-2);
      outline: none;
    }

    .search-field__trailing {
      position: absolute;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .search-field__clear {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: var(--r1);
      background: transparent;
      color: var(--text-lo);
      font-size: 12px;
      cursor: pointer;
      border: none;
      padding: 0;
      transition: background var(--motion-fast) ease, color var(--motion-fast) ease;
    }

    .search-field__clear:hover {
      background: var(--surface-ghost);
      color: var(--text-mid);
    }

    .search-field__kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 18px;
      padding: 0 4px;
      border-radius: var(--r1);
      background: var(--surface-5);
      color: var(--text-lo);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
    }

    /* Spinner for loading state */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .search-field__spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--surface-5);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    const SearchIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
        <path fillRule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clipRule="evenodd" />
      </svg>
    );

    const SearchField = React.forwardRef(function SearchField(
      { placeholder, value, onChange, loading = false, shortcutKey },
      ref
    ) {
      return (
        <div
          className="search-field"
          data-component="SearchField"
          data-tier="1"
          data-uses=""
          data-daisyui=""
          data-used-by="Submenu,GlobalSearchPanel,PitchSelector"
          data-ds-component="SearchField"
          data-ds-tier="1"
          data-ds-source="design-system"
        >
          <span className="search-field__icon">
            {loading ? (
              <span className="search-field__spinner" />
            ) : (
              <SearchIcon />
            )}
          </span>
          <input
            ref={ref}
            type="text"
            className="search-field__input"
            placeholder={placeholder}
            value={value}
            onChange={(e) => onChange && onChange(e.target.value)}
          />
          <span className="search-field__trailing">
            {value && (
              <button
                type="button"
                className="search-field__clear"
                aria-label="clear"
                onClick={() => onChange && onChange("")}
              >
                &#x2715;
              </button>
            )}
            {shortcutKey && <kbd className="search-field__kbd">{shortcutKey}</kbd>}
          </span>
        </div>
      );
    });

    function Demo() {
      const [interactiveValue, setInteractiveValue] = React.useState("");

      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Empty</div>
            <div style={{ width: "288px" }}>
              <SearchField placeholder="Search..." />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">With Value</div>
            <div style={{ width: "288px" }}>
              <SearchField placeholder="Search..." value="react component" onChange={() => {}} />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Loading</div>
            <div style={{ width: "288px" }}>
              <SearchField placeholder="Search..." value="fetching..." loading onChange={() => {}} />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">With Keyboard Shortcut</div>
            <div style={{ width: "288px" }}>
              <SearchField placeholder="Search..." shortcutKey="/" />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Interactive (Type to Test)</div>
            <div style={{ width: "288px" }}>
              <SearchField
                placeholder="Type something..."
                value={interactiveValue}
                onChange={setInteractiveValue}
                shortcutKey="/"
              />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">In Context (Demo Card)</div>
            <div className="demo-card" style={{ maxWidth: "360px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                <SearchField
                  placeholder="Search agents..."
                  value={interactiveValue}
                  onChange={setInteractiveValue}
                  shortcutKey="/"
                />
                <div style={{ fontSize: "12px", color: "var(--text-lo)" }}>
                  {interactiveValue ? `Searching for "${interactiveValue}"...` : "Type to search"}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
