<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NotificationRow — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .notification-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: var(--r1);
      transition: background var(--motion-fast);
    }
    .notification-row:hover {
      background: var(--surface-4);
    }

    .notification-row__message {
      flex: 1;
      font-size: 14px;
      color: var(--text-hi);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notification-row__timestamp {
      font-size: 12px;
      color: var(--text-lo);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .notification-row__actions {
      flex-shrink: 0;
    }
    .notification-row__actions button {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--r1);
      color: var(--text-mid);
      background: var(--surface-ghost);
      transition: background var(--motion-fast);
    }
    .notification-row__actions button:hover {
      background: var(--surface-5);
      color: var(--text-hi);
    }

    /* --- Tier 1: StatusChip --- */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-chip--healthy { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
    .status-chip--healthy .dot { background: var(--ok); }
    .status-chip--behind { background: color-mix(in oklab, var(--warn) 14%, transparent); color: var(--warn); }
    .status-chip--behind .dot { background: var(--warn); }
    .status-chip--blocked { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
    .status-chip--blocked .dot { background: var(--danger); }
    .status-chip--paused { background: color-mix(in oklab, var(--text-lo) 14%, transparent); color: var(--text-lo); }
    .status-chip--paused .dot { background: var(--text-lo); }
    .status-chip--done { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
    .status-chip--done .dot { background: var(--ok); }
    .status-chip--error { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
    .status-chip--error .dot { background: var(--danger); }

    /* --- Tier 1: Tag --- */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: var(--surface-ghost);
      color: var(--text-mid);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function StatusChip({ status }) {
      return (
        <span
          className={`status-chip status-chip--${status}`}
          title={status}
          data-component="StatusChip"
          data-tier="1"
        >
          <span className="dot" />
          {status.toUpperCase()}
        </span>
      );
    }

    function Tag({ label }) {
      return (
        <span className="tag" data-component="Tag" data-tier="1">
          {label}
        </span>
      );
    }

    function NotificationRow({ severity, message, timestamp, source, actions }) {
      return (
        <div
          className="notification-row"
          data-component="NotificationRow"
          data-tier="2"
          data-uses="StatusChip,Tag"
          data-daisyui=""
          data-used-by="Rail"
        >
          <StatusChip status={severity} />
          <span className="notification-row__message" aria-label={`Notification: ${message}`}>
            {message}
          </span>
          {source && <Tag label={source} />}
          <span className="notification-row__timestamp">{timestamp}</span>
          {actions && <span className="notification-row__actions">{actions}</span>}
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Healthy</div>
            <NotificationRow
              severity="healthy"
              message="Deploy completed successfully"
              timestamp="Just now"
              source="CI/CD"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Error Severity</div>
            <NotificationRow
              severity="error"
              message="Agent session crashed unexpectedly"
              timestamp="2 min ago"
              source="Runtime"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">With Inline Action</div>
            <NotificationRow
              severity="blocked"
              message="Agent blocked — awaiting API key"
              timestamp="2m ago"
              source="builder-agent"
              actions={<button type="button">Resolve</button>}
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">All Severities</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
              <NotificationRow severity="healthy" message="All systems operational" timestamp="now" />
              <NotificationRow severity="behind" message="Build is taking longer than expected" timestamp="5m ago" source="CI" />
              <NotificationRow severity="blocked" message="Cannot reach external API" timestamp="10m ago" source="API" />
              <NotificationRow severity="paused" message="Agent session paused by user" timestamp="15m ago" />
              <NotificationRow severity="done" message="Migration completed" timestamp="1h ago" source="DB" />
              <NotificationRow severity="error" message="Critical failure in pipeline" timestamp="2h ago" source="Pipeline" />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
