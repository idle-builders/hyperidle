<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PitchCard — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .pitch-card {
      background: var(--surface-4);
      border-radius: var(--r2);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: background var(--motion-fast);
      max-width: 320px;
    }
    .pitch-card:hover {
      background: var(--surface-5);
    }
    .pitch-card:focus-visible {
      outline: 1px solid var(--primary);
      outline-offset: -1px;
    }

    .pitch-card__title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-hi);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pitch-card__meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pitch-card__hypothesis {
      font-size: 12px;
      color: var(--text-mid);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .pitch-card__proposer {
      font-size: 12px;
      color: var(--text-hi);
    }

    /* --- Tier 1: StatusChip --- */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-chip--healthy { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
    .status-chip--healthy .dot { background: var(--ok); }
    .status-chip--behind { background: color-mix(in oklab, var(--warn) 14%, transparent); color: var(--warn); }
    .status-chip--behind .dot { background: var(--warn); }
    .status-chip--blocked { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
    .status-chip--blocked .dot { background: var(--danger); }
    .status-chip--paused { background: color-mix(in oklab, var(--text-lo) 14%, transparent); color: var(--text-lo); }
    .status-chip--paused .dot { background: var(--text-lo); }
    .status-chip--done { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
    .status-chip--done .dot { background: var(--ok); }
    .status-chip--error { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
    .status-chip--error .dot { background: var(--danger); }

    /* --- Tier 1: Tag --- */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: var(--surface-ghost);
      color: var(--text-mid);
      flex-shrink: 0;
    }

    /* --- Tier 1: KeyValue --- */
    .key-value {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .key-value__label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-lo);
    }
    .key-value__value {
      font-size: var(--density-text);
      color: var(--text-hi);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    const BET_STATUS_MAP = {
      shaped: "paused",
      committed: "healthy",
      in_progress: "healthy",
      behind: "behind",
      blocked: "blocked",
      paused: "paused",
      review: "behind",
      shipped: "done",
      killed: "error",
    };

    function StatusChip({ status }) {
      return (
        <span
          className={`status-chip status-chip--${status}`}
          title={status}
          data-component="StatusChip"
          data-tier="1"
        >
          <span className="dot" />
          {status.toUpperCase()}
        </span>
      );
    }

    function Tag({ label }) {
      return (
        <span className="tag" data-component="Tag" data-tier="1">
          {label}
        </span>
      );
    }

    function KeyValue({ label, value }) {
      return (
        <div className="key-value" data-component="KeyValue" data-tier="1">
          <span className="key-value__label">{label}</span>
          <span className="key-value__value">{value}</span>
        </div>
      );
    }

    function PitchCard({ title, hypothesis, proposer, status, appetite, kind }) {
      const presentationStatus = BET_STATUS_MAP[status] || "paused";

      return (
        <div
          className="pitch-card"
          role="button"
          tabIndex={0}
          data-component="PitchCard"
          data-tier="2"
          data-uses="StatusChip,Tag,KeyValue"
          data-daisyui=""
          data-used-by="PitchSelector"
          data-ds-component="PitchCard"
          data-ds-tier="2"
          data-ds-source="design-system"
        >
          <span className="pitch-card__title" aria-label={`Pitch: ${title}`}>{title}</span>
          <div className="pitch-card__meta">
            {kind && <Tag label={kind} />}
            <StatusChip status={presentationStatus} />
          </div>
          <p className="pitch-card__hypothesis">{hypothesis}</p>
          <span className="pitch-card__proposer">{proposer}</span>
          <KeyValue label="Appetite" value={appetite} />
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Shaped</div>
            <PitchCard
              title="AI-Powered Onboarding"
              hypothesis="Reducing onboarding steps from 8 to 3 will increase activation by 40%"
              proposer="Alice Chen"
              status="shaped"
              appetite="2 weeks"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">With Kind</div>
            <PitchCard
              title="Cost Prediction Model"
              hypothesis="ML-based cost prediction will reduce overruns by 60%"
              proposer="Bob Smith"
              status="committed"
              appetite="4 weeks"
              kind="exploration"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Killed</div>
            <PitchCard
              title="Deprecated Approach"
              hypothesis="This approach was superseded by a better one"
              proposer="Carol Davis"
              status="killed"
              appetite="1 week"
              kind="feature"
            />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
