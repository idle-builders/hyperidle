<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ArtifactPreviewSurface — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    body { background: var(--surface-container); color: var(--text-primary); font-family: var(--ui); padding: 24px; display: grid; grid-template-columns: 240px 240px; gap: 16px; }
    .artifact-preview-surface {
      background: var(--surface-container);
      border-radius: var(--r-subtle);
      padding: 12px;
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .artifact-preview-surface--full { min-height: 240px; }
    .artifact-preview-surface__deck {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      color: var(--text-secondary);
      text-transform: none;
    }
    .deck-meta { color: var(--text-tertiary); }
    .deck-title { color: var(--text-primary); font-family: var(--ui); font-size: 13px; }
  </style>
</head>
<body>
  <div class="artifact-preview-surface" data-component="ArtifactPreviewSurface" data-tier="1" data-size="gallery">PREVIEW PENDING</div>
  <div class="artifact-preview-surface artifact-preview-surface--full" data-component="ArtifactPreviewSurface" data-tier="1" data-size="full">PREVIEW NOT YET RENDERED</div>
  <div class="artifact-preview-surface artifact-preview-surface__deck" data-component="ArtifactPreviewSurface" data-tier="1" data-kind="deck">
    <span class="deck-meta">Slide 1 of 12 · 3 sections</span>
    <span class="deck-title">Q3 strategy review</span>
  </div>
</body>
</html>
