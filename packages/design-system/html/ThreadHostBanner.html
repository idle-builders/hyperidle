<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThreadHostBanner — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* Layout mirrors ThreadHostBanner.tsx — flex row, density tokens. */
    .host-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-bottom: 1px solid var(--border-subtle);
      background: var(--surface-container);
    }
    .host-banner__main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .host-banner__title {
      color: var(--text-primary);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .host-banner__chips,
    .host-banner__avatars {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .host-banner__chips { gap: 6px; }
    .host-banner__avatars { gap: 2px; }

    .host-banner__avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface-elevated);
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--border-subtle);
    }

    /* Tag — mirrored from html/Tag.html */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: color-mix(in oklab, var(--text-secondary) 8%, transparent);
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* StatusChip — mirrored from html/StatusChip.html */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-chip--blocked {
      background: color-mix(in oklab, var(--status-error) 14%, transparent);
      color: var(--status-error);
    }
    .status-chip--blocked .dot { background: var(--status-error); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Tag({ label }) {
      return <span className="tag">{label}</span>;
    }

    function StatusChip({ status }) {
      return (
        <span className={`status-chip status-chip--${status}`} title={status}>
          <span className="dot" />
          {status.toUpperCase()}
        </span>
      );
    }

    function PinIcon() {
      return (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ color: "var(--text-tertiary)", flexShrink: 0 }} aria-hidden="true">
          <path d="M12 17v5" />
          <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
        </svg>
      );
    }

    function ThreadHostBanner({ hostKind, hostTitle, blocking, resolved, pinned, participants }) {
      const visible = participants.slice(0, 3);
      const overflow = participants.length - visible.length;
      return (
        <div
          className="host-banner"
          data-component="ThreadHostBanner"
          data-tier="2"
          data-uses="Tag,StatusChip"
        >
          <div className="host-banner__main">
            <Tag label={hostKind} />
            <span className="host-banner__title">{hostTitle}</span>
            {pinned ? <PinIcon /> : null}
          </div>
          <div className="host-banner__chips">
            {blocking ? <StatusChip status="blocked" /> : null}
            {resolved ? <Tag label="Resolved" /> : null}
          </div>
          <div className="host-banner__avatars">
            {visible.map((p) => (
              <span key={p.id} className="host-banner__avatar" title={p.name}>
                {p.name.charAt(0).toUpperCase()}
              </span>
            ))}
            {overflow > 0 ? (
              <span className="host-banner__avatar">+{overflow}</span>
            ) : null}
          </div>
        </div>
      );
    }

    function Demo() {
      const participants = [
        { id: "a1", name: "Alice" },
        { id: "a2", name: "Bob" },
        { id: "a3", name: "Carol" },
      ];
      return (
        <ThreadHostBanner
          hostKind="task"
          hostTitle="Deploy pipeline stuck"
          blocking={true}
          resolved={false}
          pinned={true}
          participants={participants}
        />
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
