<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskCard — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .task-card {
      background: var(--surface-4);
      border-radius: var(--r2);
      /* K11: pad/gap/title scale per density-audit.md § 3.2.5. The
         max-w 320 px stays literal — Kanban-column geometry. */
      padding: var(--density-card-pad);
      display: flex;
      flex-direction: column;
      gap: var(--density-card-gap);
      transition: background var(--motion-fast);
      max-width: 320px;
      position: relative;
    }
    .task-card--blocked {
      border: 1px solid var(--danger);
    }

    .task-card__head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--density-gap);
    }

    .task-card__title-row {
      display: flex;
      align-items: center;
      gap: var(--density-gap);
      min-width: 0;
    }

    .task-card__thread-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: var(--r-pill);
      flex: 0 0 auto;
      background: var(--text-lo);
    }
    .task-card__thread-dot--unread {
      background: var(--primary);
      box-shadow: 0 0 0 2px color-mix(in oklab, var(--primary) 30%, transparent);
    }

    .task-card__title {
      /* K11: title font scales with density per § 3.2.5. */
      font-size: var(--density-text);
      font-weight: 500;
      color: var(--text-hi);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-card__title--interactive {
      cursor: pointer;
      transition: color var(--motion-fast);
    }
    .task-card__title--interactive:hover { color: var(--primary); }

    .task-card__kebab {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-radius: var(--r1);
      color: var(--text-mid);
      cursor: pointer;
      padding: 0;
      flex: 0 0 auto;
    }
    .task-card__kebab:hover, .task-card__kebab[aria-expanded="true"] {
      background: var(--surface-5);
      color: var(--text-hi);
    }
    .task-card__kebab svg { width: 16px; height: 16px; }

    .task-card__menu {
      position: absolute;
      top: 36px;
      right: 8px;
      min-width: 240px;
      background: var(--surface-3);
      border: 1px solid var(--border-default);
      border-radius: var(--r2);
      box-shadow: var(--float);
      padding: 4px;
      z-index: 5;
      list-style: none;
      margin: 0;
    }
    .task-card__menu-section {
      padding: 6px 8px 2px 8px;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      color: var(--text-lo);
      font-weight: 500;
    }
    .task-card__menu-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 4px 0;
      border: 0;
    }
    .task-card__menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border: 0;
      background: transparent;
      color: var(--text-hi);
      font-size: 14px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      border-radius: var(--r1);
      font-family: inherit;
    }
    .task-card__menu-item:hover { background: var(--surface-4); }
    .task-card__menu-item--primary { background: color-mix(in oklab, var(--primary) 14%, transparent); color: var(--primary); }
    .task-card__menu-item--danger { color: var(--danger); }
    .task-card__menu-item[aria-disabled="true"] { color: var(--text-lo); cursor: not-allowed; }
    .task-card__menu-item .target {
      color: var(--text-lo);
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
    }

    .task-card__meta {
      display: flex;
      align-items: center;
      gap: var(--density-gap);
    }

    .task-card__owner {
      font-size: 12px;
      color: var(--text-hi);
    }

    /* --- Tier 1: StatusChip --- */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-chip--healthy { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
    .status-chip--healthy .dot { background: var(--ok); }
    .status-chip--behind { background: color-mix(in oklab, var(--warn) 14%, transparent); color: var(--warn); }
    .status-chip--behind .dot { background: var(--warn); }
    .status-chip--blocked { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
    .status-chip--blocked .dot { background: var(--danger); }
    .status-chip--paused { background: color-mix(in oklab, var(--text-lo) 14%, transparent); color: var(--text-lo); }
    .status-chip--paused .dot { background: var(--text-lo); }
    .status-chip--done { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
    .status-chip--done .dot { background: var(--ok); }
    .status-chip--error { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
    .status-chip--error .dot { background: var(--danger); }

    /* --- Tier 1: Tag --- */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: var(--surface-ghost);
      color: var(--text-mid);
      flex-shrink: 0;
    }

    /* --- Tier 1: KeyValue --- */
    .key-value {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .key-value__label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-lo);
    }
    .key-value__value {
      font-size: var(--density-text);
      color: var(--text-hi);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    const TASK_STATE_MAP = {
      proposed: "paused",
      accepted: "healthy",
      hold: "paused",
      in_progress: "healthy",
      blocked: "blocked",
      review: "behind",
      done: "done",
      killed: "error",
    };

    function StatusChip({ status }) {
      return (
        <span
          className={`status-chip status-chip--${status}`}
          title={status}
          data-component="StatusChip"
          data-tier="1"
        >
          <span className="dot" />
          {status.toUpperCase()}
        </span>
      );
    }

    function Tag({ label }) {
      return (
        <span className="tag" data-component="Tag" data-tier="1">
          {label}
        </span>
      );
    }

    function KeyValue({ label, value }) {
      return (
        <div className="key-value" data-component="KeyValue" data-tier="1">
          <span className="key-value__label">{label}</span>
          <span className="key-value__value">{value}</span>
        </div>
      );
    }

    function KebabIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="5" r="1.5" />
          <circle cx="12" cy="12" r="1.5" />
          <circle cx="12" cy="19" r="1.5" />
        </svg>
      );
    }

    /**
     * L15: TaskCard renders a kebab + thread-dot + dropdown menu.
     * - thread-dot: undefined → none; 0 → grey; >0 → primary + halo.
     * - title row is interactive only when unread > 0.
     * - menu has Open thread row, Request state change section, Kill danger row,
     *   with horizontal dividers between sections per approved.md §4.1.
     */
    function TaskCard({ title, owner, state, cost, betTag, threadUnreadCount, menuOpen }) {
      const presentationStatus = TASK_STATE_MAP[state] || "paused";
      const isBlocked = state === "blocked";
      const hasThread = threadUnreadCount !== undefined;
      const unread = threadUnreadCount ?? 0;
      const interactiveTitle = unread > 0;

      return (
        <div
          className={`task-card${isBlocked ? " task-card--blocked" : ""}`}
          data-component="TaskCard"
          data-tier="2"
          data-uses="StatusChip,Tag,KeyValue"
          data-daisyui=""
          data-used-by="Kanban"
          data-ds-component="TaskCard"
          data-ds-tier="2"
          data-ds-source="design-system"
        >
          <div className="task-card__head">
            <div className="task-card__title-row">
              {hasThread && (
                <span
                  className={`task-card__thread-dot${unread > 0 ? " task-card__thread-dot--unread" : ""}`}
                  aria-hidden="true"
                />
              )}
              {interactiveTitle ? (
                <span role="button" tabIndex={0} className={`task-card__title task-card__title--interactive`}>{title}</span>
              ) : (
                <span className="task-card__title">{title}</span>
              )}
            </div>
            <button
              type="button"
              className="task-card__kebab"
              aria-label={`Task actions for ${title}`}
              aria-haspopup="menu"
              aria-expanded={menuOpen ? "true" : "false"}
            >
              <KebabIcon />
            </button>
            {menuOpen && (
              <ul className="task-card__menu" role="menu">
                <li>
                  <button
                    type="button"
                    role="menuitem"
                    className={`task-card__menu-item${unread > 0 ? " task-card__menu-item--primary" : ""}`}
                    aria-label="Open thread"
                  >
                    <span>Open thread</span>
                    {unread > 0 && <span className="target">{unread} UNREAD</span>}
                  </button>
                </li>
                <li><hr className="task-card__menu-divider" aria-hidden="true" /></li>
                <li className="task-card__menu-section">Request state change</li>
                <li>
                  <button type="button" role="menuitem" className="task-card__menu-item">
                    <span>Pause</span><span className="target">HOLD</span>
                  </button>
                </li>
                <li>
                  <button type="button" role="menuitem" className="task-card__menu-item">
                    <span>Mark blocked</span><span className="target">BLOCKED</span>
                  </button>
                </li>
                <li>
                  <button type="button" role="menuitem" className="task-card__menu-item" aria-disabled="true">
                    <span>Resume</span><span className="target">Already moving</span>
                  </button>
                </li>
                <li>
                  <button type="button" role="menuitem" className="task-card__menu-item">
                    <span>Push to review</span><span className="target">REVIEW</span>
                  </button>
                </li>
                <li>
                  <button type="button" role="menuitem" className="task-card__menu-item">
                    <span>Mark done</span><span className="target">DONE</span>
                  </button>
                </li>
                <li><hr className="task-card__menu-divider" aria-hidden="true" /></li>
                <li>
                  <button type="button" role="menuitem" className="task-card__menu-item task-card__menu-item--danger">
                    <span>Kill task</span><span className="target">KILLED</span>
                  </button>
                </li>
              </ul>
            )}
          </div>
          <div className="task-card__meta">
            {betTag && <Tag label={betTag} />}
            <StatusChip status={presentationStatus} />
          </div>
          <span className="task-card__owner">{owner}</span>
          {cost && <KeyValue label="Cost" value={cost} />}
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">In Progress</div>
            <TaskCard
              title="Implement login flow"
              owner="Bob Smith"
              state="in_progress"
              cost="$1.50"
              betTag="Mobile V2"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Blocked</div>
            <TaskCard
              title="Fix CI pipeline"
              owner="Alice Chen"
              state="blocked"
              cost="$0.80"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Done</div>
            <TaskCard
              title="Write unit tests"
              owner="Carol Davis"
              state="done"
              cost="$2.00"
              betTag="Sprint 1"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">With Unread Dot</div>
            <TaskCard
              title="Login endpoint review"
              owner="Bob Smith"
              state="in_progress"
              cost="$3.50"
              threadUnreadCount={3}
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">With Read Dot</div>
            <TaskCard
              title="Login endpoint review"
              owner="Bob Smith"
              state="in_progress"
              cost="$3.50"
              threadUnreadCount={0}
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Kebab Open</div>
            <TaskCard
              title="Design signup form"
              owner="Dev Agent 2"
              state="accepted"
              cost="$1.80"
              betTag="Auth"
              threadUnreadCount={2}
              menuOpen={true}
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">All States</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
              <TaskCard title="Proposed task" owner="Agent" state="proposed" />
              <TaskCard title="Accepted task" owner="Agent" state="accepted" />
              <TaskCard title="On hold" owner="Agent" state="hold" />
              <TaskCard title="In progress" owner="Agent" state="in_progress" />
              <TaskCard title="Blocked task" owner="Agent" state="blocked" />
              <TaskCard title="In review" owner="Agent" state="review" />
              <TaskCard title="Completed" owner="Agent" state="done" />
              <TaskCard title="Killed" owner="Agent" state="killed" />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
