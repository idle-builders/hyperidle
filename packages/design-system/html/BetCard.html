<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BetCard — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* ── BetCard ──
       Hearth bet card: elevated with warm shadow, 18px padding, 9px gap.
       Status through colored dots + pill badges. Description text. Full-width
       progress bar. Overlapping avatar group. Budget badge.
       Hover: shadow lifts, translateY(-2px). From 03-hearth.html. */

    .bet-card {
      background: var(--surface-elevated);
      border-radius: var(--r-default);
      box-shadow: var(--shadow-default);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      cursor: pointer;
      transition: box-shadow 240ms ease, transform 240ms ease;
      max-width: 380px;
    }
    .bet-card:hover {
      box-shadow: var(--shadow-elevated);
      transform: translateY(-2px);
    }
    .bet-card:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }
    .bet-card--completed { opacity: 0.75; }

    .bet-card__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bet-card__status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bet-card__title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }
    .bet-card__desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .bet-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 3px;
    }

    /* Status dot */
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: var(--r-pill);
      flex-shrink: 0;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge--green { background: rgba(22, 118, 79, 0.08); color: var(--accent-primary); }
    .badge--amber { background: rgba(217, 119, 6, 0.1); color: var(--accent-secondary); }
    .badge--blue { background: rgba(46, 125, 186, 0.08); color: var(--status-info); }
    .badge--default { background: var(--surface-container); color: var(--text-secondary); }

    /* Progress */
    .progress-track {
      height: 8px;
      background: var(--surface-container);
      border-radius: var(--r-pill);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: var(--r-pill);
    }
    .progress-fill--green { background: var(--accent-primary); }
    .progress-fill--amber { background: var(--accent-secondary); }

    /* Avatar in cards */
    .avatar {
      width: 24px;
      height: 24px;
      border-radius: var(--r-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      background: var(--surface-page);
      color: var(--text-secondary);
      flex-shrink: 0;
      font-family: var(--font-sans);
      line-height: 1;
      user-select: none;
      border: 1.5px solid var(--border-default);
    }
    .avatar--agent {
      background: rgba(22, 118, 79, 0.08);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }
    .avatar-group { display: flex; }
    .avatar-group .avatar {
      margin-left: -6px;
      border: 2px solid var(--surface-elevated);
    }
    .avatar-group .avatar:first-child { margin-left: 0; }

    .percent-label {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Avatar({ initials, agent }) {
      return <div className={`avatar ${agent ? 'avatar--agent' : ''}`}>{initials}</div>;
    }

    function BetCard({ title, desc, status, statusColor, statusBadge, budget, progress, progressVariant, team, completed }) {
      return (
        <div
          className={`bet-card ${completed ? 'bet-card--completed' : ''}`}
          role="button"
          tabIndex={0}
          data-component="BetCard"
          data-tier="2"
          data-uses="Avatar,AvatarGroup,Progress,Badge"
          data-daisyui=""
          data-used-by="Canvas,WorkBetOverview"
        >
          <div className="bet-card__top">
            <div className="bet-card__status">
              <span className="status-dot" style={{ background: statusColor }}></span>
              <span className={`badge badge--${statusBadge}`}>{status}</span>
            </div>
            {budget && <span className="badge badge--amber">{budget}</span>}
          </div>
          <div className="bet-card__title">{title}</div>
          {desc && <div className="bet-card__desc">{desc}</div>}
          <div className="progress-track">
            <div className={`progress-fill progress-fill--${progressVariant || 'green'}`} style={{ width: `${progress}%` }}></div>
          </div>
          <div className="bet-card__footer">
            <div className="avatar-group">
              {team.map((m, i) => <Avatar key={i} initials={m.initials} agent={m.agent} />)}
            </div>
            <span className="percent-label">{progress}%</span>
          </div>
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Active</div>
            <BetCard
              title="Auth migration"
              desc="Replace password-based auth with WebAuthn passkeys. Target: 60% reduction in auth support tickets."
              status="Active"
              statusColor="var(--accent-primary)"
              statusBadge="green"
              budget="$2,400"
              progress={35}
              team={[{ initials: 'TG' }, { initials: 'KL' }, { initials: 'AT', agent: true }]}
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">At Risk</div>
            <BetCard
              title="Search rewrite"
              desc="Replace Elasticsearch with a hybrid vector + keyword search. Sub-200ms p95 latency target."
              status="At risk"
              statusColor="var(--accent-secondary)"
              statusBadge="amber"
              budget="$5,000"
              progress={68}
              progressVariant="amber"
              team={[{ initials: 'JS' }, { initials: 'AT', agent: true }, { initials: 'MR' }]}
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Draft</div>
            <BetCard
              title="Billing overhaul"
              desc="Usage-based billing with agent compute metering. Replace flat-rate plans with per-token pricing."
              status="Draft"
              statusColor="var(--status-info)"
              statusBadge="blue"
              budget="$3,800"
              progress={0}
              team={[{ initials: 'JS' }]}
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Completed</div>
            <BetCard
              title="Onboarding v3"
              desc="New guided onboarding flow with agent introduction. Reduced time-to-value from 8 min to 2 min."
              status="Completed"
              statusColor="var(--border-strong)"
              statusBadge="default"
              budget="$1,200"
              progress={100}
              completed
              team={[{ initials: 'TG' }, { initials: 'KL' }]}
            />
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
