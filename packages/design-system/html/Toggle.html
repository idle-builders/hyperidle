<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toggle — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* ── Toggle / Switch ──
       44x24 track, 18px thumb. Off: border-default track. On: accent-primary track.
       Expressive easing on thumb movement. Optional label + description.
       From 03-hearth.html component library. */

    .toggle {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
    }
    .toggle-track {
      width: 44px;
      height: 24px;
      border-radius: var(--r-pill);
      background: var(--border-default);
      position: relative;
      flex-shrink: 0;
      transition: background 240ms cubic-bezier(0.25, 0.1, 0.25, 1);
      margin-top: 1px;
    }
    .toggle-track--on {
      background: var(--accent-primary);
    }
    .toggle-thumb {
      width: 18px;
      height: 18px;
      background: var(--surface-elevated);
      border-radius: var(--r-pill);
      position: absolute;
      top: 3px;
      left: 3px;
      box-shadow: 0 1px 4px rgba(44, 36, 26, 0.06);
      transition: left 240ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .toggle-track--on .toggle-thumb {
      left: 23px;
    }
    .toggle-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .toggle-desc {
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Toggle({ on, label, description }) {
      return (
        <div className="toggle" data-ds-component="Toggle" data-tier="0">
          <div className={`toggle-track ${on ? 'toggle-track--on' : ''}`}>
            <div className="toggle-thumb"></div>
          </div>
          <div className="toggle-text">
            <span className="toggle-label">{label}</span>
            {description && <span className="toggle-desc">{description}</span>}
          </div>
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Toggle States</div>
            <div className="demo-card" style={{ maxWidth: 400, display: 'flex', flexDirection: 'column', gap: 18 }}>
              <Toggle on label="Agent auto-reply" description="Let agents respond automatically to new messages" />
              <Toggle label="Email notifications" description="Receive email digests for unread threads" />
              <Toggle on label="Knowledge indexing" description="Automatically index shared documents" />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Without Description</div>
            <div className="demo-card" style={{ maxWidth: 400, display: 'flex', flexDirection: 'column', gap: 12 }}>
              <Toggle on label="Dark mode" />
              <Toggle label="Compact sidebar" />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
