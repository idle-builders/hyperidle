<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlockHandle — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    body { font-family: var(--ui); color: var(--text); background: var(--surface-0); margin: 0; padding: 24px; }
    .demo-grid { display: flex; flex-direction: column; gap: 24px; max-width: 480px; }
    .demo-section { display: flex; flex-direction: column; gap: 8px; }
    .demo-section-title { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-lo); }
    .block-handle {
      display: inline-flex; align-items: center; gap: 4px; width: 20px; height: 20px;
      justify-content: center; border-radius: var(--r1); color: var(--text-mid);
      cursor: pointer; background: transparent; border: none; padding: 0;
    }
    .block-handle:hover { background: var(--surface-2); }
    .block-handle:focus-visible { outline: 1px solid var(--primary); }
    .block-handle .count { font-family: var(--mono); font-size: 10px; color: var(--text-mid); }
    .block-handle.is-open svg { transform: rotate(90deg); }
    .block-handle svg { transition: transform var(--motion-fast, 120ms); }
  </style>
</head>
<body>
  <div id="root">
    <div class="demo-grid">
      <div class="demo-section">
        <div class="demo-section-title">Default / Hover / Open</div>
        <div style="display: flex; gap: 16px; align-items: center;">
          <button type="button" class="block-handle" data-ds-component="block-handle" data-ds-tier="2" data-ds-source="design-system" aria-expanded="false" aria-controls="popover-1" aria-label="Block actions">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6" /></svg>
          </button>

          <button type="button" class="block-handle" data-ds-component="block-handle" data-ds-tier="2" data-ds-source="design-system" aria-expanded="false" aria-controls="popover-2" aria-label="Block actions (3 threads)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6" /></svg>
            <span class="count">3</span>
          </button>

          <button type="button" class="block-handle is-open" data-ds-component="block-handle" data-ds-tier="2" data-ds-source="design-system" aria-expanded="true" aria-controls="popover-3" aria-label="Block actions">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6" /></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
