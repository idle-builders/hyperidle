<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkbox — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* ── Checkbox ──
       20x20 box, 6px radius. Unchecked: border-default, elevated bg.
       Checked: accent-primary fill, white checkmark. From 03-hearth.html. */

    .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }
    .checkbox-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--border-default);
      background: var(--surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .checkbox-box--checked {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }
    .checkbox-box--checked::after {
      content: '';
      width: 6px;
      height: 10px;
      border: 2px solid var(--text-on-accent);
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
    }
    .checkbox-label {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Checkbox({ checked, label }) {
      return (
        <div className="checkbox" data-ds-component="Checkbox" data-tier="0">
          <div className={`checkbox-box ${checked ? 'checkbox-box--checked' : ''}`}></div>
          <span className="checkbox-label">{label}</span>
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Checkbox States</div>
            <div className="demo-card" style={{ maxWidth: 300, display: 'flex', flexDirection: 'column', gap: 9 }}>
              <Checkbox checked label="Deploy to staging" />
              <Checkbox checked label="Run integration tests" />
              <Checkbox label="Deploy to production" />
              <Checkbox label="Send release notes" />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
