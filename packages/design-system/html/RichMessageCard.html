<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RichMessageCard — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* L11 — RichMessageCard mirror. Card body + sticky-within-card footer.
       Per visual-parity rules: this HTML is the design source of truth.
       The TSX must match within 5% pixel diff. */
    body { background: var(--surface-0); padding: 24px; font-family: var(--ui); }
    .card {
      margin-left: 36px;
      max-width: 720px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--r2);
      overflow: hidden;
    }
    .card--blocking { border-left: 2px solid var(--danger); }
    .card__strip {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px 6px 12px;
      font-size: 12px; color: var(--text-mid);
      flex-wrap: wrap;
    }
    .tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px; font-family: var(--mono);
      letter-spacing: 0.03em; white-space: nowrap;
      background: color-mix(in oklab, var(--primary) 18%, transparent);
      color: var(--primary);
      flex-shrink: 0;
    }
    .card__sender { color: var(--text-hi); font-weight: 500; }
    .card__role { color: var(--text-lo); }
    .card__title {
      padding: 0 12px 6px 12px;
      font-size: 16px; font-weight: 600;
      color: var(--text-hi); margin: 0;
    }
    .card__reasoning-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 8px;
      margin: 0 12px 8px 12px;
      background: var(--surface-3);
      border-radius: var(--r1);
      font-size: 12px; color: var(--text-mid);
      cursor: pointer; border: none;
      font-family: inherit; width: fit-content;
    }
    .card__body { padding: 0 12px 12px 12px; }
    .artifact {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r1);
      padding: 8px 10px;
      font-size: 12px; color: var(--text-mid);
      font-family: var(--mono);
    }
    .card__divider { height: 1px; background: var(--border-subtle); }
    .card__actions {
      position: sticky; bottom: 0;
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 10px 12px;
      background: var(--surface-2);
      border-top: 1px solid var(--border-subtle);
    }
    .btn {
      padding: 6px 12px; min-height: 44px;
      border-radius: var(--r1);
      font-size: 13px; font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer; font-family: inherit;
    }
    .btn--primary { background: var(--primary); color: var(--surface-0); }
    .btn--ghost {
      background: transparent; color: var(--text-mid);
      border-color: var(--border-default);
    }
    .btn--danger {
      background: transparent; color: var(--danger);
      border-color: color-mix(in oklab, var(--danger) 30%, transparent);
    }
  </style>
</head>
<body>
  <section
    class="card card--blocking"
    data-component="RichMessageCard"
    data-tier="2"
    data-uses="ArtifactView"
    data-message-type="review"
    data-promoted="true"
    data-blocking="true"
    data-sticky-footer="true"
  >
    <div class="card__strip">
      <span class="tag">REVIEW</span>
      <span class="card__sender">Maya</span>
      <span class="card__role">· Product Manager</span>
    </div>
    <h3 class="card__title">Approve deploy of v2.4 to staging</h3>
    <button type="button" class="card__reasoning-toggle" aria-expanded="false">
      3 reasons
    </button>
    <div class="card__body">
      <div class="artifact" data-component="ArtifactView" data-tier="3">
        text_diff · 2 hunks · staging
      </div>
    </div>
    <div class="card__divider"></div>
    <div class="card__actions" role="toolbar" aria-label="Verdict actions" data-sticky="bottom">
      <button type="button" class="btn btn--primary">Approve</button>
      <button type="button" class="btn btn--ghost">Approve with comments</button>
      <button type="button" class="btn btn--ghost">Request changes</button>
      <button type="button" class="btn btn--ghost">Edit</button>
      <button type="button" class="btn btn--danger">Reject</button>
    </div>
  </section>
  <script src="themes/_switcher.js"></script>
</body>
</html>
