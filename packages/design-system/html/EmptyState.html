<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EmptyState — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* ── EmptyState ──
       Warm, inviting empty state. Page-bg card with icon, title, description,
       and optional action button. Left-aligned (not centered — anti AI-aesthetic).
       Fixed Hearth spacing. From 03-hearth.html card variants. */

    .empty-state {
      background: var(--surface-page);
      border-radius: var(--r-default);
      padding: 36px;
      max-width: 420px;
      text-align: left;
    }
    .empty-state__icon {
      width: 48px;
      height: 48px;
      border-radius: var(--r-default);
      background: rgba(22, 118, 79, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 18px;
      color: var(--accent-primary);
    }
    .empty-state__title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 9px;
      letter-spacing: -0.01em;
    }
    .empty-state__description {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .empty-state__action {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: var(--r-pill);
      border: 1.5px solid transparent;
      cursor: pointer;
      background: var(--accent-primary);
      color: var(--text-on-accent);
      transition: all 240ms ease;
    }
    .empty-state__action:hover {
      background: var(--accent-primary-hover);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function EmptyState({ icon, title, description, actionLabel }) {
      return (
        <div
          role="status"
          className="empty-state"
          data-component="EmptyState"
          data-tier="2"
          data-uses="Button"
          data-daisyui=""
          data-used-by="KnowledgeList,ConversationsChat,WorkPortfolio"
        >
          {icon && <div className="empty-state__icon">{icon}</div>}
          <p className="empty-state__title">{title}</p>
          <p className="empty-state__description">{description}</p>
          {actionLabel && <button className="empty-state__action">{actionLabel}</button>}
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Conversations Empty</div>
            <EmptyState
              icon={
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
              }
              title="No conversations yet"
              description="Start a thread to coordinate with your team and agents. Conversations are where decisions happen."
              actionLabel="Start a thread"
            />
          </div>
          <div className="demo-section">
            <div className="demo-section-title">Knowledge Empty</div>
            <EmptyState
              icon={
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
              }
              title="Your knowledge base is empty"
              description="Knowledge items capture patterns, decisions, and lessons learned. Agents will populate this as they work."
              actionLabel="Create first item"
            />
          </div>
          <div className="demo-section">
            <div className="demo-section-title">Without Action</div>
            <EmptyState
              title="No results found"
              description="Try adjusting your search terms or removing filters."
            />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
