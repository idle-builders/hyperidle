<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>L11 Approved — Inline rich messages</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    /* Approved design: variant B (message-card) base + variant A
       promotion rule for secondary rich messages + variant C
       sticky-within-message footer. No top header above
       ThreadHostBanner. No drop-shadow on the card. Reasoning
       collapsed-by-default for long content; inline for short. */

    body { background: var(--surface-page); padding: 24px; }

    .pane {
      display: flex; flex-direction: column;
      max-width: 880px; margin: 0 auto;
      background: var(--surface-container);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-default);
      overflow: hidden;
    }

    /* HostBanner (only chrome above the stream) */
    .host-banner {
      display: flex; align-items: center; gap: 12px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-bottom: 1px solid var(--border-subtle);
    }
    .host-banner__back {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      border-radius: var(--r-subtle);
      color: var(--text-secondary); flex-shrink: 0;
    }
    .host-banner__back:hover { background: color-mix(in oklab, var(--text-secondary) 8%, transparent); color: var(--text-primary); }
    .host-banner__main { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .host-banner__title { color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: color-mix(in oklab, var(--text-secondary) 8%, transparent);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .tag--decision {
      background: color-mix(in oklab, var(--accent-primary) 18%, transparent);
      color: var(--accent-primary);
    }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      flex-shrink: 0;
    }
    .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-chip--blocked {
      background: color-mix(in oklab, var(--status-error) 14%, transparent);
      color: var(--status-error);
    }
    .status-chip--blocked .dot { background: var(--status-error); }
    .status-chip--done {
      background: color-mix(in oklab, var(--status-success) 14%, transparent);
      color: var(--status-success);
    }
    .status-chip--done .dot { background: var(--status-success); }

    /* Stream */
    .stream {
      display: flex; flex-direction: column;
      gap: 12px;
      padding: 12px var(--density-pad-x);
      list-style: none;
      margin: 0;
    }

    /* Plain CommentRow */
    .row {
      display: flex; gap: 8px;
    }
    .row__avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface-elevated);
      color: var(--text-secondary);
      font-size: 11px; font-weight: 500;
      border: 1px solid var(--border-subtle);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .row__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .row__header { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .row__sender { color: var(--text-primary); font-weight: 500; }
    .row__role { color: var(--text-tertiary); }
    .row__meta { color: var(--text-tertiary); font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; }
    .row__time { color: var(--text-tertiary); margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }
    .row__text { font-size: 13px; color: var(--text-secondary); margin: 0; }
    .row__verdict { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .row__verdict-note { color: var(--text-tertiary); }

    /* Rich row variant (for SECONDARY rich messages — pull-in from variant A) */
    .row--rich .row__body { gap: 6px; }
    .row__rich-meta {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }
    .row__rich-title {
      font-size: 14px; font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }
    .row__rich-reasoning {
      list-style: decimal;
      padding-left: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      margin: 2px 0;
    }
    .row__rich-reasoning li { margin: 2px 0; }
    .row__rich-actions {
      display: flex; flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    /* RichMessageCard — variant B base */
    .card {
      margin-left: 36px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-default);
      overflow: hidden;
      /* No drop-shadow per Fix 1 */
    }
    .card--blocking {
      border-left: 2px solid var(--status-error);
    }
    .card__strip {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px 6px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .card__sender { color: var(--text-primary); font-weight: 500; }
    .card__role { color: var(--text-tertiary); }
    .card__meta { color: var(--text-tertiary); font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; }
    .card__time { margin-left: auto; color: var(--text-tertiary); font-size: 11px; font-variant-numeric: tabular-nums; }
    .card__title {
      padding: 0 12px 6px 12px;
      font-size: 16px; font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }
    .card__reasoning-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 8px;
      margin: 0 12px 8px 12px;
      background: var(--surface-container);
      border-radius: var(--r-subtle);
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      border: none;
      font-family: inherit;
      width: fit-content;
    }
    .card__reasoning-toggle:hover { background: var(--surface-elevated); color: var(--text-primary); }
    .card__reasoning-toggle .chevron { width: 10px; height: 10px; }
    .card__reasoning-inline {
      padding: 0 12px 8px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }
    .card__reasoning {
      padding: 0 12px 8px 36px;
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }
    .card__reasoning li { margin: 2px 0; }
    .card__body { padding: 0 12px 12px 12px; }

    /* Inline ArtifactView */
    .artifact {
      background: var(--surface-container);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-default);
      overflow: hidden;
    }
    .artifact__strip {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .artifact__kind {
      padding: 1px 6px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-subtle);
      text-transform: uppercase;
    }
    .artifact__label { color: var(--text-tertiary); }
    .artifact__value { color: var(--text-primary); }
    .artifact__routing { margin-left: auto; }
    .artifact__body { padding: 8px 10px; max-height: 220px; overflow-y: auto; }
    .diff {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre;
      overflow-x: auto;
    }
    .diff__hunk-header { color: var(--text-tertiary); padding: 2px 0; }
    .diff__line { display: block; padding: 0 4px; }
    .diff__line--add {
      background: color-mix(in oklab, var(--status-success) 14%, transparent);
      color: var(--text-primary);
    }
    .diff__line--del {
      background: color-mix(in oklab, var(--status-error) 14%, transparent);
      color: var(--text-primary);
    }
    .diff__prefix { color: var(--text-tertiary); user-select: none; margin-right: 6px; }

    /* Card divider + footer actions (sticky-within-card per pull-in 2) */
    .card__divider { height: 1px; background: var(--border-subtle); }
    .card__actions {
      position: sticky; bottom: 0;
      display: flex; flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface-elevated);
      border-top: 1px solid var(--border-subtle);
    }

    .btn {
      padding: 6px 12px;
      border-radius: var(--r-subtle);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background var(--motion-fast);
      font-family: inherit;
    }
    .btn--primary { background: var(--accent-primary); color: var(--surface-page); }
    .btn--primary:hover { filter: brightness(1.05); }
    .btn--ghost {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--border-subtle);
    }
    .btn--ghost:hover { background: color-mix(in oklab, var(--text-secondary) 8%, transparent); color: var(--text-primary); }
    .btn--danger {
      background: transparent;
      color: var(--status-error);
      border-color: color-mix(in oklab, var(--status-error) 30%, transparent);
    }
    .btn--danger:hover { background: color-mix(in oklab, var(--status-error) 8%, transparent); }
    .btn--sm { padding: 5px 10px; font-size: 12px; }

    /* Resolved card mode */
    .card--resolved {
      background: var(--surface-elevated);
      border-left-width: 1px;
      border-color: var(--border-subtle);
    }
    .card__resolved-strip {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .card__resolved-strip .verdict-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .card__resolved-strip .verdict-label--ok { color: var(--status-success); }
    .card__resolved-strip .verdict-actor { color: var(--text-tertiary); margin-left: 4px; font-size: 12px; }
    .card__resolved-strip .verdict-time { color: var(--text-tertiary); font-size: 11px; font-variant-numeric: tabular-nums; }
    .card__resolved-strip .verdict-title { color: var(--text-primary); }
    .card__resolved-strip .reexpand {
      margin-left: auto;
      color: var(--text-tertiary);
      font-size: 12px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .card__resolved-strip .reexpand:hover { color: var(--text-primary); }

    /* Composer */
    .composer {
      display: flex; align-items: stretch; gap: 8px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-container);
    }
    .composer__textarea {
      flex: 1; min-height: 36px;
      background: var(--surface-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-subtle);
      padding: 8px 10px; font-size: 13px;
      resize: vertical;
    }
    .composer__send {
      align-self: flex-end;
      padding: 6px 14px;
      border-radius: var(--r-subtle);
      font-size: 13px; font-weight: 500;
      background: var(--accent-primary); color: var(--surface-page);
      border: none; cursor: pointer;
    }

    /* Annotation labels for the synthesis screenshot */
    .annot {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-primary);
      padding: 2px 6px;
      border: 1px dashed color-mix(in oklab, var(--accent-primary) 40%, transparent);
      border-radius: var(--r-subtle);
      margin-left: 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">

    function HostBanner() {
      return (
        <div className="host-banner" data-component="ThreadHostBanner" data-tier="3">
          <a className="host-banner__back" href="#" aria-label="Back to queue">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </a>
          <div className="host-banner__main">
            <span className="tag">BET</span>
            <span className="host-banner__title">Pricing overhaul (Acme)</span>
          </div>
          <span className="status-chip status-chip--blocked"><span className="dot" />BLOCKED</span>
        </div>
      );
    }

    function PlainRow({ name, role, text, time }) {
      return (
        <li className="row" data-component="CommentRow" data-tier="2">
          <span className="row__avatar">{name.charAt(0).toUpperCase()}</span>
          <div className="row__body">
            <div className="row__header">
              <span className="row__sender">{name}</span>
              <span className="row__role">· {role}</span>
              <span className="row__time">{time}</span>
            </div>
            <p className="row__text">{text}</p>
          </div>
        </li>
      );
    }

    function ChevronDown({ open }) {
      return (
        <svg className="chevron" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" strokeWidth="2"
             style={{ transform: open ? "rotate(0deg)" : "rotate(-90deg)", transition: "transform 150ms" }}>
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      );
    }

    /* The PROMOTED rich message — RichMessageCard (variant B base + Fix 1 + Fix 2) */
    function PromotedReviewCard({ blocking }) {
      const [showReasoning, setShowReasoning] = React.useState(false);
      return (
        <li>
          <div
            className={"card " + (blocking ? "card--blocking" : "")}
            data-component="RichMessageCard"
            data-tier="2"
            data-uses="ArtifactView"
            data-message-type="review"
            data-promoted="true"
          >
            <div className="card__strip">
              <span className="tag tag--decision">REVIEW</span>
              <span className="card__sender">Maya</span>
              <span className="card__role">· Product Manager</span>
              <span className="card__meta">· #2</span>
              <span className="card__time">18 min ago</span>
            </div>
            <h3 className="card__title">Approve deploy of v2.4 to staging</h3>

            {/* Long reasoning => collapsed-by-default toggle (Fix 2) */}
            <button
              type="button"
              className="card__reasoning-toggle"
              onClick={() => setShowReasoning((p) => !p)}
              aria-expanded={showReasoning}
            >
              <ChevronDown open={showReasoning} />
              {showReasoning ? "Hide reasoning" : "3 reasons"}
            </button>
            {showReasoning ? (
              <ol className="card__reasoning">
                <li>Schema migration adds two columns; backfill verified.</li>
                <li>All 142 contract tests pass; integration suite green.</li>
                <li>Cost cap reduced 8%; budget headroom OK.</li>
              </ol>
            ) : null}

            <div className="card__body">
              <div className="artifact" data-component="ArtifactView" data-tier="3">
                <div className="artifact__strip">
                  <span className="artifact__kind">text_diff</span>
                  <span className="artifact__label">status</span>
                  <span className="artifact__value">in review</span>
                  <span className="artifact__label">sla</span>
                  <span className="artifact__value">2h</span>
                  <span className="artifact__routing artifact__label">routing</span>
                  <span className="artifact__value">staging</span>
                </div>
                <div className="artifact__body">
                  <div className="diff">
                    <div className="diff__hunk-header">@@ -42,7 +42,9 @@ migrations/v2.4/schema.sql</div>
                    <span className="diff__line"><span className="diff__prefix"> </span>CREATE TABLE products (</span>
                    <span className="diff__line"><span className="diff__prefix"> </span>  id UUID PRIMARY KEY,</span>
                    <span className="diff__line diff__line--add"><span className="diff__prefix">+</span>  cost_cap_cents INT NOT NULL DEFAULT 0,</span>
                    <span className="diff__line diff__line--add"><span className="diff__prefix">+</span>  budget_headroom_pct INT NOT NULL DEFAULT 8,</span>
                    <span className="diff__line"><span className="diff__prefix"> </span>  name TEXT NOT NULL,</span>
                    <span className="diff__line diff__line--del"><span className="diff__prefix">-</span>  legacy_cost_cap INT,</span>
                    <span className="diff__line"><span className="diff__prefix"> </span>  created_at TIMESTAMPTZ DEFAULT now()</span>
                    <span className="diff__line"><span className="diff__prefix"> </span>);</span>
                    <div className="diff__hunk-header">@@ -118,3 +120,8 @@ migrations/v2.4/schema.sql</div>
                    <span className="diff__line diff__line--add"><span className="diff__prefix">+</span>CREATE INDEX idx_products_cost_cap ON products(cost_cap_cents);</span>
                  </div>
                </div>
              </div>
            </div>
            <div className="card__divider" />
            <div className="card__actions" role="toolbar" aria-label="Verdict actions">
              <button type="button" className="btn btn--primary">Approve</button>
              <button type="button" className="btn btn--ghost">Approve with comments</button>
              <button type="button" className="btn btn--ghost">Request changes</button>
              <button type="button" className="btn btn--ghost">Edit</button>
              <button type="button" className="btn btn--danger">Reject</button>
            </div>
          </div>
        </li>
      );
    }

    function ResolvedCard() {
      return (
        <li>
          <div
            className="card card--resolved"
            data-component="RichMessageCard"
            data-tier="2"
            data-state="resolved"
          >
            <div className="card__resolved-strip">
              <span className="tag">RESOLVED</span>
              <span className="verdict-label verdict-label--ok">APPROVED</span>
              <span className="verdict-title">Roll Ambrovia bet to phase-2 with new copy.</span>
              <span className="verdict-actor">— A. Founder</span>
              <span className="verdict-time">· 14 min ago</span>
              <button type="button" className="reexpand">Re-expand ▸</button>
            </div>
          </div>
        </li>
      );
    }

    /* SECONDARY unresolved rich message — rich-row variant of CommentRow
       (pull-in from variant A). Used when a card is already promoted. */
    function SecondaryQuestionnaireRow() {
      return (
        <li className="row row--rich" data-component="CommentRow" data-variant="rich-questionnaire" data-tier="2">
          <span className="row__avatar">B</span>
          <div className="row__body">
            <div className="row__header">
              <span className="row__sender">Bob</span>
              <span className="row__role">· Builder</span>
              <span className="row__time">3 min ago</span>
            </div>
            <div className="row__rich-meta">
              <span className="tag tag--decision">QUESTION</span>
              <span>· #5 · short answer needed</span>
            </div>
            <h3 className="row__rich-title">Which retry policy for the cost-cap webhook?</h3>
            {/* Short reasoning => inline, no toggle (Fix 2) */}
            <p className="card__reasoning-inline" style={{ padding: 0, margin: "2px 0 0 0" }}>
              Pick before deploy; affects the SLA contract with downstream Ambrovia.
            </p>
            <div className="row__rich-actions" role="toolbar" aria-label="Answer options">
              <button type="button" className="btn btn--sm btn--primary">Exponential (3 tries)</button>
              <button type="button" className="btn btn--sm btn--ghost">Linear (5 tries)</button>
              <button type="button" className="btn btn--sm btn--ghost">No retry — surface failure</button>
            </div>
          </div>
        </li>
      );
    }

    function VerdictRow() {
      return (
        <li className="row" data-component="CommentRow" data-variant="verdict" data-tier="2">
          <span className="row__avatar">A</span>
          <div className="row__body">
            <div className="row__header">
              <span className="row__sender">A. Founder</span>
              <span className="row__role">· CEO</span>
              <span className="row__time">14 min ago</span>
            </div>
            <div className="row__verdict">
              <span className="status-chip status-chip--done"><span className="dot" />APPROVED</span>
              <span className="row__verdict-note">— Good copy; ship.</span>
            </div>
          </div>
        </li>
      );
    }

    function App() {
      return (
        <div className="pane" data-component="ThreadShell" data-tier="3"
             data-uses="ThreadHostBanner,CommentRow,RichMessageCard,ArtifactView,Composer">
          <HostBanner />
          <ul className="stream">
            <PlainRow name="Maya" role="Product Manager"
              text="Heads-up — submitting the v2.4 staging deploy for review. Cost-cap headroom looks healthy."
              time="22 min ago" />
            <ResolvedCard />
            <VerdictRow />
            <PromotedReviewCard blocking={true} />
            <SecondaryQuestionnaireRow />
            <PlainRow name="Bob" role="Builder"
              text="Quick note: I had to bump the integration test timeout to 90s. Flake on the migration step otherwise."
              time="9 min ago" />
          </ul>
          <div className="composer" data-component="Composer" data-tier="2">
            <textarea className="composer__textarea" placeholder="Reply to thread…" defaultValue="" />
            <button type="button" className="composer__send">Send</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
