<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveDot — Hearth Design System</title>
    <link rel="stylesheet" href="/tokens.css" />
    <style>
      body {
        background: var(--surface-base);
        color: var(--text-hi);
        font-family: var(--font-sans);
        padding: 32px;
        display: flex;
        gap: 24px;
        align-items: center;
      }
      .label {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <!-- LiveDot — the live-activity pulse indicator -->
      <span
        aria-hidden="true"
        style="
          display: inline-block;
          width: 6px;
          height: 6px;
          border-radius: 9999px;
          background: var(--accent-primary);
          flex-shrink: 0;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        "
      ></span>
      <span class="label">In progress</span>
    </div>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </body>
</html>
