<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ArtifactGalleryCard — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    body { background: var(--surface-container); color: var(--text-primary); font-family: var(--ui); padding: 24px; display: grid; grid-template-columns: 280px 280px; gap: 16px; }
    .artifact-gallery-card {
      background: var(--surface-elevated);
      border-radius: var(--r-default);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }
    .artifact-gallery-card:hover { background: var(--surface-elevated); }
    .gallery-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .gallery-title { font-size: 15px; font-weight: 500; color: var(--text-primary); line-height: 1.3; }
    .gallery-preview {
      background: var(--surface-container);
      border-radius: var(--r-subtle);
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
    }
    .gallery-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-secondary);
    }
    .thread-pill {
      background: color-mix(in oklab, var(--text-secondary) 8%, transparent);
      color: var(--text-secondary);
      border-radius: var(--r-pill);
      padding: 2px 8px;
    }
    .sep { color: var(--text-tertiary); }
  </style>
</head>
<body>
  <div class="artifact-gallery-card" data-component="ArtifactGalleryCard" data-tier="2">
    <div class="gallery-header">
      <span class="artifact-kind-badge">DRAFTED EMAIL</span>
      <span class="sep">·</span>
      <span>Implement auth flow</span>
    </div>
    <div class="gallery-title">Welcome — onboarding sequence v2</div>
    <div class="gallery-preview" data-component="ArtifactPreviewSurface">SUBJECT: WELCOME · BODY: HI THERE…</div>
    <div class="gallery-footer">
      <span>$0.42 <span class="sep">·</span> 12.4k <span class="sep">·</span> 12 min ago</span>
      <span class="thread-pill">3 threads</span>
    </div>
  </div>

  <div class="artifact-gallery-card" data-component="ArtifactGalleryCard" data-tier="2">
    <div class="gallery-header">
      <span class="artifact-kind-badge">DESIGN</span>
      <span class="sep">·</span>
      <span>Sketch hero v2</span>
    </div>
    <div class="gallery-title">Hero illustration</div>
    <div class="gallery-preview">PREVIEW PENDING</div>
    <div class="gallery-footer">
      <span>—</span>
    </div>
  </div>
</body>
</html>
