<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KeyValue — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .kv {
      display: flex;
      gap: 4px;
    }

    .kv--inline {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .kv--stacked {
      flex-direction: column;
    }

    .kv__label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-lo);
      white-space: nowrap;
    }

    .kv__value {
      font-family: var(--ui);
      font-size: var(--density-text);
      color: var(--text-hi);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function KeyValue({ label, value, layout = "inline" }) {
      const layoutClass = layout === "stacked" ? "kv--stacked" : "kv--inline";

      return (
        <div
          className={`kv ${layoutClass}`}
          data-component="KeyValue"
          data-tier="1"
          data-uses=""
          data-daisyui=""
          data-used-by="BetCard,PitchCard,TaskCard,Rail"
        >
          <span className="kv__label">{label}</span>
          <span className="kv__value">{value}</span>
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Inline Layout (Default)</div>
            <div className="demo-card" style={{ maxWidth: "320px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                <KeyValue label="Status" value="Running" />
                <KeyValue label="Owner" value="Agent-12" />
                <KeyValue label="Sprint" value="2026-W16" />
                <KeyValue label="Priority" value="High" />
              </div>
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Stacked Layout</div>
            <div className="demo-card" style={{ maxWidth: "320px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                <KeyValue label="Owner" value="Agent-12" layout="stacked" />
                <KeyValue label="Sprint" value="2026-W16" layout="stacked" />
                <KeyValue label="Priority" value="High" layout="stacked" />
              </div>
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Long Values</div>
            <div className="demo-card" style={{ maxWidth: "420px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                <KeyValue label="Endpoint" value="https://api.hyperidle.io/v1/agents/health" />
                <KeyValue label="Commit" value="a7f3e2b1c9d4f6a8e0b2c4d6f8a0b2c4" />
              </div>
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Short Labels</div>
            <div className="demo-card" style={{ maxWidth: "200px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                <KeyValue label="ID" value="a7f3" />
                <KeyValue label="Rev" value="42" />
              </div>
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Side by Side Comparison</div>
            <div className="demo-row">
              <div className="demo-card" style={{ width: "240px" }}>
                <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                  <KeyValue label="Layout" value="inline" />
                  <KeyValue label="Alignment" value="row" />
                </div>
              </div>
              <div className="demo-card" style={{ width: "240px" }}>
                <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                  <KeyValue label="Layout" value="stacked" layout="stacked" />
                  <KeyValue label="Alignment" value="column" layout="stacked" />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
