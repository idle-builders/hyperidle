<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReviewVerdictBar — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* Layout mirrors ReviewVerdictBar.tsx — sticky surface above the
       composer. 5 binding verdict buttons. Density tokens for vertical
       padding per AQ-002. Non-binding replies and sidecar actions land
       in L1b — see ReviewVerdictBar.tsx @lore. */
    .verdict-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-1);
    }

    .btn {
      padding: 6px 10px;
      border-radius: var(--r1);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background var(--motion-fast), opacity var(--motion-fast);
      white-space: nowrap;
    }
    .btn--primary {
      background: var(--accent);
      color: var(--accent-on);
    }
    .btn--primary:hover { opacity: 0.9; }
    .btn--neutral {
      background: var(--surface-2);
      color: var(--text-mid);
    }
    .btn--neutral:hover { background: var(--surface-ghost); }
    .btn--danger {
      background: color-mix(in oklab, var(--danger) 14%, transparent);
      color: var(--danger);
    }
    .btn--danger:hover {
      background: color-mix(in oklab, var(--danger) 22%, transparent);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    const BINDING = [
      { action: "approve", label: "Approve", tone: "primary" },
      { action: "approve-with-comments", label: "Approve with comments", tone: "primary" },
      { action: "request-changes", label: "Request changes", tone: "neutral" },
      { action: "edit", label: "Edit", tone: "neutral" },
      { action: "reject", label: "Reject", tone: "danger" },
    ];

    function ReviewVerdictBar() {
      return (
        <div
          className="verdict-bar"
          data-component="ReviewVerdictBar"
          data-tier="2"
        >
          {BINDING.map((b) => (
            <button key={b.action} type="button" className={`btn btn--${b.tone}`}>
              {b.label}
            </button>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ReviewVerdictBar />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
