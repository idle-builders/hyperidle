<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Input — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* ── Input ──
       Text input, textarea, and input groups (label + input + hint/error).
       16px default radius, 1.5px border, elevated bg, accent focus ring.
       From 03-hearth.html component library. */

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .input-hint {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .input {
      font-family: var(--font-sans);
      font-size: 15px;
      padding: 10px 12px;
      border: 1.5px solid var(--border-default);
      border-radius: var(--r-default);
      background: var(--surface-elevated);
      color: var(--text-primary);
      outline: none;
      width: 280px;
      transition: border-color 240ms cubic-bezier(0.25, 0.1, 0.25, 1),
                  box-shadow 240ms cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(22, 118, 79, 0.1);
    }
    .input::placeholder { color: var(--text-placeholder); }

    /* Error state */
    .input--error {
      border-color: var(--status-error);
    }
    .input--error:focus {
      border-color: var(--status-error);
      box-shadow: 0 0 0 3px rgba(220, 74, 58, 0.1);
    }
    .input-error-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--status-error);
    }

    /* Textarea */
    textarea.input {
      resize: vertical;
      min-height: 80px;
      line-height: 1.55;
    }

    /* Disabled */
    .input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Default Input</div>
            <div className="demo-card" style={{ maxWidth: 320 }}>
              <div className="input-group" data-component="Input" data-tier="0">
                <label className="input-label">Thread title</label>
                <input className="input" type="text" placeholder="Enter a thread title..." />
                <span className="input-hint">Required. Max 120 characters.</span>
              </div>
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">With Value (click to see focus ring)</div>
            <div className="demo-card" style={{ maxWidth: 320 }}>
              <div className="input-group" data-component="Input" data-tier="0">
                <label className="input-label">Search</label>
                <input className="input" type="text" defaultValue="passkey migration" />
              </div>
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Error State</div>
            <div className="demo-card" style={{ maxWidth: 320 }}>
              <div className="input-group" data-component="Input" data-tier="0">
                <label className="input-label">Budget</label>
                <input className="input input--error" type="text" defaultValue="-500" />
                <span className="input-error-text">Budget must be a positive number</span>
              </div>
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Textarea</div>
            <div className="demo-card" style={{ maxWidth: 320 }}>
              <div className="input-group" data-component="Input" data-tier="0">
                <label className="input-label">Description</label>
                <textarea className="input" placeholder="Describe the bet outcome..."></textarea>
              </div>
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Disabled</div>
            <div className="demo-card" style={{ maxWidth: 320 }}>
              <div className="input-group" data-component="Input" data-tier="0">
                <label className="input-label">Read-only field</label>
                <input className="input" type="text" defaultValue="Cannot edit this" disabled />
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
