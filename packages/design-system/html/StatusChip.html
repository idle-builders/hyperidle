<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StatusChip — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
    }

    .status-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Status variants */
    .status-chip--healthy {
      background: color-mix(in oklab, var(--status-success) 14%, transparent);
      color: var(--status-success);
    }
    .status-chip--healthy .dot { background: var(--status-success); }

    .status-chip--behind {
      background: color-mix(in oklab, var(--status-warning) 14%, transparent);
      color: var(--status-warning);
    }
    .status-chip--behind .dot { background: var(--status-warning); }

    .status-chip--blocked {
      background: color-mix(in oklab, var(--status-error) 14%, transparent);
      color: var(--status-error);
    }
    .status-chip--blocked .dot { background: var(--status-error); }

    .status-chip--paused {
      background: color-mix(in oklab, var(--status-info) 14%, transparent);
      color: var(--status-info);
    }
    .status-chip--paused .dot { background: var(--status-info); }

    .status-chip--done {
      background: color-mix(in oklab, var(--status-success) 14%, transparent);
      color: var(--status-success);
    }
    .status-chip--done .dot { background: var(--status-success); }

    .status-chip--error {
      background: color-mix(in oklab, var(--status-error) 14%, transparent);
      color: var(--status-error);
    }
    .status-chip--error .dot { background: var(--status-error); }

    .status-chip--unknown {
      background: color-mix(in oklab, var(--text-tertiary) 14%, transparent);
      color: var(--text-tertiary);
    }
    .status-chip--unknown .dot { background: var(--text-tertiary); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    const KNOWN_STATUSES = new Set(["healthy", "behind", "blocked", "paused", "done", "error"]);

    function StatusChip({ status }) {
      const safeStatus = typeof status === "string" && KNOWN_STATUSES.has(status) ? status : "unknown";

      return (
        <span
          className={`status-chip status-chip--${safeStatus}`}
          title={safeStatus}
          data-component="StatusChip"
          data-tier="1"
          data-uses=""
          data-daisyui="badge"
          data-used-by="ThreadRow,BetCard,PitchCard,TaskCard,KnowledgeRow,NotificationRow,Rail,ReviewHeader"
          data-ds-component="StatusChip"
          data-ds-tier="1"
          data-ds-source="design-system"
        >
          <span className="dot" />
          {safeStatus.toUpperCase()}
        </span>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">All Status Variants</div>
            <div className="demo-row">
              <StatusChip status="healthy" />
              <StatusChip status="behind" />
              <StatusChip status="blocked" />
              <StatusChip status="paused" />
              <StatusChip status="done" />
              <StatusChip status="error" />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Unknown / Fallback</div>
            <div className="demo-row">
              <StatusChip status="unknown" />
              <StatusChip status={undefined} />
              <StatusChip status="some-new-status" />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">In Context (Demo Card)</div>
            <div className="demo-card">
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <StatusChip status="healthy" />
                  <span style={{ color: "var(--text-secondary)", fontSize: "13px" }}>Agent is running normally</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <StatusChip status="blocked" />
                  <span style={{ color: "var(--text-secondary)", fontSize: "13px" }}>Waiting on external dependency</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <StatusChip status="error" />
                  <span style={{ color: "var(--text-secondary)", fontSize: "13px" }}>Build failed, needs intervention</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
