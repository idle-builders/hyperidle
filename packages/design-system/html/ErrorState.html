<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ErrorState — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* ── ErrorState ──
       Warm error card: elevated bg, warm shadow, icon, title in error color,
       description, and pill retry button. Matches the Hearth feeling — even
       errors are designed with warmth. Fixed spacing (no density). */

    .error-state {
      background: var(--surface-elevated);
      border-radius: var(--r-default);
      box-shadow: var(--shadow-default);
      padding: 36px;
      max-width: 440px;
      text-align: left;
    }
    .error-state__icon {
      width: 48px;
      height: 48px;
      border-radius: var(--r-default);
      background: rgba(220, 74, 58, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 18px;
      color: var(--status-error);
    }
    .error-state__title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 9px;
      letter-spacing: -0.01em;
    }
    .error-state__description {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .error-state__detail {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      background: var(--surface-page);
      padding: 9px 12px;
      border-radius: var(--r-subtle);
      margin-bottom: 18px;
      line-height: 1.55;
    }
    .error-state__retry {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: var(--r-pill);
      border: 1.5px solid transparent;
      cursor: pointer;
      background: var(--accent-primary);
      color: var(--text-on-accent);
      transition: all 240ms ease;
    }
    .error-state__retry:hover {
      background: var(--accent-primary-hover);
    }
    .error-state__retry:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function ErrorState({ title, description, detail, onRetry }) {
      return (
        <div
          role="alert"
          className="error-state"
          data-component="ErrorState"
          data-tier="2"
          data-uses="Button"
          data-daisyui=""
          data-used-by="KnowledgeList,ConversationsChat"
        >
          <div className="error-state__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <p className="error-state__title">{title}</p>
          <p className="error-state__description">{description}</p>
          {detail && <div className="error-state__detail">{detail}</div>}
          {onRetry && (
            <button type="button" className="error-state__retry" onClick={onRetry}>Retry</button>
          )}
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">With Retry</div>
            <ErrorState
              title="Something went wrong"
              description="We couldn't load this data. This is usually temporary. If it persists, your agents may need a credential refresh."
              detail="Error 502: upstream service unavailable"
              onRetry={() => alert('Retrying...')}
            />
          </div>
          <div className="demo-section">
            <div className="demo-section-title">Without Retry</div>
            <ErrorState
              title="Session expired"
              description="Your session has expired. Please reload the page to continue."
            />
          </div>
          <div className="demo-section">
            <div className="demo-section-title">Network Error</div>
            <ErrorState
              title="Network unreachable"
              description="Check your internet connection and try again. Your agents will resume automatically once connectivity is restored."
              onRetry={() => undefined}
            />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
