<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ErrorState — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      /* K11: gap → --density-card-gap, pad-y → --density-card-pad,
         pad-x → --density-pad-x per density-audit.md § 3.2.8. text-align
         stays left — see § 5.1. */
      gap: var(--density-card-gap);
      padding: var(--density-card-pad) var(--density-pad-x);
      text-align: left;
    }

    .error-state__title {
      /* K11: title font scales with density per § 3.2.8. */
      font-size: var(--density-text);
      font-weight: 500;
      color: var(--danger);
      line-height: 1.4;
    }

    .error-state__description {
      font-size: 12px;
      color: var(--text-lo);
      line-height: 1.4;
    }

    /* @lore K7 / AESTHETICS.md § Spacing & Density row "Grid base unit": 4px hard rule.
       Padding 4px 10px → 4px 8px (10 was off-grid). Easing → --motion-ease. */
    .error-state__retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--surface-0);
      background: var(--primary);
      border-radius: var(--r2);
      cursor: pointer;
      transition: opacity var(--motion-fast) var(--motion-ease);
      line-height: 1.4;
    }

    .error-state__retry:hover {
      opacity: 0.85;
    }

    .error-state__retry:active {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function ErrorState({ title, description, onRetry }) {
      return (
        <div
          role="alert"
          className="error-state"
          data-component="ErrorState"
          data-tier="2"
          data-uses=""
          data-daisyui="btn"
          data-used-by="KnowledgeList"
          data-ds-component="ErrorState"
          data-ds-tier="2"
          data-ds-source="design-system"
        >
          <p className="error-state__title">{title}</p>
          <p className="error-state__description">{description}</p>
          {onRetry && (
            <button
              type="button"
              className="error-state__retry"
              onClick={onRetry}
            >
              Retry
            </button>
          )}
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">With Retry</div>
            <div className="demo-card">
              <ErrorState
                title="Couldn't load knowledge"
                description="The server returned an error. You can retry in a moment."
                onRetry={() => alert('Retrying...')}
              />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Without Retry</div>
            <div className="demo-card">
              <ErrorState
                title="Session expired"
                description="Please reload the page to continue."
              />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">In Context (Stacked Errors)</div>
            <div className="demo-card">
              <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                <ErrorState
                  title="Network unreachable"
                  description="Check your internet connection and try again."
                  onRetry={() => undefined}
                />
                <div style={{ borderTop: "1px solid var(--surface-4)" }} />
                <ErrorState
                  title="Permission denied"
                  description="You don't have access to this resource."
                />
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
