<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThreadShell — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* Layout mirrors ThreadShell.tsx — composition root mounting the
       L11 surface regions: ThreadHostBanner / CommentStream (with the
       promoted RichMessageCard inline) / Composer. Tier 3 (region). */
    body {
      background: var(--surface-0);
      padding: 24px;
    }
    .thread-shell {
      display: flex;
      flex-direction: column;
      height: 720px;
      max-width: 880px;
      margin: 0 auto;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r2);
      overflow: hidden;
    }

    /* HostBanner */
    .host-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-bottom: 1px solid var(--border-subtle);
      background: var(--surface-1);
    }
    .host-banner__main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .host-banner__title {
      color: var(--text-hi);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tag/StatusChip — copied from primitives */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: var(--surface-ghost);
      color: var(--text-mid);
      flex-shrink: 0;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      flex-shrink: 0;
    }
    .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-chip--blocked {
      background: color-mix(in oklab, var(--danger) 14%, transparent);
      color: var(--danger);
    }
    .status-chip--blocked .dot { background: var(--danger); }
    .status-chip--done {
      background: color-mix(in oklab, var(--ok) 14%, transparent);
      color: var(--ok);
    }
    .status-chip--done .dot { background: var(--ok); }

    /* Head */
    .thread-head {
      display: flex;
      flex-direction: column;
      gap: var(--density-gap);
      padding: var(--density-card-pad) var(--density-pad-x);
      border-bottom: 1px solid var(--border-subtle);
      background: var(--surface-1);
    }
    .thread-head__title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-hi);
      margin: 0;
    }
    .thread-head__label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-lo);
    }
    .thread-head__reasoning {
      list-style: decimal;
      padding-left: 20px;
      font-size: 13px;
      color: var(--text-mid);
      margin: 0;
    }

    /* Stream */
    .stream {
      flex: 1;
      overflow-y: auto;
      padding: var(--density-pad-y) 0;
      list-style: none;
      margin: 0;
    }
    .comment-row {
      display: flex;
      gap: 8px;
      padding: 6px var(--density-pad-x);
    }
    .comment-row__avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-lo);
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .comment-row__body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .comment-row__sender {
      color: var(--text-hi);
      font-weight: 500;
      font-size: 12px;
    }
    .comment-row__text {
      font-size: 13px;
      color: var(--text-mid);
      margin: 0;
    }

    /* VerdictBar */
    .verdict-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-1);
    }
    .btn {
      padding: 6px 10px;
      border-radius: var(--r1);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .btn--primary { background: var(--accent); color: var(--accent-on); }
    .btn--neutral { background: var(--surface-2); color: var(--text-mid); }
    .btn--danger {
      background: color-mix(in oklab, var(--danger) 14%, transparent);
      color: var(--danger);
    }

    /* Composer */
    .composer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-1);
    }
    .composer__textarea {
      width: 100%;
      min-height: 44px;
      background: var(--surface-2);
      color: var(--text-mid);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r1);
      padding: 8px 10px;
      font-size: 13px;
      font-family: var(--ui);
      resize: vertical;
    }
    .composer__footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .composer__shortcut { font-size: 11px; color: var(--text-lo); }
    .composer__send {
      padding: 6px 12px;
      border-radius: var(--r1);
      font-size: 13px;
      font-weight: 500;
      background: var(--accent);
      color: var(--accent-on);
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function ThreadShell() {
      return (
        <div
          className="thread-shell"
          data-component="ThreadShell"
          data-tier="3"
          data-uses="ThreadHostBanner,CommentRow,RichMessageCard,Composer"
        >
          <div className="host-banner">
            <div className="host-banner__main">
              <span className="tag">task</span>
              <span className="host-banner__title">Deploy v2.4 to staging</span>
            </div>
            <span className="status-chip status-chip--blocked"><span className="dot" />BLOCKED</span>
          </div>
          <section className="thread-head">
            <h2 className="thread-head__title">Approve deploy of v2.4 to staging</h2>
            <div>
              <div className="thread-head__label">Reasoning</div>
              <ol className="thread-head__reasoning">
                <li>Schema migration adds two columns; backfill verified.</li>
                <li>All 142 contract tests pass; integration suite green.</li>
                <li>Cost cap reduced 8%; budget headroom OK.</li>
              </ol>
            </div>
          </section>
          <ul className="stream">
            <li className="comment-row">
              <span className="comment-row__avatar">A</span>
              <div className="comment-row__body">
                <div className="comment-row__sender">Alice · Founder</div>
                <p className="comment-row__text">Looks good — running deploy now.</p>
              </div>
            </li>
            <li className="comment-row">
              <span className="comment-row__avatar">B</span>
              <div className="comment-row__body">
                <div className="comment-row__sender">Bob · Builder</div>
                <p className="comment-row__text">Holding for cost-cap approval.</p>
              </div>
            </li>
          </ul>
          <div className="verdict-bar">
            <button type="button" className="btn btn--primary">Approve</button>
            <button type="button" className="btn btn--neutral">Request changes</button>
            <button type="button" className="btn btn--danger">Reject</button>
          </div>
          <div className="composer">
            <textarea
              className="composer__textarea"
              placeholder="Reply to thread…"
              defaultValue=""
            />
            <div className="composer__footer">
              <span className="composer__shortcut">⌘+Enter to send</span>
              <button type="button" className="composer__send">Send</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ThreadShell />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
