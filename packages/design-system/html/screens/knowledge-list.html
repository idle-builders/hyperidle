<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Knowledge: Populated List</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    #root { max-width: none; padding: 0; }
    html, body { overflow: hidden; }
    .app-shell { display: flex; height: 100vh; background: var(--surface-container); gap: 3px; padding: 3px; }
    .sidebar { width: 200px; flex-shrink: 0; padding: 12px; }
    .sidebar-brand { font-size: 15px; font-weight: 700; color: var(--text-primary); padding: 6px 12px; margin-bottom: 18px; letter-spacing: -0.01em; }
    .sidebar-section { margin-bottom: 18px; }
    .sidebar-label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 9px; padding: 0 12px; }
    .sidebar-item { padding: 6px 12px; font-size: 13px; color: var(--text-secondary); border-radius: var(--r-subtle); margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .sidebar-item--active { background: var(--surface-elevated); color: var(--text-primary); font-weight: 500; box-shadow: var(--shadow-subtle); }
    .sidebar-divider { border: none; border-top: 1px solid var(--border-subtle); margin: 12px 12px; }
    .sidebar-view { padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--text-secondary); border-radius: var(--r-subtle); margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .sidebar-view:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-view--active { color: var(--text-primary); }
    .main { flex: 1; background: var(--surface-elevated); border-radius: var(--r-subtle); box-shadow: var(--shadow-subtle); display: flex; flex-direction: column; overflow: hidden; }
    .main-header { padding: 18px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .main-header h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }

    .tab-bar-pill { display: inline-flex; gap: 6px; background: var(--surface-container); border-radius: var(--r-pill); padding: 3px; }
    .tab-pill { padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--text-secondary); border-radius: var(--r-pill); cursor: pointer; border: none; background: transparent; font-family: var(--font-sans); }
    .tab-pill--active { background: var(--surface-elevated); color: var(--accent-primary); box-shadow: var(--shadow-subtle); font-weight: 600; }

    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: var(--r-pill); line-height: 1.4; white-space: nowrap; }
    .badge--green { background: rgba(22, 118, 79, 0.08); color: var(--accent-primary); }
    .badge--amber { background: rgba(217, 119, 6, 0.1); color: var(--accent-secondary); }
    .badge--blue { background: rgba(46, 125, 186, 0.08); color: var(--status-info); }
    .badge--default { background: var(--surface-container); color: var(--text-secondary); }
    .badge--red { background: rgba(220, 74, 58, 0.08); color: var(--status-error); }

    /* Knowledge list */
    .knowledge-list { flex: 1; overflow-y: auto; max-width: 800px; margin: 0 auto; width: 100%; }
    .topic-header { padding: 12px 24px 6px; font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: space-between; }
    .topic-count { font-size: 11px; font-weight: 400; color: var(--text-tertiary); }

    .knowledge-row { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: background 240ms ease; }
    .knowledge-row:hover { background: rgba(44, 36, 26, 0.02); }
    .knowledge-row:last-child { border-bottom: none; }
    .knowledge-info { flex: 1; min-width: 0; }
    .knowledge-title { font-size: 15px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .knowledge-preview { font-size: 13px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .knowledge-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .knowledge-time { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }

    /* Status dot */
    .status-dot { width: 6px; height: 6px; border-radius: var(--r-pill); flex-shrink: 0; display: inline-block; }

    /* Search bar in header */
    .search-input { font-family: var(--font-sans); font-size: 13px; padding: 7px 12px; border: 1.5px solid var(--border-default); border-radius: var(--r-pill); background: var(--surface-page); color: var(--text-primary); outline: none; width: 200px; }
    .search-input::placeholder { color: var(--text-placeholder); }
    .search-input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(22, 118, 79, 0.1); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Demo() {
      return (
        <div className="app-shell">
          <div className="sidebar">
            <div className="sidebar-brand">HyperIdle</div>
            <div className="sidebar-section">
              <div className="sidebar-view">Conversations</div>
              <div className="sidebar-view">Work</div>
              <div className="sidebar-view sidebar-view--active">Knowledge</div>
              <div className="sidebar-item sidebar-item--active" style={{ paddingLeft: 24 }}>Practices</div>
              <div className="sidebar-item" style={{ paddingLeft: 24 }}>Products</div>
              <div className="sidebar-item" style={{ paddingLeft: 24 }}>Factory</div>
              <hr className="sidebar-divider" />
              <div className="sidebar-item sidebar-item--active">Authentication</div>
              <div className="sidebar-item">Infrastructure</div>
              <div className="sidebar-item">Deployment</div>
              <div className="sidebar-item">API Design</div>
              <div className="sidebar-item">Security</div>
            </div>
            <hr className="sidebar-divider" />
            <div className="sidebar-item">Settings</div>
          </div>

          <div className="main">
            <div className="main-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <h2>Authentication</h2>
                <div className="tab-bar-pill">
                  <button className="tab-pill tab-pill--active">Curated</button>
                  <button className="tab-pill">Triage</button>
                </div>
              </div>
              <input className="search-input" type="text" placeholder="Search knowledge..." />
            </div>
            <div className="knowledge-list">
              <div className="topic-header">
                <span>Patterns</span>
                <span className="topic-count">4 items</span>
              </div>
              <div className="knowledge-row">
                <span className="status-dot" style={{ background: 'var(--accent-primary)' }}></span>
                <div className="knowledge-info">
                  <div className="knowledge-title">WebAuthn passkey enrollment flow</div>
                  <div className="knowledge-preview">Standard flow for enrolling users in passkey-based auth. Covers shadow enrollment, lazy prompting, and fallback paths.</div>
                </div>
                <div className="knowledge-meta">
                  <span className="badge badge--green">Pattern</span>
                  <span className="badge badge--green">Active</span>
                  <span className="knowledge-time">2 days ago</span>
                </div>
              </div>
              <div className="knowledge-row">
                <span className="status-dot" style={{ background: 'var(--accent-primary)' }}></span>
                <div className="knowledge-info">
                  <div className="knowledge-title">Session token rotation strategy</div>
                  <div className="knowledge-preview">How we handle session token rotation during auth migrations without forcing mass re-authentication.</div>
                </div>
                <div className="knowledge-meta">
                  <span className="badge badge--green">Pattern</span>
                  <span className="badge badge--green">Active</span>
                  <span className="knowledge-time">1 week ago</span>
                </div>
              </div>
              <div className="knowledge-row">
                <span className="status-dot" style={{ background: 'var(--accent-primary)' }}></span>
                <div className="knowledge-info">
                  <div className="knowledge-title">Rate limiting with token buckets</div>
                  <div className="knowledge-preview">Implementation pattern for API rate limiting. Per-key token bucket with sliding window fallback.</div>
                </div>
                <div className="knowledge-meta">
                  <span className="badge badge--green">Pattern</span>
                  <span className="badge badge--green">Active</span>
                  <span className="knowledge-time">2 weeks ago</span>
                </div>
              </div>
              <div className="knowledge-row">
                <span className="status-dot" style={{ background: 'var(--accent-secondary)' }}></span>
                <div className="knowledge-info">
                  <div className="knowledge-title">OAuth2 PKCE implementation notes</div>
                  <div className="knowledge-preview">Legacy OAuth2 notes from pre-passkey era. May be partially superseded by WebAuthn work.</div>
                </div>
                <div className="knowledge-meta">
                  <span className="badge badge--green">Pattern</span>
                  <span className="badge badge--amber">Stale</span>
                  <span className="knowledge-time">3 months ago</span>
                </div>
              </div>

              <div className="topic-header" style={{ marginTop: 6 }}>
                <span>Decisions</span>
                <span className="topic-count">2 items</span>
              </div>
              <div className="knowledge-row">
                <span className="status-dot" style={{ background: 'var(--accent-primary)' }}></span>
                <div className="knowledge-info">
                  <div className="knowledge-title">Decision: Move to passkeys over TOTP</div>
                  <div className="knowledge-preview">We chose passkeys over TOTP for second-factor because passkeys eliminate phishing entirely and reduce UX friction.</div>
                </div>
                <div className="knowledge-meta">
                  <span className="badge badge--blue">Decision</span>
                  <span className="badge badge--green">Active</span>
                  <span className="knowledge-time">1 week ago</span>
                </div>
              </div>
              <div className="knowledge-row">
                <span className="status-dot" style={{ background: 'var(--accent-primary)' }}></span>
                <div className="knowledge-info">
                  <div className="knowledge-title">Decision: 30-day session expiry window</div>
                  <div className="knowledge-preview">Sessions expire after 30 days of inactivity during the migration window. Balances security with migration velocity.</div>
                </div>
                <div className="knowledge-meta">
                  <span className="badge badge--blue">Decision</span>
                  <span className="badge badge--green">Active</span>
                  <span className="knowledge-time">3 days ago</span>
                </div>
              </div>

              <div className="topic-header" style={{ marginTop: 6 }}>
                <span>Failures</span>
                <span className="topic-count">1 item</span>
              </div>
              <div className="knowledge-row">
                <span className="status-dot" style={{ background: 'var(--status-error)' }}></span>
                <div className="knowledge-info">
                  <div className="knowledge-title">Failure: Forced re-auth in Q1 migration attempt</div>
                  <div className="knowledge-preview">The Q1 attempt at forced re-authentication caused 2,400 support tickets in 48 hours. Root cause: no grace period.</div>
                </div>
                <div className="knowledge-meta">
                  <span className="badge badge--red">Failure</span>
                  <span className="badge badge--green">Active</span>
                  <span className="knowledge-time">2 months ago</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
