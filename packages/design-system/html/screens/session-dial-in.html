<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Session: Dial In</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    #root { max-width: none; padding: 0; }
    html, body { overflow: hidden; }

    /* ── App Shell ── */
    .app-shell {
      display: flex;
      height: 100vh;
      background: var(--surface-container);
      gap: 3px;
      padding: 3px;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }
    .sidebar-brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      padding: 6px 12px;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }
    .sidebar-section { margin-bottom: 18px; }
    .sidebar-item {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      border-radius: var(--r-subtle);
      margin-bottom: 3px;
      cursor: pointer;
      transition: background var(--motion-default) ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-item:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-item--active {
      background: var(--surface-elevated);
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: var(--shadow-subtle);
    }
    .sidebar-view {
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--r-subtle);
      margin-bottom: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-view:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-view--active { color: var(--text-primary); }
    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 12px 12px;
    }
    .sidebar-bottom {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .sidebar-search-hint {
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kbd {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      background: var(--surface-container);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    .sidebar-avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--r-pill);
      background: var(--surface-page);
      border: 1.5px solid var(--border-default);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
    }

    /* ── Main Panel ── */
    .main {
      flex: 1;
      background: var(--surface-elevated);
      border-radius: var(--r-subtle);
      box-shadow: var(--shadow-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Header ── */
    .main-header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .header-breadcrumb {
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .breadcrumb-link {
      color: var(--accent-primary);
      cursor: pointer;
      text-decoration: none;
    }
    .breadcrumb-link:hover { text-decoration: underline; }
    .header-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge--agent {
      background: var(--accent-primary-dim);
      color: var(--accent-primary);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    /* ── Live indicator ── */
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--r-pill);
      background: var(--status-success);
      display: inline-block;
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .live-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--status-success);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Session metadata strip ── */
    .session-meta {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .session-meta-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .session-meta-label {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .session-meta-value {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }
    .session-meta-divider {
      width: 1px;
      height: 14px;
      background: var(--border-subtle);
    }

    /* ── Back button ── */
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 11px;
      border-radius: var(--r-pill);
      border: 1.5px solid var(--border-default);
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      transition: border-color var(--motion-fast) ease, color var(--motion-fast) ease;
    }
    .btn-ghost:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* ── Activity Feed ── */
    .feed-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 12px;
    }
    .feed-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* ── Feed entry ── */
    .feed-entry {
      display: grid;
      grid-template-columns: 72px 88px 1fr;
      gap: 0 12px;
      padding: 7px 10px;
      border-radius: var(--r-subtle);
      transition: background var(--motion-fast) ease;
      align-items: start;
    }
    .feed-entry:hover {
      background: rgba(44, 36, 26, 0.03);
    }

    .feed-time {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      padding-top: 2px;
      white-space: nowrap;
    }

    .feed-kind {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-top: 2px;
    }
    .feed-kind-icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .feed-kind-icon--tool {
      background: var(--accent-primary-dim);
      color: var(--accent-primary);
    }
    .feed-kind-icon--reasoning {
      background: rgba(217, 119, 6, 0.1);
      color: var(--accent-secondary);
    }
    .feed-kind-icon--output {
      background: rgba(46, 125, 186, 0.1);
      color: var(--status-info);
    }
    .feed-kind-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .feed-kind-label--tool { color: var(--accent-primary); }
    .feed-kind-label--reasoning { color: var(--accent-secondary); }
    .feed-kind-label--output { color: var(--status-info); }

    /* Tool call content */
    .feed-body { min-width: 0; }
    .feed-tool-content {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding-left: 10px;
      border-left: 2px solid var(--accent-primary-dim);
    }
    .feed-tool-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-primary);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .feed-tool-args {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Reasoning content */
    .feed-reasoning-content {
      font-size: 13px;
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.55;
      padding-left: 10px;
      border-left: 2px solid rgba(217, 119, 6, 0.2);
    }

    /* Output content */
    .feed-output-content {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
      padding-left: 10px;
      border-left: 2px solid rgba(46, 125, 186, 0.2);
    }
    .feed-output-result {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--status-success);
      font-weight: 600;
    }

    /* Feed separator */
    .feed-separator {
      height: 1px;
      background: var(--border-subtle);
      margin: 8px 10px;
      opacity: 0.6;
    }

    /* ── Live pulse strip ── */
    .feed-live-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      margin-bottom: 4px;
    }
    .feed-live-line {
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }
    .feed-live-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    /* ── Cost ticker footer ── */
    .cost-footer {
      border-top: 1px solid var(--border-subtle);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-shrink: 0;
    }
    .cost-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cost-label {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .cost-value {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }
    .cost-ticker-divider {
      width: 1px;
      height: 14px;
      background: var(--border-subtle);
    }
    .cost-dot {
      width: 5px;
      height: 5px;
      border-radius: var(--r-pill);
      background: var(--accent-primary);
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">

    /* ── Feed entry types ── */
    function ToolEntry({ time, tool, args }) {
      return (
        <div className="feed-entry">
          <span className="feed-time">{time}</span>
          <div className="feed-kind">
            <span className="feed-kind-icon feed-kind-icon--tool">▶</span>
            <span className="feed-kind-label feed-kind-label--tool">Tool call</span>
          </div>
          <div className="feed-body">
            <div className="feed-tool-content">
              <span className="feed-tool-name">{tool}</span>
              <span className="feed-tool-args">{args}</span>
            </div>
          </div>
        </div>
      );
    }

    function ReasoningEntry({ time, text }) {
      return (
        <div className="feed-entry">
          <span className="feed-time">{time}</span>
          <div className="feed-kind">
            <span className="feed-kind-icon feed-kind-icon--reasoning">~</span>
            <span className="feed-kind-label feed-kind-label--reasoning">Reasoning</span>
          </div>
          <div className="feed-body">
            <div className="feed-reasoning-content">{text}</div>
          </div>
        </div>
      );
    }

    function OutputEntry({ time, text, result }) {
      return (
        <div className="feed-entry">
          <span className="feed-time">{time}</span>
          <div className="feed-kind">
            <span className="feed-kind-icon feed-kind-icon--output">◆</span>
            <span className="feed-kind-label feed-kind-label--output">Output</span>
          </div>
          <div className="feed-body">
            <div className="feed-output-content">
              {text && <span>{text} </span>}
              {result && <span className="feed-output-result">{result}</span>}
            </div>
          </div>
        </div>
      );
    }

    function Demo() {
      return (
        <div className="app-shell">

          {/* ── Sidebar ── */}
          <div className="sidebar">
            <div className="sidebar-brand">HyperIdle</div>
            <div className="sidebar-section">
              <div className="sidebar-view">Conversations</div>
              <div className="sidebar-view sidebar-view--active">Work</div>
              <div className="sidebar-item sidebar-item--active" style={{ paddingLeft: 24 }}>Product</div>
              <div className="sidebar-item" style={{ paddingLeft: 24 }}>Infrastructure</div>
              <div className="sidebar-item" style={{ paddingLeft: 24 }}>Growth</div>
              <div className="sidebar-view">Knowledge</div>
            </div>
            <div className="sidebar-bottom">
              <div className="sidebar-search-hint">
                <span>Search</span>
                <span className="kbd">⌘K</span>
              </div>
              <hr className="sidebar-divider" />
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '6px 12px' }}>
                <div className="sidebar-avatar">TG</div>
                <div className="sidebar-item" style={{ padding: 0, marginBottom: 0, flex: 1 }}>Assistant</div>
              </div>
            </div>
          </div>

          {/* ── Main Panel ── */}
          <div className="main">

            {/* ── Header ── */}
            <div className="main-header">
              <div className="header-left">
                <div className="header-breadcrumb">
                  <a className="breadcrumb-link">Work</a>
                  <span>/</span>
                  <a className="breadcrumb-link">Auth migration</a>
                  <span>/</span>
                  <span>Session</span>
                </div>
                <div className="header-title-row">
                  <span className="header-title">Deploy passkey shadow enrollment</span>
                  <span className="badge badge--agent">Atlas</span>
                </div>
              </div>
              <div className="header-right">
                <div className="session-meta">
                  <span className="live-label">
                    <span className="live-dot"></span>
                    Live
                  </span>
                  <div className="session-meta-divider"></div>
                  <div className="session-meta-item">
                    <span className="session-meta-label">Duration</span>
                    <span className="session-meta-value">4:32</span>
                  </div>
                  <div className="session-meta-divider"></div>
                  <div className="session-meta-item">
                    <span className="session-meta-label">Cost</span>
                    <span className="session-meta-value">$0.47</span>
                  </div>
                </div>
                <button className="btn-ghost">
                  <span style={{ fontSize: 11 }}>←</span>
                  Back to thread
                </button>
              </div>
            </div>

            {/* ── Activity Feed ── */}
            <div className="feed-wrapper">
              <div className="feed-inner">

                {/* Newest-first label */}
                <div className="feed-live-row">
                  <div className="feed-live-line"></div>
                  <span className="feed-live-label">
                    <span className="cost-dot" style={{ marginRight: 5 }}></span>
                    Working now
                  </span>
                  <div className="feed-live-line"></div>
                </div>

                {/* Entry 1 — most recent */}
                <ToolEntry
                  time="12:04:32"
                  tool="Edit"
                  args="packages/server/src/routes/auth.ts  lines 45–67"
                />

                {/* Entry 2 */}
                <ReasoningEntry
                  time="12:04:28"
                  text="Adding the shadow enrollment endpoint. Need to handle both new and returning users."
                />

                <div className="feed-separator"></div>

                {/* Entry 3 */}
                <ToolEntry
                  time="12:04:15"
                  tool="Read"
                  args="packages/server/src/routes/auth.ts"
                />

                {/* Entry 4 */}
                <ReasoningEntry
                  time="12:03:58"
                  text="Starting with the server-side enrollment flow. The client SDK can come after."
                />

                <div className="feed-separator"></div>

                {/* Entry 5 */}
                <ToolEntry
                  time="12:03:41"
                  tool="Bash"
                  args="npm run test -- --filter auth"
                />

                {/* Entry 6 — output */}
                <OutputEntry
                  time="12:03:22"
                  result="14 passed, 0 failed"
                  text="auth suite"
                />

                <div className="feed-separator"></div>

                {/* Entry 7 */}
                <ToolEntry
                  time="12:03:10"
                  tool="Read"
                  args="packages/server/src/__tests__/auth.test.ts"
                />

                {/* Entry 8 */}
                <ReasoningEntry
                  time="12:02:45"
                  text="Need to check existing auth tests before modifying the route."
                />

              </div>
            </div>

            {/* ── Cost ticker footer ── */}
            <div className="cost-footer">
              <div className="cost-item">
                <span className="cost-label">Tokens</span>
                <span className="cost-value">12,400</span>
              </div>
              <div className="cost-ticker-divider"></div>
              <div className="cost-item">
                <span className="cost-label">Cost</span>
                <span className="cost-value">
                  <span className="cost-dot" style={{ marginRight: 4 }}></span>
                  $0.47
                </span>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
