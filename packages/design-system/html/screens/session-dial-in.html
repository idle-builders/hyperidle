<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Session: Dial In</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    #root { max-width: none; padding: 0; }
    html, body { overflow: hidden; }

    /* ── App Shell ── */
    .app-shell {
      display: flex;
      height: 100vh;
      background: var(--surface-container);
      gap: 3px;
      padding: 3px;
    }

    /* ── Sidebar ── */
    .sidebar { width: 200px; flex-shrink: 0; padding: 12px; display: flex; flex-direction: column; }
    .sidebar-brand { font-size: 15px; font-weight: 700; color: var(--text-primary); padding: 6px 12px; margin-bottom: 18px; letter-spacing: -0.01em; }
    .sidebar-section { margin-bottom: 18px; }
    .sidebar-view { padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--text-secondary); border-radius: var(--r-subtle); margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .sidebar-view:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-view--active { color: var(--text-primary); }
    .sidebar-item { padding: 6px 12px; font-size: 13px; color: var(--text-secondary); border-radius: var(--r-subtle); margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .sidebar-item--active { background: var(--surface-elevated); color: var(--text-primary); font-weight: 500; box-shadow: var(--shadow-subtle); }
    .sidebar-bottom { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 3px; }
    .sidebar-search-hint { padding: 6px 12px; font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; justify-content: space-between; }
    .kbd { font-size: 11px; font-family: var(--font-mono); color: var(--text-tertiary); background: var(--surface-container); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-subtle); }
    .sidebar-divider { border: none; border-top: 1px solid var(--border-subtle); margin: 12px 12px; }
    .sidebar-avatar { width: 28px; height: 28px; border-radius: var(--r-pill); background: var(--surface-page); border: 1.5px solid var(--border-default); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }

    /* ── Main Panel ── */
    .main {
      flex: 1;
      background: var(--surface-elevated);
      border-radius: var(--r-subtle);
      box-shadow: var(--shadow-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Header ── */
    .main-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .header-breadcrumb {
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .breadcrumb-link {
      color: var(--accent-primary);
      cursor: pointer;
      text-decoration: none;
    }
    .breadcrumb-link:hover { text-decoration: underline; }
    .header-title-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    /* ── Agent badge ── */
    .badge-agent {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      background: var(--accent-primary-dim);
      color: var(--accent-primary);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* ── Live indicator ── */
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--r-pill);
      background: var(--status-success);
      display: inline-block;
      flex-shrink: 0;
      animation: livepulse 2s ease-in-out infinite;
    }
    @keyframes livepulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── Header meta strip ── */
    .header-meta {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .header-meta-label {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
    }
    .header-meta-value {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .header-meta-divider {
      width: 1px;
      height: 12px;
      background: var(--border-default);
    }

    /* ── Back button ── */
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: var(--r-pill);
      border: 1.5px solid var(--border-default);
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* ── Terminal area ── */
    .terminal-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .terminal-inner {
      width: 100%;
      max-width: 900px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .terminal-box {
      flex: 1;
      background: var(--surface-page);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-subtle);
      box-shadow: inset 0 1px 3px rgba(44, 36, 26, 0.06);
      padding: 20px 22px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.75;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Log line types ── */
    .log-line {
      display: block;
      white-space: pre-wrap;
      word-break: break-all;
    }
    /* Agent action lines (▸) */
    .log-action {
      color: var(--text-secondary);
    }
    /* Planning / thinking lines */
    .log-thinking {
      color: var(--text-tertiary);
      font-style: italic;
    }
    /* Code addition lines (+) */
    .log-add {
      color: var(--accent-primary);
    }
    /* Test success lines (✓) */
    .log-success {
      color: var(--status-success);
    }
    /* Regular output */
    .log-plain {
      color: var(--text-primary);
    }
    /* Visual break between sections */
    .log-gap {
      display: block;
      height: 10px;
    }

    /* ── Blinking cursor at the live edge ── */
    .log-cursor {
      display: inline-block;
      width: 7px;
      height: 13px;
      background: var(--accent-primary);
      vertical-align: text-bottom;
      border-radius: 1px;
      animation: blink 1.1s step-start infinite;
      margin-left: 2px;
      opacity: 0.7;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0; }
    }

    /* ── Status bar ── */
    .status-bar {
      border-top: 1px solid var(--border-subtle);
      padding: 9px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .status-state {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--status-success);
      letter-spacing: 0.02em;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .status-metric {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-metric-label {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps-sm);
    }
    .status-metric-value {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .status-divider {
      width: 1px;
      height: 12px;
      background: var(--border-default);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">

    /* ── Terminal log lines ── */
    const LOG_LINES = [
      { type: 'action',   text: '▸ Reading packages/server/src/routes/auth.ts...' },
      { type: 'action',   text: '▸ Analyzing existing auth endpoints (4 routes found)' },
      { type: 'gap' },
      { type: 'thinking', text: 'Planning shadow enrollment implementation:' },
      { type: 'thinking', text: '  - POST /auth/passkey/enroll — new endpoint' },
      { type: 'thinking', text: '  - Need to check for existing beta credentials' },
      { type: 'thinking', text: '  - Session tokens stay valid during migration' },
      { type: 'gap' },
      { type: 'action',   text: '▸ Writing packages/server/src/routes/auth.ts (lines 45–67)' },
      { type: 'gap' },
      { type: 'add',      text: '+ export const passkeyEnroll = new Hono()' },
      { type: 'add',      text: '+   .post(\'/enroll\', async (c) => {' },
      { type: 'add',      text: '+     const userId = c.get(\'userId\')' },
      { type: 'add',      text: '+     const existing = await db.query.passkeys' },
      { type: 'add',      text: '+       .findFirst({ where: eq(passkeys.userId, userId) })' },
      { type: 'add',      text: '+     if (existing) {' },
      { type: 'add',      text: '+       // Beta passkey — migrate to new format' },
      { type: 'add',      text: '+       await migrateCredential(existing)' },
      { type: 'add',      text: '+       return c.json({ migrated: true })' },
      { type: 'add',      text: '+     }' },
      { type: 'add',      text: '+     // ...' },
      { type: 'gap' },
      { type: 'action',   text: '▸ Running npm run test -- --filter auth' },
      { type: 'success',  text: '  ✓ 14 passed, 0 failed (1.2s)' },
      { type: 'gap' },
      { type: 'action',   text: '▸ Reading packages/server/src/__tests__/auth.test.ts...' },
      { type: 'gap' },
      { type: 'plain',    text: 'Adding test for beta passkey migration edge case...' },
      { type: 'live' },
    ];

    function classForType(type) {
      switch (type) {
        case 'action':   return 'log-line log-action';
        case 'thinking': return 'log-line log-thinking';
        case 'add':      return 'log-line log-add';
        case 'success':  return 'log-line log-success';
        default:         return 'log-line log-plain';
      }
    }

    function Demo() {
      return (
        <div className="app-shell">

          {/* ── Sidebar ── */}
          <div className="sidebar">
            <div className="sidebar-brand">HyperIdle</div>
            <div className="sidebar-section">
              <div className="sidebar-view">Conversations</div>
              <div className="sidebar-view sidebar-view--active">Work</div>
              <div className="sidebar-item sidebar-item--active" style={{ paddingLeft: 24 }}>Product</div>
              <div className="sidebar-item" style={{ paddingLeft: 24 }}>Infrastructure</div>
              <div className="sidebar-item" style={{ paddingLeft: 24 }}>Growth</div>
              <div className="sidebar-view">Knowledge</div>
            </div>
            <div className="sidebar-bottom">
              <div className="sidebar-search-hint">
                <span>Search</span>
                <span className="kbd">⌘K</span>
              </div>
              <hr className="sidebar-divider" />
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '6px 12px' }}>
                <div className="sidebar-avatar">TG</div>
                <div className="sidebar-item" style={{ padding: 0, marginBottom: 0, flex: 1 }}>Assistant</div>
              </div>
            </div>
          </div>

          {/* ── Main Panel ── */}
          <div className="main">

            {/* ── Header ── */}
            <div className="main-header">
              <div className="header-left">
                <div className="header-breadcrumb">
                  <a className="breadcrumb-link">Work</a>
                  <span>/</span>
                  <a className="breadcrumb-link">Auth migration</a>
                  <span>/</span>
                  <span>Session</span>
                </div>
                <div className="header-title-row">
                  <span className="header-title">Deploy passkey shadow enrollment</span>
                  <span className="badge-agent">Atlas</span>
                </div>
              </div>
              <div className="header-right">
                <div className="header-meta">
                  <div className="header-meta-item">
                    <span className="live-dot"></span>
                    <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--status-success)', letterSpacing: '0.04em' }}>LIVE</span>
                  </div>
                  <div className="header-meta-divider"></div>
                  <div className="header-meta-item">
                    <span className="header-meta-label">Duration</span>
                    <span className="header-meta-value">4:32</span>
                  </div>
                  <div className="header-meta-divider"></div>
                  <div className="header-meta-item">
                    <span className="header-meta-label">Cost</span>
                    <span className="header-meta-value">$0.47</span>
                  </div>
                </div>
                <button className="btn-ghost">
                  <span style={{ fontSize: 11 }}>←</span>
                  Back
                </button>
              </div>
            </div>

            {/* ── Terminal area ── */}
            <div className="terminal-wrapper">
              <div className="terminal-inner">
                <div className="terminal-box">
                  {LOG_LINES.map((line, i) => {
                    if (line.type === 'gap') {
                      return <span key={i} className="log-gap" />;
                    }
                    if (line.type === 'live') {
                      return (
                        <span key={i} className="log-line log-plain">
                          <span className="log-cursor" />
                        </span>
                      );
                    }
                    return (
                      <span key={i} className={classForType(line.type)}>
                        {line.text}
                      </span>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* ── Status bar ── */}
            <div className="status-bar">
              <div className="status-state">
                <span className="live-dot"></span>
                Running
              </div>
              <div className="status-right">
                <div className="status-metric">
                  <span className="status-metric-label">Tokens</span>
                  <span className="status-metric-value">12,400</span>
                </div>
                <div className="status-divider"></div>
                <div className="status-metric">
                  <span className="status-metric-label">Cost</span>
                  <span className="status-metric-value">$0.47</span>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
