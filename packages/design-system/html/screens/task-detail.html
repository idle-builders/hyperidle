<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Work: Task Detail</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    #root { max-width: none; padding: 0; }
    html, body { overflow: hidden; }
    .app-shell { display: flex; height: 100vh; background: var(--surface-container); gap: 3px; padding: 3px; }

    /* ── Sidebar ── */
    .sidebar { width: 200px; flex-shrink: 0; padding: 12px; display: flex; flex-direction: column; }
    .sidebar-brand { font-size: 15px; font-weight: 700; color: var(--text-primary); padding: 6px 12px; margin-bottom: 18px; letter-spacing: -0.01em; }
    .sidebar-section { margin-bottom: 18px; }
    .sidebar-view { padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--text-secondary); border-radius: var(--r-subtle); margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .sidebar-view:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-view--active { color: var(--text-primary); }
    .sidebar-item { padding: 6px 12px; font-size: 13px; color: var(--text-secondary); border-radius: var(--r-subtle); margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .sidebar-item--active { background: var(--surface-elevated); color: var(--text-primary); font-weight: 500; box-shadow: var(--shadow-subtle); }
    .sidebar-bottom { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 3px; }
    .sidebar-search-hint { padding: 6px 12px; font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; justify-content: space-between; }
    .kbd { font-size: 11px; font-family: var(--font-mono); color: var(--text-tertiary); background: var(--surface-container); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-subtle); }
    .sidebar-divider { border: none; border-top: 1px solid var(--border-subtle); margin: 12px 12px; }
    .sidebar-avatar { width: 28px; height: 28px; border-radius: var(--r-pill); background: var(--surface-page); border: 1.5px solid var(--border-default); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }

    /* ── Main panel ── */
    .main { flex: 1; background: var(--surface-elevated); border-radius: var(--r-subtle); box-shadow: var(--shadow-subtle); display: flex; flex-direction: column; overflow: hidden; }
    .main-header { padding: 18px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .main-header h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-top: 4px; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* ── Breadcrumb ── */
    .breadcrumb { font-size: 13px; color: var(--text-tertiary); margin-bottom: 6px; }
    .breadcrumb a { color: var(--accent-primary); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: var(--r-pill); line-height: 1.4; white-space: nowrap; }
    .badge--green { background: rgba(22, 118, 79, 0.08); color: var(--accent-primary); }
    .badge--amber { background: rgba(217, 119, 6, 0.1); color: var(--accent-secondary); }
    .badge--default { background: var(--surface-container); color: var(--text-secondary); }

    /* ── Avatar ── */
    .avatar { border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; background: var(--surface-page); color: var(--text-secondary); flex-shrink: 0; font-family: var(--font-sans); line-height: 1; user-select: none; border: 1.5px solid var(--border-default); }
    .avatar--sm { width: 24px; height: 24px; font-size: 9px; }
    .avatar--md { width: 28px; height: 28px; font-size: 10px; }
    .avatar--agent { background: rgba(22, 118, 79, 0.08); border-color: var(--accent-primary); color: var(--accent-primary); }

    /* ── Overflow button ── */
    .btn-overflow { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--r-pill); border: 1.5px solid var(--border-default); cursor: pointer; background: var(--surface-elevated); color: var(--text-secondary); font-size: 16px; font-family: var(--font-sans); line-height: 1; }
    .btn-overflow:hover { border-color: var(--accent-primary); color: var(--text-primary); }

    /* ── Buttons ── */
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: var(--r-pill); border: 1.5px solid transparent; cursor: pointer; background: var(--accent-primary); color: var(--text-on-accent); gap: 5px; }
    .btn-ghost { display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: var(--r-pill); border: 1.5px solid var(--border-default); cursor: pointer; background: transparent; color: var(--text-secondary); gap: 5px; }
    .btn-ghost:hover { color: var(--text-primary); border-color: var(--accent-primary); }

    /* ── Scrollable body ── */
    .detail-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }

    /* ── Section title ── */
    .section-title { font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px solid var(--border-subtle); }

    /* ── Metadata row ── */
    .meta-strip { display: flex; gap: 0; flex-wrap: wrap; background: var(--surface-page); border-radius: var(--r-default); border: 1px solid var(--border-subtle); overflow: hidden; }
    .meta-cell { display: flex; flex-direction: column; gap: 3px; padding: 12px 18px; flex: 1; min-width: 100px; border-right: 1px solid var(--border-subtle); }
    .meta-cell:last-child { border-right: none; }
    .meta-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
    .meta-value { font-size: 13px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 5px; }
    .meta-value--muted { color: var(--text-secondary); font-weight: 400; }

    /* ── Live dot ── */
    .live-dot { width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--accent-primary); flex-shrink: 0; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Intent card ── */
    .intent-card { background: var(--surface-page); border-radius: var(--r-default); border: 1px solid var(--border-subtle); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .intent-label { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 3px; }
    .intent-sublabel { font-size: 12px; color: var(--text-tertiary); }
    .intent-options { display: flex; gap: 6px; flex-wrap: wrap; }
    .intent-option { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); border: 1.5px solid var(--border-default); cursor: pointer; font-size: 13px; color: var(--text-secondary); font-family: var(--font-sans); background: var(--surface-elevated); transition: all 120ms ease; }
    .intent-option:hover { border-color: var(--accent-primary); color: var(--text-primary); }
    .intent-option--selected { border-color: var(--accent-primary); background: rgba(22, 118, 79, 0.06); color: var(--accent-primary); font-weight: 500; }
    .intent-option-dot { width: 7px; height: 7px; border-radius: var(--r-pill); border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; }
    .intent-option-dot--filled::after { content: ''; width: 3px; height: 3px; border-radius: var(--r-pill); background: currentColor; display: block; }
    .intent-note { width: 100%; box-sizing: border-box; font-family: var(--font-sans); font-size: 13px; padding: 9px 12px; border: 1.5px solid var(--border-default); border-radius: var(--r-default); background: var(--surface-elevated); color: var(--text-primary); outline: none; resize: none; }
    .intent-note::placeholder { color: var(--text-placeholder); }
    .intent-footer { display: flex; align-items: center; justify-content: space-between; }
    .intent-hint { font-size: 12px; color: var(--text-tertiary); }

    /* ── Discussion ── */
    .discussion-message { display: flex; gap: 9px; padding: 9px 0; }
    .discussion-avatar { width: 28px; height: 28px; border-radius: var(--r-pill); background: var(--surface-page); border: 1.5px solid var(--border-default); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text-secondary); flex-shrink: 0; }
    .discussion-avatar--agent { background: rgba(22, 118, 79, 0.08); border-color: var(--accent-primary); color: var(--accent-primary); }
    .discussion-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .discussion-time { font-size: 11px; color: var(--text-tertiary); margin-left: 6px; }
    .discussion-body { font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin-top: 2px; }
    .discussion-composer { display: flex; gap: 9px; align-items: stretch; margin-top: 12px; }
    .discussion-input { flex: 1; font-family: var(--font-sans); font-size: 13px; padding: 9px 12px; border: 1.5px solid var(--border-default); border-radius: var(--r-default); background: var(--surface-page); color: var(--text-primary); outline: none; }
    .discussion-input::placeholder { color: var(--text-placeholder); }

    /* ── Artifacts ── */
    .artifact-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: background 240ms ease; }
    .artifact-row:hover { background: rgba(44, 36, 26, 0.02); }
    .artifact-row:last-child { border-bottom: none; }
    .artifact-icon { width: 28px; height: 28px; border-radius: var(--r-subtle); background: var(--surface-container); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-tertiary); flex-shrink: 0; }
    .artifact-name { font-size: 14px; color: var(--text-primary); }
    .artifact-meta { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    const { useState } = React;

    function Avatar({ initials, agent, size = 'sm' }) {
      return (
        <div className={`avatar avatar--${size} ${agent ? 'avatar--agent' : ''}`}>
          {initials}
        </div>
      );
    }

    function Demo() {
      const [selected, setSelected] = useState(null);

      const intentOptions = [
        { id: 'blocked', label: 'Blocked' },
        { id: 'unblock', label: 'Unblock' },
        { id: 'done', label: 'Done' },
        { id: 'hold', label: 'Hold' },
        { id: 'kill', label: 'Kill' },
      ];

      return (
        <div className="app-shell">
          {/* ── Sidebar ── */}
          <div className="sidebar">
            <div className="sidebar-brand">HyperIdle</div>
            <div className="sidebar-section">
              <div className="sidebar-view">Conversations</div>
              <div className="sidebar-view sidebar-view--active">Work</div>
              <div className="sidebar-item sidebar-item--active" style={{ paddingLeft: 24 }}>Product</div>
              <div className="sidebar-item" style={{ paddingLeft: 24 }}>Infrastructure</div>
              <div className="sidebar-item" style={{ paddingLeft: 24 }}>Growth</div>
              <div className="sidebar-view">Knowledge</div>
            </div>
            <div className="sidebar-bottom">
              <div className="sidebar-search-hint">
                <span>Search</span>
                <span className="kbd">⌘K</span>
              </div>
              <hr className="sidebar-divider" />
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '6px 12px' }}>
                <div className="sidebar-avatar">TG</div>
                <div className="sidebar-item" style={{ padding: 0, marginBottom: 0, flex: 1 }}>Assistant</div>
              </div>
            </div>
          </div>

          {/* ── Main panel ── */}
          <div className="main">
            {/* Header */}
            <div className="main-header">
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="breadcrumb">
                  <a href="#">Work</a> / <a href="#">Product</a> / <a href="#">Auth migration</a> / Deploy passkey shadow enrollment
                </div>
                <h2>Deploy passkey shadow enrollment</h2>
              </div>
              <div className="header-right">
                <span className="badge badge--green">In progress</span>
                <button className="btn-overflow">···</button>
              </div>
            </div>

            {/* Scrollable body */}
            <div className="detail-body">

              {/* ── Metadata strip ── */}
              <div className="meta-strip">
                <div className="meta-cell">
                  <div className="meta-label">Owner</div>
                  <div className="meta-value">
                    <Avatar initials="AT" agent size="sm" />
                    Atlas
                  </div>
                </div>
                <div className="meta-cell">
                  <div className="meta-label">Status</div>
                  <div className="meta-value">
                    <span className="live-dot"></span>
                    In progress
                  </div>
                </div>
                <div className="meta-cell">
                  <div className="meta-label">Started</div>
                  <div className="meta-value meta-value--muted">2 days ago</div>
                </div>
                <div className="meta-cell">
                  <div className="meta-label">Cost</div>
                  <div className="meta-value">$0.47</div>
                </div>
                <div className="meta-cell" style={{ borderRight: 'none' }}>
                  <div className="meta-label">Session</div>
                  <div className="meta-value" style={{ gap: 8 }}>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                      <span className="live-dot"></span>
                      Active
                    </span>
                    <button className="btn-ghost" style={{ fontSize: 11, padding: '3px 9px', height: 'auto' }}>Dial in</button>
                  </div>
                </div>
              </div>

              {/* ── Intent card ── */}
              <div>
                <div className="section-title">Agent needs input</div>
                <div className="intent-card">
                  <div>
                    <div className="intent-label">What should Atlas do next?</div>
                    <div className="intent-sublabel">The agent has completed the shadow enrollment endpoint and is waiting for your direction before proceeding.</div>
                  </div>
                  <div className="intent-options">
                    {intentOptions.map(opt => (
                      <button
                        key={opt.id}
                        className={`intent-option ${selected === opt.id ? 'intent-option--selected' : ''}`}
                        onClick={() => setSelected(opt.id)}
                      >
                        <span className={`intent-option-dot ${selected === opt.id ? 'intent-option-dot--filled' : ''}`}></span>
                        {opt.label}
                      </button>
                    ))}
                  </div>
                  <textarea
                    className="intent-note"
                    rows={2}
                    placeholder="Add a note about this decision..."
                  />
                  <div className="intent-footer">
                    <span className="intent-hint">Atlas will continue as soon as you submit.</span>
                    <button className="btn-primary">Submit</button>
                  </div>
                </div>
              </div>

              {/* ── Discussion ── */}
              <div>
                <div className="section-title">Discussion</div>
                <div className="discussion-message">
                  <div className="discussion-avatar discussion-avatar--agent">AT</div>
                  <div>
                    <span className="discussion-name">Atlas</span>
                    <span className="discussion-time">2 days ago</span>
                    <div className="discussion-body">Starting shadow enrollment implementation. Will add the endpoint to the auth router and write integration tests.</div>
                  </div>
                </div>
                <div className="discussion-message">
                  <div className="discussion-avatar">TG</div>
                  <div>
                    <span className="discussion-name">Tobias</span>
                    <span className="discussion-time">1 day ago</span>
                    <div className="discussion-body">Make sure to handle the edge case where a user already has a passkey registered from the beta program.</div>
                  </div>
                </div>
                <div className="discussion-message">
                  <div className="discussion-avatar discussion-avatar--agent">AT</div>
                  <div>
                    <span className="discussion-name">Atlas</span>
                    <span className="discussion-time">6 hours ago</span>
                    <div className="discussion-body">Good catch. Added a check for existing credentials — beta passkeys get migrated to the new format automatically.</div>
                  </div>
                </div>
                <div className="discussion-composer">
                  <input className="discussion-input" type="text" placeholder="Add to discussion..." />
                  <button className="btn-primary" style={{ fontSize: 12, padding: '7px 14px' }}>Send</button>
                </div>
              </div>

              {/* ── Artifacts ── */}
              <div>
                <div className="section-title">Artifacts</div>
                <div className="artifact-row">
                  <div className="artifact-icon">±</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="artifact-name">Shadow enrollment endpoint</div>
                    <div className="artifact-meta">text_diff &middot; Atlas &middot; 6 hours ago</div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
