<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Error States (404, API Error, Empty-but-Healthy)</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    #root { max-width: 1024px; margin: 0 auto; }

    .error-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 48px 24px;
    }
    .error-card {
      background: var(--surface-elevated);
      border-radius: var(--r-default);
      box-shadow: var(--shadow-default);
      padding: 36px;
      max-width: 440px;
      width: 100%;
      text-align: left;
    }
    .error-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--r-default);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 18px;
    }
    .error-icon--404 {
      background: rgba(217, 119, 6, 0.08);
      color: var(--accent-secondary);
    }
    .error-icon--api {
      background: rgba(220, 74, 58, 0.08);
      color: var(--status-error);
    }
    .error-icon--healthy {
      background: rgba(22, 118, 79, 0.08);
      color: var(--accent-primary);
    }
    .error-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 9px;
      letter-spacing: -0.01em;
    }
    .error-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .error-detail {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      background: var(--surface-page);
      padding: 9px 12px;
      border-radius: var(--r-subtle);
      margin-bottom: 18px;
    }
    .btn { display: inline-flex; align-items: center; font-family: var(--font-sans); font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: var(--r-pill); border: 1.5px solid transparent; cursor: pointer; }
    .btn--primary { background: var(--accent-primary); color: var(--text-on-accent); }
    .btn--secondary { background: var(--surface-elevated); color: var(--text-primary); border-color: var(--border-default); margin-left: 9px; }

    .section-divider {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 48px 0;
    }
    .state-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Demo() {
      return (
        <div className="demo-grid" style={{ gap: 0 }}>
          {/* 404 */}
          <div className="state-label" style={{ marginTop: 24 }}>404 — Page Not Found</div>
          <div className="error-page">
            <div className="error-card">
              <div className="error-icon error-icon--404">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
                  <line x1="9" y1="9" x2="9.01" y2="9"/>
                  <line x1="15" y1="9" x2="15.01" y2="9"/>
                </svg>
              </div>
              <div className="error-title">Page not found</div>
              <div className="error-desc">The page you're looking for doesn't exist or has been moved. If you followed a link, it may be outdated.</div>
              <button className="btn btn--primary">Go to conversations</button>
              <button className="btn btn--secondary">Go back</button>
            </div>
          </div>

          <hr className="section-divider" />

          {/* API Error */}
          <div className="state-label">API Error</div>
          <div className="error-page">
            <div className="error-card">
              <div className="error-icon error-icon--api">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                  <line x1="12" y1="9" x2="12" y2="13"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </div>
              <div className="error-title">Something went wrong</div>
              <div className="error-desc">We couldn't load this data. This is usually temporary. If it persists, your agents may need a credential refresh.</div>
              <div className="error-detail">Error 502: upstream service unavailable<br/>Request ID: req_8f2a3b1c</div>
              <button className="btn btn--primary">Retry</button>
              <button className="btn btn--secondary">View status</button>
            </div>
          </div>

          <hr className="section-divider" />

          {/* Empty but healthy */}
          <div className="state-label">Empty but Healthy</div>
          <div className="error-page">
            <div className="error-card">
              <div className="error-icon error-icon--healthy">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                  <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
              </div>
              <div className="error-title">All clear</div>
              <div className="error-desc">There's nothing here right now, and that's fine. Your agents are running smoothly. New items will appear here as work progresses.</div>
              <button className="btn btn--primary">Start a thread</button>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
