<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Conversations: Thread List</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    /* ── Full-bleed layout (no #root max-width) ── */
    #root { max-width: none; padding: 0; }
    html, body { overflow: hidden; }

    /* ── App Shell ── */
    .app-shell {
      display: flex;
      height: 100vh;
      background: var(--surface-container);
      gap: 3px;
      padding: 3px;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }
    .sidebar-brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      padding: 6px 12px;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }
    .sidebar-section { margin-bottom: 18px; }
    .sidebar-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 9px;
      padding: 0 12px;
    }
    .sidebar-item {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      border-radius: var(--r-subtle);
      margin-bottom: 3px;
      cursor: pointer;
      transition: background 240ms ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-item:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-item--active {
      background: var(--surface-elevated);
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: var(--shadow-subtle);
    }
    .sidebar-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: var(--r-pill);
      flex-shrink: 0;
    }
    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 12px 12px;
    }

    /* ── Main Panel ── */
    .main {
      flex: 1;
      background: var(--surface-elevated);
      border-radius: var(--r-subtle);
      box-shadow: var(--shadow-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .main-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .main-header h2 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* ── Sidebar View Headers ── */
    .sidebar-view {
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--r-subtle);
      margin-bottom: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-view:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-view--active { color: var(--text-primary); }

    /* ── Thread List ── */
    .thread-list {
      flex: 1;
      overflow-y: auto;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .thread-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 240ms ease;
    }
    .thread-row:hover { background: rgba(44, 36, 26, 0.02); }
    .thread-row:last-child { border-bottom: none; }

    .thread-unread-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--r-pill);
      background: var(--accent-primary);
      flex-shrink: 0;
    }
    .thread-unread-dot--read { background: transparent; }

    .thread-info {
      flex: 1;
      min-width: 0;
    }
    .thread-title {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thread-row--unread .thread-title { font-weight: 600; }

    .thread-preview {
      font-size: 13px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .thread-row--unread .thread-preview { color: var(--text-secondary); }

    .thread-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }
    .thread-time {
      font-size: 12px;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    /* Overlapping small avatars in thread row */
    .thread-avatars { display: flex; }
    .thread-avatars .avatar {
      width: 24px;
      height: 24px;
      font-size: 9px;
      margin-left: -6px;
      border: 2px solid var(--surface-elevated);
    }
    .thread-avatars .avatar:first-child { margin-left: 0; }

    /* Shared avatar base */
    .avatar {
      border-radius: var(--r-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      background: var(--surface-page);
      color: var(--text-secondary);
      flex-shrink: 0;
      font-family: var(--font-sans);
      line-height: 1;
      user-select: none;
      border: 1.5px solid var(--border-default);
    }
    .avatar--agent {
      background: rgba(22, 118, 79, 0.08);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* ── Button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: var(--r-pill);
      border: 1.5px solid transparent;
      cursor: pointer;
      background: var(--accent-primary);
      color: var(--text-on-accent);
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge--green {
      background: rgba(22, 118, 79, 0.08);
      color: var(--accent-primary);
    }
    .badge--default {
      background: var(--surface-container);
      color: var(--text-secondary);
    }
    .badge--count {
      min-width: 20px;
      text-align: center;
      padding: 3px 6px;
    }
    .badge--blocking {
      background: rgba(220, 74, 58, 0.08);
      color: var(--status-error);
    }

    /* ── Filter Chips ── */
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: var(--r-pill);
      border: 1.5px solid var(--border-default);
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
    }
    .filter-chip--active {
      border-color: var(--accent-primary);
      background: rgba(22, 118, 79, 0.08);
      color: var(--accent-primary);
    }
    .sidebar-bottom {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .sidebar-search-hint {
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kbd {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      background: var(--surface-container);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    .sidebar-avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--r-pill);
      background: var(--surface-page);
      border: 1.5px solid var(--border-default);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Avatar({ initials, agent }) {
      return <div className={`avatar ${agent ? 'avatar--agent' : ''}`}>{initials}</div>;
    }

    function Demo() {
      return (
        <div className="app-shell">
          {/* Sidebar */}
          <div className="sidebar">
            <div className="sidebar-brand">HyperIdle</div>
            <div className="sidebar-section">
              <div className="sidebar-view sidebar-view--active">Conversations</div>
              <div className="sidebar-item sidebar-item--active">
                <span className="sidebar-dot" style={{ background: 'var(--accent-primary)' }}></span>
                Auth migration
              </div>
              <div className="sidebar-item">
                <span className="sidebar-dot" style={{ background: 'var(--accent-secondary)' }}></span>
                Search rewrite
              </div>
              <div className="sidebar-item">
                <span className="sidebar-dot" style={{ background: 'var(--status-info)' }}></span>
                Onboarding v3
              </div>
              <div className="sidebar-item">
                <span className="sidebar-dot" style={{ background: 'var(--accent-primary)' }}></span>

            </div>
            <div className="sidebar-section">
              <div className="sidebar-view">Work</div>

            <div className="sidebar-section">
              <div className="sidebar-view">Knowledge</div>
            </div>
            <div className="sidebar-bottom">
              <div className="sidebar-search-hint">
                <span>Search</span>
                <span className="kbd">⌘K</span>
              </div>
              <hr className="sidebar-divider" />
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '6px 12px' }}>
                <div className="sidebar-avatar">TG</div>
                <div className="sidebar-item" style={{ padding: 0, marginBottom: 0, flex: 1 }}>Assistant</div>
              </div>
            </div>
          </div>

          {/* Main: Thread List */}
          <div className="main">
            <div className="main-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <h2>Auth migration</h2>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button className="filter-chip">Blocking</button>
                  <button className="filter-chip">Unread</button>
                </div>
              </div>
              <button className="btn">New thread</button>
            </div>
            <div className="thread-list">
              {/* Thread 1: unread + blocking */}
              <div className="thread-row thread-row--unread">
                <div className="thread-unread-dot"></div>
                <div className="thread-info">
                  <div className="thread-title">Passkey rollout plan — phase 1 scope</div>
                  <div className="thread-preview">Atlas: Drafted 3-phase plan. Shadow enrollment starts Monday.</div>
                </div>
                <div className="thread-meta">
                  <span className="badge badge--blocking">Blocking</span>
                  <div className="thread-avatars">
                    <Avatar initials="TG" />
                    <Avatar initials="AT" agent />
                  </div>
                  <span className="badge badge--green badge--count">8</span>
                  <span className="thread-time">2:38 PM</span>
                </div>
              </div>
              {/* Thread 2: unread */}
              <div className="thread-row thread-row--unread">
                <div className="thread-unread-dot"></div>
                <div className="thread-info">
                  <div className="thread-title">Session migration risk assessment</div>
                  <div className="thread-preview">Kim: We need to handle the 12k active sessions before switching...</div>
                </div>
                <div className="thread-meta">
                  <div className="thread-avatars">
                    <Avatar initials="KL" />
                    <Avatar initials="JS" />
                  </div>
                  <span className="badge badge--default badge--count">5</span>
                  <span className="thread-time">1:22 PM</span>
                </div>
              </div>
              {/* Thread 3: read */}
              <div className="thread-row">
                <div className="thread-unread-dot thread-unread-dot--read"></div>
                <div className="thread-info">
                  <div className="thread-title">WebAuthn browser compatibility matrix</div>
                  <div className="thread-preview">Atlas: Coverage across target browsers is 96.3%. Safari 16+ required.</div>
                </div>
                <div className="thread-meta">
                  <div className="thread-avatars">
                    <Avatar initials="AT" agent />
                  </div>
                  <span className="badge badge--default badge--count">3</span>
                  <span className="thread-time">11:05 AM</span>
                </div>
              </div>
              {/* Thread 4: read */}
              <div className="thread-row">
                <div className="thread-unread-dot thread-unread-dot--read"></div>
                <div className="thread-info">
                  <div className="thread-title">Password deprecation timeline</div>
                  <div className="thread-preview">Tobias: Let's target end of Q2. Need comms plan for existing users.</div>
                </div>
                <div className="thread-meta">
                  <div className="thread-avatars">
                    <Avatar initials="TG" />

                  </div>
                  <span className="badge badge--default badge--count">14</span>
                  <span className="thread-time">Yesterday</span>
                </div>
              </div>
              {/* Thread 5: read */}
              <div className="thread-row">
                <div className="thread-unread-dot thread-unread-dot--read"></div>
                <div className="thread-info">
                  <div className="thread-title">Fallback auth for hardware tokens</div>
                  <div className="thread-preview">Jordan: Edge case — users with YubiKeys need a separate flow...</div>

                <div className="thread-meta">
                  <div className="thread-avatars">
                    <Avatar initials="JS" />
                  </div>
                  <span className="badge badge--default badge--count">2</span>
                  <span className="thread-time">May 27</span>
                </div>
              </div>
              {/* Thread 6: read */}
              <div className="thread-row">
                <div className="thread-unread-dot thread-unread-dot--read"></div>
                <div className="thread-info">
                  <div className="thread-title">Auth metrics dashboard spec</div>
                  <div className="thread-preview">Atlas: Created Grafana dashboard draft with passkey adoption rate...</div>
                </div>
                <div className="thread-meta">
                  <div className="thread-avatars">
                    <Avatar initials="AT" agent />

                  </div>
                  <span className="badge badge--default badge--count">6</span>
                  <span className="thread-time">May 26</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
