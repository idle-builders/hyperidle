<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Work: Bet Overview</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    #root { max-width: none; padding: 0; }
    html, body { overflow: hidden; }

    .app-shell {
      display: flex;
      height: 100vh;
      background: var(--surface-container);
      gap: 3px;
      padding: 3px;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      padding: 12px;
    }
    .sidebar-brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      padding: 6px 12px;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }
    .sidebar-section { margin-bottom: 18px; }
    .sidebar-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 9px;
      padding: 0 12px;
    }
    .sidebar-item {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      border-radius: var(--r-subtle);
      margin-bottom: 3px;
      cursor: pointer;
      transition: background 240ms ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-item:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-item--active {
      background: var(--surface-elevated);
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: var(--shadow-subtle);
    }
    .sidebar-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: var(--r-pill);
      flex-shrink: 0;
    }
    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 12px 12px;
    }

    /* Main */
    .main {
      flex: 1;
      background: var(--surface-elevated);
      border-radius: var(--r-subtle);
      box-shadow: var(--shadow-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .main-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .main-header h2 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Tab Bar */
    .tab-bar-pill {
      display: inline-flex;
      gap: 6px;
      background: var(--surface-container);
      border-radius: var(--r-pill);
      padding: 3px;
    }
    .tab-pill {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: var(--r-pill);
      cursor: pointer;
      transition: all 240ms ease;
      border: none;
      background: transparent;
      font-family: var(--font-sans);
    }
    .tab-pill:hover { color: var(--text-primary); }
    .tab-pill--active {
      background: var(--surface-elevated);
      color: var(--accent-primary);
      box-shadow: var(--shadow-subtle);
      font-weight: 600;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      padding: 7px 12px;
      border-radius: var(--r-pill);
      border: 1.5px solid transparent;
      cursor: pointer;
      background: var(--accent-primary);
      color: var(--text-on-accent);
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge--green { background: rgba(22, 118, 79, 0.08); color: var(--accent-primary); }
    .badge--amber { background: rgba(217, 119, 6, 0.1); color: var(--accent-secondary); }
    .badge--blue { background: rgba(46, 125, 186, 0.08); color: var(--status-info); }
    .badge--default { background: var(--surface-container); color: var(--text-secondary); }

    /* Avatar */
    .avatar {
      border-radius: var(--r-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      background: var(--surface-page);
      color: var(--text-secondary);
      flex-shrink: 0;
      font-family: var(--font-sans);
      line-height: 1;
      user-select: none;
      border: 1.5px solid var(--border-default);
      width: 24px;
      height: 24px;
      font-size: 9px;
    }
    .avatar--agent {
      background: rgba(22, 118, 79, 0.08);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .sidebar-view {
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--r-subtle);
      margin-bottom: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-view:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-view--active {
      color: var(--text-primary);
    }

    /* Bet Grid */
    .bet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: 18px 24px;
      overflow-y: auto;
      flex: 1;
      max-width: 960px;
      margin: 0 auto;
    }

    /* Bet Card */
    .bet-card {
      background: var(--surface-elevated);
      border-radius: var(--r-default);
      box-shadow: var(--shadow-default);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: box-shadow 240ms ease, transform 240ms ease;
      cursor: pointer;
    }
    .bet-card:hover {
      box-shadow: var(--shadow-elevated);
      transform: translateY(-2px);
    }
    .bet-card--completed { opacity: 0.75; }

    .bet-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bet-card-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .bet-card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .bet-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 3px;
    }

    /* Status dot */
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: var(--r-pill);
      flex-shrink: 0;
    }

    /* Progress */
    .progress-track {
      height: 8px;
      background: var(--surface-container);
      border-radius: var(--r-pill);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: var(--r-pill);
    }
    .progress-fill--green { background: var(--accent-primary); }
    .progress-fill--amber { background: var(--accent-secondary); }

    /* Avatar group in cards */
    .avatar-group { display: flex; }
    .avatar-group .avatar {
      margin-left: -6px;
      border: 2px solid var(--surface-elevated);
    }
    .avatar-group .avatar:first-child { margin-left: 0; }

    .percent-label {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Avatar({ initials, agent }) {
      return <div className={`avatar ${agent ? 'avatar--agent' : ''}`}>{initials}</div>;
    }

    function Demo() {
      return (
        <div className="app-shell">
          <div className="sidebar">
            <div className="sidebar-brand">HyperIdle</div>

            <div className="sidebar-section">
              <div className="sidebar-view">Conversations</div>
            </div>

            <div className="sidebar-section">
              <div className="sidebar-view sidebar-view--active">Work</div>
              <div className="sidebar-item sidebar-item--active">
                <span className="sidebar-dot" style={{ background: 'var(--accent-primary)' }}></span>
                All bets
              </div>
              <div className="sidebar-item">
                <span className="sidebar-dot" style={{ background: 'var(--accent-primary)' }}></span>
                Active
              </div>
              <div className="sidebar-item">
                <span className="sidebar-dot" style={{ background: 'var(--border-strong)' }}></span>
                Completed
              </div>
              <div className="sidebar-item">
                <span className="sidebar-dot" style={{ background: 'var(--status-info)' }}></span>
                Draft
              </div>
            </div>

            <div className="sidebar-section">
              <div className="sidebar-view">Knowledge</div>
            </div>

            <hr className="sidebar-divider" />
            <div className="sidebar-item">Settings</div>
          </div>

          <div className="main">
            <div className="main-header">
              <div className="header-left">
                <h2>All bets</h2>
                <div className="tab-bar-pill">
                  <button className="tab-pill tab-pill--active">All</button>
                  <button className="tab-pill">Active</button>
                  <button className="tab-pill">Completed</button>
                  <button className="tab-pill">Draft</button>
                </div>
              </div>
              <button className="btn">New bet</button>
            </div>
            <div className="bet-grid">
              {/* Bet 1: Active */}
              <div className="bet-card">
                <div className="bet-card-top">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span className="status-dot" style={{ background: 'var(--accent-primary)' }}></span>
                    <span className="badge badge--green">Active</span>
                  </div>
                  <span className="badge badge--amber">$2,400</span>
                </div>
                <div className="bet-card-title">Auth migration</div>
                <div className="bet-card-desc">Replace password-based auth with WebAuthn passkeys. Target: 60% reduction in auth support tickets.</div>
                <div className="progress-track"><div className="progress-fill progress-fill--green" style={{ width: '35%' }}></div></div>
                <div className="bet-card-footer">
                  <div className="avatar-group">
                    <Avatar initials="TG" />
                    <Avatar initials="KL" />
                    <Avatar initials="AT" agent />
                  </div>
                  <span className="percent-label">35%</span>
                </div>
              </div>

              {/* Bet 2: At Risk */}
              <div className="bet-card">
                <div className="bet-card-top">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span className="status-dot" style={{ background: 'var(--accent-secondary)' }}></span>
                    <span className="badge badge--amber">At risk</span>
                  </div>
                  <span className="badge badge--amber">$5,000</span>
                </div>
                <div className="bet-card-title">Search rewrite</div>
                <div className="bet-card-desc">Replace Elasticsearch with a hybrid vector + keyword search. Sub-200ms p95 latency target.</div>
                <div className="progress-track"><div className="progress-fill progress-fill--amber" style={{ width: '68%' }}></div></div>
                <div className="bet-card-footer">
                  <div className="avatar-group">
                    <Avatar initials="JS" />
                    <Avatar initials="AT" agent />
                    <Avatar initials="MR" />
                  </div>
                  <span className="percent-label">68%</span>
                </div>
              </div>

              {/* Bet 3: Draft */}
              <div className="bet-card">
                <div className="bet-card-top">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span className="status-dot" style={{ background: 'var(--status-info)' }}></span>
                    <span className="badge badge--blue">Draft</span>
                  </div>
                  <span className="badge badge--amber">$3,800</span>
                </div>
                <div className="bet-card-title">Billing overhaul</div>
                <div className="bet-card-desc">Usage-based billing with agent compute metering. Replace flat-rate plans with per-token pricing.</div>
                <div className="progress-track"><div className="progress-fill progress-fill--green" style={{ width: '0%' }}></div></div>
                <div className="bet-card-footer">
                  <div className="avatar-group">
                    <Avatar initials="JS" />
                  </div>
                  <span className="percent-label">0%</span>
                </div>
              </div>

              {/* Bet 4: Completed */}
              <div className="bet-card bet-card--completed">
                <div className="bet-card-top">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span className="status-dot" style={{ background: 'var(--border-strong)' }}></span>
                    <span className="badge badge--default">Completed</span>
                  </div>
                  <span className="badge badge--amber">$1,200</span>
                </div>
                <div className="bet-card-title">Onboarding v3</div>
                <div className="bet-card-desc">New guided onboarding flow with agent introduction. Reduced time-to-value from 8 min to 2 min.</div>
                <div className="progress-track"><div className="progress-fill progress-fill--green" style={{ width: '100%' }}></div></div>
                <div className="bet-card-footer">
                  <div className="avatar-group">
                    <Avatar initials="TG" />
                    <Avatar initials="KL" />
                  </div>
                  <span className="percent-label">100%</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
