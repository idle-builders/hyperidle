<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Knowledge: Empty State</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    #root { max-width: none; padding: 0; }
    html, body { overflow: hidden; }
    .app-shell { display: flex; height: 100vh; background: var(--surface-container); gap: 3px; padding: 3px; }
    .sidebar { width: 200px; flex-shrink: 0; padding: 12px; }
    .sidebar-brand { font-size: 15px; font-weight: 700; color: var(--text-primary); padding: 6px 12px; margin-bottom: 18px; letter-spacing: -0.01em; }
    .sidebar-section { margin-bottom: 18px; }
    .sidebar-label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 9px; padding: 0 12px; }
    .sidebar-item { padding: 6px 12px; font-size: 13px; color: var(--text-secondary); border-radius: var(--r-subtle); margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .sidebar-item--active { background: var(--surface-elevated); color: var(--text-primary); font-weight: 500; box-shadow: var(--shadow-subtle); }
    .sidebar-divider { border: none; border-top: 1px solid var(--border-subtle); margin: 12px 12px; }
    .main { flex: 1; background: var(--surface-elevated); border-radius: var(--r-subtle); box-shadow: var(--shadow-subtle); display: flex; flex-direction: column; overflow: hidden; }
    .main-header { padding: 18px 24px; border-bottom: 1px solid var(--border-subtle); }
    .main-header h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .empty-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .empty-card { background: var(--surface-page); border-radius: var(--r-default); padding: 36px; max-width: 420px; text-align: left; }
    .empty-icon { width: 48px; height: 48px; border-radius: var(--r-default); background: rgba(46, 125, 186, 0.08); display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 18px; color: var(--status-info); }
    .empty-title { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 9px; letter-spacing: -0.01em; }
    .empty-desc { font-size: 15px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 18px; }
    .btn { display: inline-flex; align-items: center; font-family: var(--font-sans); font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: var(--r-pill); border: 1.5px solid transparent; cursor: pointer; background: var(--accent-primary); color: var(--text-on-accent); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Demo() {
      return (
        <div className="app-shell">
          <div className="sidebar">
            <div className="sidebar-brand">HyperIdle</div>
            <div className="sidebar-section">
              <div className="sidebar-label">Scope</div>
              <div className="sidebar-item sidebar-item--active">Practice</div>
              <div className="sidebar-item">Product</div>
            </div>
            <hr className="sidebar-divider" />
            <div className="sidebar-section">
              <div className="sidebar-label">Topics</div>
              <div className="sidebar-item" style={{ color: 'var(--text-tertiary)', fontStyle: 'italic' }}>No topics yet</div>
            </div>
          </div>
          <div className="main">
            <div className="main-header"><h2>Knowledge</h2></div>
            <div className="empty-center">
              <div className="empty-card">
                <div className="empty-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                  </svg>
                </div>
                <div className="empty-title">Your knowledge base is empty</div>
                <div className="empty-desc">Knowledge items capture patterns, decisions, and lessons learned. As your agents work, they will start indexing insights here automatically. You can also add items manually.</div>
                <button className="btn">Create first item</button>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
