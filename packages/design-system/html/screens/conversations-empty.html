<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen — Conversations: Empty State</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    #root { max-width: none; padding: 0; }
    html, body { overflow: hidden; }

    .app-shell {
      display: flex;
      height: 100vh;
      background: var(--surface-container);
      gap: 3px;
      padding: 3px;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }
    .sidebar-brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      padding: 6px 12px;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }
    .sidebar-section { margin-bottom: 18px; }
    .sidebar-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 9px;
      padding: 0 12px;
    }
    .sidebar-item {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      border-radius: var(--r-subtle);
      margin-bottom: 3px;
      cursor: pointer;
      transition: background 240ms ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-item:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-item--active {
      background: var(--surface-elevated);
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: var(--shadow-subtle);
    }
    .sidebar-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: var(--r-pill);
      flex-shrink: 0;
    }
    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 12px 12px;
    }
    .sidebar-view {
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--r-subtle);
      margin-bottom: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-view:hover { background: rgba(44, 36, 26, 0.04); }
    .sidebar-view--active { color: var(--text-primary); }
    .sidebar-bottom { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 3px; }
    .sidebar-search-hint { padding: 6px 12px; font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; justify-content: space-between; }
    .kbd { font-size: 11px; font-family: var(--font-mono); color: var(--text-tertiary); background: var(--surface-container); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-subtle); }
    .sidebar-avatar { width: 28px; height: 28px; border-radius: var(--r-pill); background: var(--surface-page); border: 1.5px solid var(--border-default); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }

    /* Main Panel */
    .main {
      flex: 1;
      background: var(--surface-elevated);
      border-radius: var(--r-subtle);
      box-shadow: var(--shadow-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .main-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .main-header h2 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Empty state — warm, inviting, not barren */
    .empty-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .empty-card {
      background: var(--surface-page);
      border-radius: var(--r-default);
      padding: 36px;
      max-width: 420px;
      text-align: left;
    }
    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--r-default);
      background: rgba(22, 118, 79, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 18px;
      color: var(--accent-primary);
    }
    .empty-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 9px;
      letter-spacing: -0.01em;
    }
    .empty-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      padding: 10px 18px;
      border-radius: var(--r-pill);
      border: 1.5px solid transparent;
      cursor: pointer;
      background: var(--accent-primary);
      color: var(--text-on-accent);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function Demo() {
      return (
        <div className="app-shell">
          <div className="sidebar">
            <div className="sidebar-brand">HyperIdle</div>
            <div className="sidebar-section">
              <div className="sidebar-view sidebar-view--active">Conversations</div>
              <div className="sidebar-item" style={{ fontStyle: 'italic', color: 'var(--text-tertiary)' }}>No threads yet</div>
            </div>
            <div className="sidebar-section">
              <div className="sidebar-view">Work</div>
            </div>
            <div className="sidebar-section">
              <div className="sidebar-view">Knowledge</div>
            </div>
            <div className="sidebar-bottom">
              <div className="sidebar-search-hint">
                <span>Search</span>
                <span className="kbd">⌘K</span>
              </div>
              <hr className="sidebar-divider" />
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '6px 12px' }}>
                <div className="sidebar-avatar">TG</div>
                <div className="sidebar-item" style={{ padding: 0, marginBottom: 0, flex: 1 }}>Assistant</div>
              </div>
            </div>
          </div>

          <div className="main">
            <div className="main-header">
              <h2>Auth migration</h2>
            </div>
            <div className="empty-center">
              <div className="empty-card">
                <div className="empty-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                </div>
                <div className="empty-title">No conversations yet</div>
                <div className="empty-desc">Start a thread to coordinate with your team and agents. Conversations are where decisions happen — every message can carry context, artifacts, and actions.</div>
                <button className="btn">Start a thread</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
