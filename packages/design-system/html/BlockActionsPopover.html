<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlockActionsPopover — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    body { font-family: var(--ui); color: var(--text); background: var(--surface-0); margin: 0; padding: 24px; }
    .demo-grid { display: flex; flex-direction: column; gap: 24px; max-width: 320px; }
    .demo-section { display: flex; flex-direction: column; gap: 8px; }
    .demo-section-title { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-lo); }
    .block-actions-popover {
      min-width: 200px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r2);
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .block-actions-popover [role="menuitem"] {
      text-align: left;
      font-size: 13px;
      color: var(--text);
      padding: 6px 10px;
      border-radius: var(--r1);
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .block-actions-popover [role="menuitem"]:hover { background: var(--surface-ghost); }
    .block-actions-popover [role="menuitem"][aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
    .block-actions-popover .shortcut { font-family: var(--mono); font-size: 11px; color: var(--text-lo); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <div id="root">
    <div class="demo-grid">
      <div class="demo-section">
        <div class="demo-section-title">Default Items</div>
        <div class="block-actions-popover" data-ds-component="block-actions-popover" data-ds-tier="2" data-ds-source="design-system" role="menu">
          <button type="button" role="menuitem"><span>Copy permalink</span><span class="shortcut">⌘L</span></button>
          <button type="button" role="menuitem"><span>View threads</span><span class="shortcut">↵</span></button>
          <button type="button" role="menuitem" aria-disabled="true"><span>Suggest edit</span><span class="shortcut">⌘E</span></button>
          <span aria-live="polite" class="sr-only" id="live-1"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
