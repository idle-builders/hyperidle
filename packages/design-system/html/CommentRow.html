<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CommentRow — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    /* ── CommentRow ──
       Thread message row. 36px avatar, sender name + optional agent badge,
       message text at 15px, action blocks with green tint. Matches
       03-hearth.html Thread Detail screen messages. No density tokens. */

    .comment-row {
      display: flex;
      gap: 12px;
      padding: 0;
      list-style: none;
    }
    .comment-row__avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--r-pill);
      background: var(--surface-page);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1.5px solid var(--border-subtle);
    }
    .comment-row__avatar--agent {
      background: rgba(22, 118, 79, 0.08);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }
    .comment-row__avatar-spacer {
      width: 36px;
      flex-shrink: 0;
    }

    .comment-row__body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }
    .comment-row__header {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .comment-row__sender-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .comment-row__time {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .comment-row__badge {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      background: rgba(22, 118, 79, 0.08);
      color: var(--accent-primary);
    }

    .comment-row__text {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 0;
    }

    /* Action block */
    .comment-row__action {
      margin-top: 9px;
      background: rgba(22, 118, 79, 0.03);
      border-radius: var(--r-subtle);
      padding: 9px 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .comment-row__action-label {
      color: var(--text-secondary);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .comment-row__action-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: var(--r-pill);
      background: var(--accent-primary);
      flex-shrink: 0;
    }
    .comment-row__action-status {
      font-size: 12px;
      font-weight: 600;
    }
    .comment-row__action-status--success { color: var(--status-success); }
    .comment-row__action-status--warning { color: var(--status-warning); }

    .stream {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 18px 24px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    function CommentRow({ sender, agent, time, text, action, showHeader = true }) {
      return (
        <li
          className="comment-row"
          data-component="CommentRow"
          data-tier="2"
          data-uses="Avatar,Badge"
          data-daisyui=""
          data-used-by="ThreadDetail,BetDetail"
        >
          {showHeader ? (
            <span className={`comment-row__avatar ${agent ? 'comment-row__avatar--agent' : ''}`}>
              {sender.charAt(0).toUpperCase() + (sender.charAt(1) || '').toUpperCase()}
            </span>
          ) : (
            <span className="comment-row__avatar-spacer" aria-hidden="true" />
          )}
          <div className="comment-row__body">
            {showHeader && (
              <div className="comment-row__header">
                <span className="comment-row__sender-name">{sender}</span>
                {agent && <span className="comment-row__badge">Agent</span>}
                <span className="comment-row__time">{time}</span>
              </div>
            )}
            <p className="comment-row__text">{text}</p>
            {action && (
              <div className="comment-row__action">
                <span className="comment-row__action-label">
                  <span className="comment-row__action-dot"></span>
                  {action.label}
                </span>
                <span className={`comment-row__action-status comment-row__action-status--${action.variant}`}>
                  {action.status}
                </span>
              </div>
            )}
          </div>
        </li>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Thread Messages</div>
            <div style={{ background: 'var(--surface-elevated)', borderRadius: 'var(--r-default)', overflow: 'hidden' }}>
              <ul className="stream" style={{ margin: 0 }}>
                <CommentRow
                  sender="Tobias"
                  time="2:34 PM"
                  text="Let's start the passkey migration. Can you draft a rollout plan that doesn't break existing sessions?"
                />
                <CommentRow
                  sender="Atlas"
                  agent
                  time="2:35 PM"
                  text="I've drafted a 3-phase plan: shadow enrollment, dual-auth window, then password deprecation. Existing sessions stay valid through phase 2."
                  action={{ label: 'Deployment plan — 3 phases', status: 'Ready', variant: 'success' }}
                />
                <CommentRow
                  sender="Kim"
                  time="2:41 PM"
                  text="What about the 12k active sessions? We need a migration path that doesn't force re-auth for everyone at once."
                />
                <CommentRow
                  sender="Atlas"
                  agent
                  time="2:42 PM"
                  text="Good call. Updated the plan: phase 1 uses lazy enrollment — users get prompted on next login, not forced."
                  action={{ label: 'Session migration strategy', status: 'Updated', variant: 'warning' }}
                />
              </ul>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
