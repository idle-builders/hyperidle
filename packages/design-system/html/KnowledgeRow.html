<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KnowledgeRow — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .knowledge-row {
      display: flex;
      align-items: center;
      /* K11: gap + padding consume density tokens. Per density-audit.md
         § 3.2.2 the J7 factoryMode `padding: 16px` override is retired —
         padding follows --density-pad-y so factoryMode + comfortable does
         not compound. */
      gap: var(--density-gap);
      padding: var(--density-pad-y) var(--density-pad-x);
      border-radius: var(--r-subtle);
      transition: background var(--motion-fast);
      cursor: pointer;
    }
    .knowledge-row:hover {
      background: var(--surface-elevated);
    }
    .knowledge-row:focus-visible {
      outline: 1px solid var(--accent-primary);
      outline-offset: -1px;
    }
    /* K11: factory variant no longer overrides padding (now driven by
       --density-pad-y). Title weight + font-mono remain factory-only. */

    .knowledge-row__body {
      flex: 1;
      min-width: 0;
    }
    .knowledge-row__header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .knowledge-row__title {
      /* K11: title font scales with density per density-audit.md § 3.2.2
         (body text ✓ for KnowledgeRow). */
      font-size: var(--density-text);
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .knowledge-row__title--factory {
      font-family: var(--mono);
      font-weight: 700;
    }
    .knowledge-row__caption {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .knowledge-row__timestamp {
      font-size: 12px;
      color: var(--text-tertiary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* @lore K7 / AESTHETICS.md § Spacing & Density "Grid base unit" + § Typography
       "Body size (default)": padding 2px 6px → 2px 8px (off-grid), font-size 10px → 11px
       (off-scale). Letter-spacing → --tracking-caps (0.02em) per "Letter-spacing for caps". */
    .knowledge-row__version {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: var(--tracking-caps);
      background: color-mix(in oklab, var(--text-secondary) 8%, transparent);
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    /* --- Tier 1: StatusChip --- */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-chip--healthy { background: color-mix(in oklab, var(--status-success) 14%, transparent); color: var(--status-success); }
    .status-chip--healthy .dot { background: var(--status-success); }
    .status-chip--behind { background: color-mix(in oklab, var(--status-warning) 14%, transparent); color: var(--status-warning); }
    .status-chip--behind .dot { background: var(--status-warning); }
    .status-chip--blocked { background: color-mix(in oklab, var(--status-error) 14%, transparent); color: var(--status-error); }
    .status-chip--blocked .dot { background: var(--status-error); }
    .status-chip--paused { background: color-mix(in oklab, var(--text-tertiary) 14%, transparent); color: var(--text-tertiary); }
    .status-chip--paused .dot { background: var(--text-tertiary); }
    .status-chip--done { background: color-mix(in oklab, var(--status-success) 14%, transparent); color: var(--status-success); }
    .status-chip--done .dot { background: var(--status-success); }
    .status-chip--error { background: color-mix(in oklab, var(--status-error) 14%, transparent); color: var(--status-error); }
    .status-chip--error .dot { background: var(--status-error); }

    /* --- Tier 1: Tag --- */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: color-mix(in oklab, var(--text-secondary) 8%, transparent);
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* --- Signal triad (L22) --- */
    /* Three inline chips: recency · frequency · impact.
       em-dash (—) marks absent data so absent signals are visually distinct
       from "zero" — a zero access count is a real observation; an em-dash
       means no signal has been recorded yet. */
    .signal-triad {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .signal-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: var(--tracking-caps);
      background: color-mix(in oklab, var(--text-secondary) 8%, transparent);
      color: var(--text-tertiary);
      white-space: nowrap;
    }
    .signal-chip__label {
      color: var(--text-tertiary);
      font-size: 9px;
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
    }
    .signal-chip__value {
      color: var(--text-secondary);
    }
    .signal-chip__value--absent {
      color: var(--text-tertiary);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    const KNOWLEDGE_STATUS_MAP = {
      captured: "paused",
      provisional: "behind",
      validated: "healthy",
      active: "healthy",
      stale: "error",
      archived: "done",
      needs_human: "behind",
    };

    function StatusChip({ status }) {
      return (
        <span
          className={`status-chip status-chip--${status}`}
          title={status}
          data-component="StatusChip"
          data-tier="1"
        >
          <span className="dot" />
          {status.toUpperCase()}
        </span>
      );
    }

    function Tag({ label }) {
      return (
        <span className="tag" data-component="Tag" data-tier="1">
          {label}
        </span>
      );
    }

    /**
     * SignalTriad — three inline signal chips: recency · frequency · impact.
     * Props:
     *   recency   — string (e.g. "3h ago") or null for absent
     *   frequency — number or null for absent
     *   impact    — number or null for absent (always null in L22, staged)
     *
     * Absent values render an em-dash (—) with reduced opacity so callers
     * can distinguish "no data yet" from "zero accesses".
     */
    function SignalChip({ label, value }) {
      const isAbsent = value == null;
      return (
        <span className="signal-chip" title={`${label}: ${isAbsent ? "no data" : value}`}>
          <span className="signal-chip__label">{label}</span>
          <span className={`signal-chip__value${isAbsent ? " signal-chip__value--absent" : ""}`}>
            {isAbsent ? "—" : value}
          </span>
        </span>
      );
    }

    function SignalTriad({ recency, frequency, impact }) {
      return (
        <div
          className="signal-triad"
          data-component="SignalTriad"
          data-tier="1"
          aria-label={`Signals: recency ${recency ?? "absent"}, frequency ${frequency ?? "absent"}, impact ${impact ?? "absent"}`}
        >
          <SignalChip label="REC" value={recency} />
          <SignalChip label="FREQ" value={frequency != null ? frequency : null} />
          <SignalChip label="IMP" value={impact} />
        </div>
      );
    }

    function KnowledgeRow({ title, layer, kind, status, timestamp, caption, factoryMode, version, signals }) {
      const presentationStatus = KNOWLEDGE_STATUS_MAP[status] || "paused";
      const rowCls = `knowledge-row${factoryMode ? " knowledge-row--factory" : ""}`;
      const titleCls = `knowledge-row__title${factoryMode ? " knowledge-row__title--factory" : ""}`;

      return (
        <div
          className={rowCls}
          role="button"
          tabIndex={0}
          data-component="KnowledgeRow"
          data-tier="2"
          data-uses="StatusChip,Tag"
          data-daisyui=""
          data-used-by="KnowledgeList,KnowledgeTopicGroup"
          data-ds-component="KnowledgeRow"
          data-ds-tier="2"
          data-ds-source="design-system"
        >
          <div className="knowledge-row__body">
            <div className="knowledge-row__header">
              <span className={titleCls} aria-label={`Knowledge: ${title}`}>{title}</span>
              <Tag label={layer} />
              <Tag label={kind} />
              <StatusChip status={presentationStatus} />
              {factoryMode && version && (
                <span className="knowledge-row__version">{version}</span>
              )}
            </div>
            {caption && <p className="knowledge-row__caption">{caption}</p>}
          </div>
          {signals && (
            <SignalTriad
              recency={signals.recency}
              frequency={signals.frequency}
              impact={signals.impact}
            />
          )}
          <span className="knowledge-row__timestamp">{timestamp}</span>
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Validated</div>
            <KnowledgeRow
              title="API Rate Limiting Pattern"
              layer="L2"
              kind="pattern"
              status="validated"
              timestamp="3 hours ago"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Stale</div>
            <KnowledgeRow
              title="Old Deployment Strategy"
              layer="L1"
              kind="decision"
              status="stale"
              timestamp="2 days ago"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Factory Mode</div>
            <KnowledgeRow
              title="Agent Autonomy Policy"
              layer="L0"
              kind="decision"
              status="active"
              timestamp="1w ago"
              factoryMode={true}
              version="v2.1"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">All Layers</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
              <KnowledgeRow title="L0 item" layer="L0" kind="brief" status="captured" timestamp="now" />
              <KnowledgeRow title="L1 item" layer="L1" kind="principle" status="active" timestamp="1h ago" />
              <KnowledgeRow title="L2 item" layer="L2" kind="pattern" status="validated" timestamp="2h ago" />
              <KnowledgeRow title="L3 item" layer="L3" kind="anti_pattern" status="provisional" timestamp="3h ago" />
              <KnowledgeRow title="L4 item" layer="L4" kind="reflection" status="archived" timestamp="1d ago" />
            </div>
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Signal Triad — All Signals Present (L22)</div>
            <KnowledgeRow
              title="Rate Limiter Pattern (fully signalled)"
              layer="L3"
              kind="pattern"
              status="active"
              timestamp="2h ago"
              signals={{ recency: "2h ago", frequency: 7, impact: null }}
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Signal Triad — Absent Data (em-dash marker)</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
              {/* No signals at all — first-ever view, nothing logged yet */}
              <KnowledgeRow
                title="Unreferenced Principle (no signals)"
                layer="L1"
                kind="principle"
                status="captured"
                timestamp="1d ago"
                signals={{ recency: null, frequency: null, impact: null }}
              />
              {/* Recency present, frequency and impact absent */}
              <KnowledgeRow
                title="Rarely Accessed Decision (recency only)"
                layer="L2"
                kind="decision"
                status="validated"
                timestamp="5d ago"
                signals={{ recency: "5d ago", frequency: null, impact: null }}
              />
              {/* Frequency present (0 is a real observation), recency and impact absent */}
              <KnowledgeRow
                title="Accessed Once (frequency=1, recency absent)"
                layer="L3"
                kind="reflection"
                status="provisional"
                timestamp="3d ago"
                signals={{ recency: null, frequency: 1, impact: null }}
              />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
