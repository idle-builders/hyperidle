<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KnowledgeRow — HyperIdle Design System</title>
  <link rel="stylesheet" href="_tokens.css" />
  <style>
    .knowledge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: var(--r1);
      transition: background var(--motion-fast);
      cursor: pointer;
    }
    .knowledge-row:hover {
      background: var(--surface-4);
    }
    .knowledge-row:focus-visible {
      outline: 1px solid var(--primary);
      outline-offset: -1px;
    }
    .knowledge-row--factory {
      padding-top: 16px;
      padding-bottom: 16px;
    }

    .knowledge-row__body {
      flex: 1;
      min-width: 0;
    }
    .knowledge-row__header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .knowledge-row__title {
      font-size: 14px;
      color: var(--text-hi);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .knowledge-row__title--factory {
      font-family: var(--mono);
      font-weight: 700;
    }
    .knowledge-row__caption {
      font-size: 12px;
      color: var(--text-mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .knowledge-row__timestamp {
      font-size: 12px;
      color: var(--text-lo);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .knowledge-row__version {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.03em;
      background: var(--surface-ghost);
      color: var(--text-lo);
      flex-shrink: 0;
    }

    /* --- Tier 1: StatusChip --- */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-chip--healthy { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
    .status-chip--healthy .dot { background: var(--ok); }
    .status-chip--behind { background: color-mix(in oklab, var(--warn) 14%, transparent); color: var(--warn); }
    .status-chip--behind .dot { background: var(--warn); }
    .status-chip--blocked { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
    .status-chip--blocked .dot { background: var(--danger); }
    .status-chip--paused { background: color-mix(in oklab, var(--text-lo) 14%, transparent); color: var(--text-lo); }
    .status-chip--paused .dot { background: var(--text-lo); }
    .status-chip--done { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
    .status-chip--done .dot { background: var(--ok); }
    .status-chip--error { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
    .status-chip--error .dot { background: var(--danger); }

    /* --- Tier 1: Tag --- */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: var(--surface-ghost);
      color: var(--text-mid);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">
    const KNOWLEDGE_STATUS_MAP = {
      captured: "paused",
      provisional: "behind",
      validated: "healthy",
      active: "healthy",
      stale: "error",
      archived: "done",
      needs_human: "behind",
    };

    function StatusChip({ status }) {
      return (
        <span
          className={`status-chip status-chip--${status}`}
          title={status}
          data-component="StatusChip"
          data-tier="1"
        >
          <span className="dot" />
          {status.toUpperCase()}
        </span>
      );
    }

    function Tag({ label }) {
      return (
        <span className="tag" data-component="Tag" data-tier="1">
          {label}
        </span>
      );
    }

    function KnowledgeRow({ title, layer, kind, status, timestamp, caption, factoryMode, version }) {
      const presentationStatus = KNOWLEDGE_STATUS_MAP[status] || "paused";
      const rowCls = `knowledge-row${factoryMode ? " knowledge-row--factory" : ""}`;
      const titleCls = `knowledge-row__title${factoryMode ? " knowledge-row__title--factory" : ""}`;

      return (
        <div
          className={rowCls}
          role="button"
          tabIndex={0}
          data-component="KnowledgeRow"
          data-tier="2"
          data-uses="StatusChip,Tag"
          data-daisyui=""
          data-used-by="KnowledgeList,KnowledgeTopicGroup"
          data-ds-component="KnowledgeRow"
          data-ds-tier="2"
          data-ds-source="design-system"
        >
          <div className="knowledge-row__body">
            <div className="knowledge-row__header">
              <span className={titleCls} aria-label={`Knowledge: ${title}`}>{title}</span>
              <Tag label={layer} />
              <Tag label={kind} />
              <StatusChip status={presentationStatus} />
              {factoryMode && version && (
                <span className="knowledge-row__version">{version}</span>
              )}
            </div>
            {caption && <p className="knowledge-row__caption">{caption}</p>}
          </div>
          <span className="knowledge-row__timestamp">{timestamp}</span>
        </div>
      );
    }

    function Demo() {
      return (
        <div className="demo-grid">
          <div className="demo-section">
            <div className="demo-section-title">Validated</div>
            <KnowledgeRow
              title="API Rate Limiting Pattern"
              layer="L2"
              kind="pattern"
              status="validated"
              timestamp="3 hours ago"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Stale</div>
            <KnowledgeRow
              title="Old Deployment Strategy"
              layer="L1"
              kind="decision"
              status="stale"
              timestamp="2 days ago"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">Factory Mode</div>
            <KnowledgeRow
              title="Agent Autonomy Policy"
              layer="L0"
              kind="decision"
              status="active"
              timestamp="1w ago"
              factoryMode={true}
              version="v2.1"
            />
          </div>

          <div className="demo-section">
            <div className="demo-section-title">All Layers</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
              <KnowledgeRow title="L0 item" layer="L0" kind="brief" status="captured" timestamp="now" />
              <KnowledgeRow title="L1 item" layer="L1" kind="principle" status="active" timestamp="1h ago" />
              <KnowledgeRow title="L2 item" layer="L2" kind="pattern" status="validated" timestamp="2h ago" />
              <KnowledgeRow title="L3 item" layer="L3" kind="anti_pattern" status="provisional" timestamp="3h ago" />
              <KnowledgeRow title="L4 item" layer="L4" kind="reflection" status="archived" timestamp="1d ago" />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
  <script src="themes/_switcher.js"></script>
</body>
</html>
