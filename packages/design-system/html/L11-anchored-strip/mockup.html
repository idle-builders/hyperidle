<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>L11 Anchored-strip — Inline rich messages (Variant C)</title>
  <link rel="stylesheet" href="../_tokens.css" />
  <style>
    /* GitHub PR review-comment grammar in HyperIdle's monochrome system.
       Left gutter rule claims artifact + action strip as one unit;
       action strip is sticky-within-message. */

    body { background: var(--surface-page); padding: 24px; }

    .pane {
      display: flex; flex-direction: column;
      max-width: 880px; margin: 0 auto;
      background: var(--surface-container);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-default);
      overflow: hidden;
    }

    /* ThinHeader (replaces ReviewHeader) */
    .thin-header {
      display: flex; align-items: center; gap: 8px;
      padding: 6px var(--density-pad-x);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-tertiary);
      background: var(--surface-container);
    }
    .thin-header__back {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px;
      border-radius: var(--r-subtle);
      color: var(--text-secondary); flex-shrink: 0;
    }
    .thin-header__back:hover { background: color-mix(in oklab, var(--text-secondary) 8%, transparent); color: var(--text-primary); }
    .thin-header__host {
      color: var(--text-primary);
      font-weight: 500;
      max-width: 360px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thin-header__sender { color: var(--text-secondary); }
    .thin-header__time { color: var(--text-tertiary); }
    .thin-header .sep { color: var(--text-tertiary); }

    /* HostBanner */
    .host-banner {
      display: flex; align-items: center; gap: 12px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-bottom: 1px solid var(--border-subtle);
    }
    .host-banner__main { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .host-banner__title { color: var(--text-primary); font-weight: 500; }

    .tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: color-mix(in oklab, var(--text-secondary) 8%, transparent);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      flex-shrink: 0;
    }
    .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-chip--blocked {
      background: color-mix(in oklab, var(--status-error) 14%, transparent);
      color: var(--status-error);
    }
    .status-chip--blocked .dot { background: var(--status-error); }
    .status-chip--done {
      background: color-mix(in oklab, var(--status-success) 14%, transparent);
      color: var(--status-success);
    }
    .status-chip--done .dot { background: var(--status-success); }

    /* Stream */
    .stream {
      display: flex; flex-direction: column;
      padding: var(--density-pad-y) 0;
      list-style: none; margin: 0;
    }

    /* CommentRow */
    .row {
      display: flex; gap: 8px;
      padding: 10px var(--density-pad-x);
    }
    .row__avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface-elevated);
      color: var(--text-secondary);
      font-size: 11px; font-weight: 500;
      border: 1px solid var(--border-subtle);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .row__body {
      display: flex; flex-direction: column;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .row__header {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px;
    }
    .row__sender { color: var(--text-primary); font-weight: 500; }
    .row__role { color: var(--text-tertiary); }
    .row__meta { color: var(--text-tertiary); font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; }
    .row__time { color: var(--text-tertiary); margin-left: auto; font-size: 11px; }
    .row__text { font-size: 13px; color: var(--text-secondary); margin: 0; }
    .row__title {
      font-size: 15px; font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    /* AnchorFrame — the GitHub-style left-gutter wrapper */
    .anchor-frame {
      position: relative;
      border: 1px solid var(--border-subtle);
      border-left: 2px solid var(--text-tertiary);
      border-radius: 0 var(--r-default) var(--r-default) 0;
      background: var(--surface-container);
      overflow: hidden;
    }
    .anchor-frame--blocking {
      border-left-color: var(--status-error);
    }

    /* ArtifactView inside anchor-frame */
    .artifact {
      background: var(--surface-container);
    }
    .artifact__strip {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .artifact__kind {
      padding: 1px 6px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-subtle);
      text-transform: uppercase;
    }
    .artifact__label { color: var(--text-tertiary); }
    .artifact__value { color: var(--text-primary); }
    .artifact__routing { margin-left: auto; }
    .artifact__body {
      padding: 8px 10px;
      max-height: 240px;
      overflow-y: auto;
    }
    .diff {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre;
      overflow-x: auto;
    }
    .diff__hunk-header { color: var(--text-tertiary); padding: 2px 0; }
    .diff__line { display: block; padding: 0 4px; }
    .diff__line--add {
      background: color-mix(in oklab, var(--status-success) 14%, transparent);
      color: var(--text-primary);
    }
    .diff__line--del {
      background: color-mix(in oklab, var(--status-error) 14%, transparent);
      color: var(--text-primary);
    }
    .diff__prefix { color: var(--text-tertiary); user-select: none; margin-right: 6px; }

    /* AnchoredActionStrip — sticky to anchor-frame's bottom edge */
    .action-strip {
      position: sticky;
      bottom: 0;
      display: flex; flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface-elevated);
      border-top: 1px solid var(--border-subtle);
    }
    .action-strip__label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-right: 4px;
    }

    .btn {
      padding: 5px 10px;
      border-radius: var(--r-subtle);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background var(--motion-fast);
      font-family: inherit;
    }
    .btn--primary {
      background: var(--accent-primary);
      color: var(--surface-page);
    }
    .btn--primary:hover { filter: brightness(1.05); }
    .btn--ghost {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--border-subtle);
    }
    .btn--ghost:hover { background: color-mix(in oklab, var(--text-secondary) 8%, transparent); color: var(--text-primary); }
    .btn--danger {
      background: transparent;
      color: var(--status-error);
      border-color: color-mix(in oklab, var(--status-error) 30%, transparent);
    }
    .btn--danger:hover { background: color-mix(in oklab, var(--status-error) 8%, transparent); }

    /* Reasoning blockquote — sits BELOW the anchor-frame */
    .reasoning {
      border-left: 2px solid var(--border-subtle);
      padding: 4px 12px;
      margin: 0;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .reasoning__label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 4px;
    }
    .reasoning ol {
      margin: 0;
      padding-left: 20px;
    }
    .reasoning ol li { margin: 2px 0; }

    /* Verdict strip (replaces action strip when resolved) */
    .verdict-strip {
      position: sticky;
      bottom: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      background: var(--surface-elevated);
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .verdict-strip__label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .verdict-strip__label--ok { color: var(--status-success); }
    .verdict-strip__actor { color: var(--text-secondary); }
    .verdict-strip__time { color: var(--text-tertiary); }
    .verdict-strip__note { color: var(--text-tertiary); margin-left: 4px; }

    /* Verdict CommentRow */
    .row__verdict { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .row__verdict-note { color: var(--text-tertiary); }

    /* Composer */
    .composer {
      display: flex; align-items: stretch; gap: 8px;
      padding: var(--density-pad-y) var(--density-pad-x);
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-container);
    }
    .composer__textarea {
      flex: 1; min-height: 36px;
      background: var(--surface-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-subtle);
      padding: 8px 10px; font-size: 13px;
      resize: vertical;
    }
    .composer__send {
      align-self: flex-end;
      padding: 6px 14px;
      border-radius: var(--r-subtle);
      font-size: 13px;
      font-weight: 500;
      background: var(--accent-primary); color: var(--surface-page);
      border: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script type="text/babel" data-presets="env,react">

    function ThinHeader() {
      return (
        <div className="thin-header" data-component="ThinHeader" data-tier="3">
          <a className="thin-header__back" href="#" aria-label="Back to queue">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </a>
          <span className="sep">·</span>
          <span className="thin-header__host">Pricing overhaul (Nimmly)</span>
          <span className="sep">·</span>
          <span className="thin-header__sender">Maya · Product Manager</span>
          <span className="thin-header__time">@ 18 min ago</span>
        </div>
      );
    }

    function HostBanner() {
      return (
        <div className="host-banner" data-component="ThreadHostBanner" data-tier="3">
          <div className="host-banner__main">
            <span className="tag">BET</span>
            <span className="host-banner__title">Pricing overhaul (Nimmly)</span>
          </div>
          <span className="status-chip status-chip--blocked"><span className="dot" />BLOCKED</span>
        </div>
      );
    }

    function PlainRow({ name, role, text, time }) {
      return (
        <li className="row" data-component="CommentRow" data-tier="2">
          <span className="row__avatar">{name.charAt(0).toUpperCase()}</span>
          <div className="row__body">
            <div className="row__header">
              <span className="row__sender">{name}</span>
              <span className="row__role">· {role}</span>
              <span className="row__time">{time}</span>
            </div>
            <p className="row__text">{text}</p>
          </div>
        </li>
      );
    }

    function ReviewRow({ blocking }) {
      return (
        <li className="row" data-component="CommentRow" data-variant="rich-review" data-tier="2">
          <span className="row__avatar">M</span>
          <div className="row__body">
            <div className="row__header">
              <span className="row__sender">Maya</span>
              <span className="row__role">· Product Manager</span>
              <span className="row__meta">· #2 · REVIEW</span>
              <span className="row__time">18 min ago</span>
            </div>
            <h3 className="row__title">Approve deploy of v2.4 to staging</h3>

            <div
              className={"anchor-frame " + (blocking ? "anchor-frame--blocking" : "")}
              data-component="AnchorFrame"
              data-tier="2"
              data-uses="ArtifactView,AnchoredActionStrip"
            >
              <div className="artifact" data-component="ArtifactView" data-tier="3">
                <div className="artifact__strip">
                  <span className="artifact__kind">text_diff</span>
                  <span className="artifact__label">status</span>
                  <span className="artifact__value">in review</span>
                  <span className="artifact__label">sla</span>
                  <span className="artifact__value">2h</span>
                  <span className="artifact__routing artifact__label">routing</span>
                  <span className="artifact__value">staging</span>
                </div>
                <div className="artifact__body">
                  <div className="diff">
                    <div className="diff__hunk-header">@@ -42,7 +42,9 @@ migrations/v2.4/schema.sql</div>
                    <span className="diff__line"><span className="diff__prefix"> </span>CREATE TABLE products (</span>
                    <span className="diff__line"><span className="diff__prefix"> </span>  id UUID PRIMARY KEY,</span>
                    <span className="diff__line diff__line--add"><span className="diff__prefix">+</span>  cost_cap_cents INT NOT NULL DEFAULT 0,</span>
                    <span className="diff__line diff__line--add"><span className="diff__prefix">+</span>  budget_headroom_pct INT NOT NULL DEFAULT 8,</span>
                    <span className="diff__line"><span className="diff__prefix"> </span>  name TEXT NOT NULL,</span>
                    <span className="diff__line diff__line--del"><span className="diff__prefix">-</span>  legacy_cost_cap INT,</span>
                    <span className="diff__line"><span className="diff__prefix"> </span>  created_at TIMESTAMPTZ DEFAULT now()</span>
                    <span className="diff__line"><span className="diff__prefix"> </span>);</span>
                    <div className="diff__hunk-header">@@ -118,3 +120,8 @@ migrations/v2.4/schema.sql</div>
                    <span className="diff__line diff__line--add"><span className="diff__prefix">+</span>CREATE INDEX idx_products_cost_cap ON products(cost_cap_cents);</span>
                  </div>
                </div>
              </div>
              <div className="action-strip" role="toolbar" aria-label="Verdict actions"
                   data-component="AnchoredActionStrip" data-tier="2">
                <span className="action-strip__label">VERDICT</span>
                <button type="button" className="btn btn--primary">Approve</button>
                <button type="button" className="btn btn--ghost">Approve with comments</button>
                <button type="button" className="btn btn--ghost">Request changes</button>
                <button type="button" className="btn btn--ghost">Edit</button>
                <button type="button" className="btn btn--danger">Reject</button>
              </div>
            </div>

            <blockquote className="reasoning">
              <span className="reasoning__label">REASONING</span>
              <ol>
                <li>Schema migration adds two columns; backfill verified.</li>
                <li>All 142 contract tests pass; integration suite green.</li>
                <li>Cost cap reduced 8%; budget headroom OK.</li>
              </ol>
            </blockquote>
          </div>
        </li>
      );
    }

    function ResolvedReviewRow() {
      return (
        <li className="row" data-component="CommentRow" data-variant="rich-review" data-state="resolved" data-tier="2">
          <span className="row__avatar">D</span>
          <div className="row__body">
            <div className="row__header">
              <span className="row__sender">Dana</span>
              <span className="row__role">· Designer</span>
              <span className="row__meta">· #1 · REVIEW</span>
              <span className="row__time">22 min ago</span>
            </div>
            <h3 className="row__title">Approve copy refresh for the Ambrovia landing</h3>

            <div className="anchor-frame" data-component="AnchorFrame" data-tier="2">
              <div className="artifact" data-component="ArtifactView" data-tier="3">
                <div className="artifact__strip">
                  <span className="artifact__kind">content_preview</span>
                  <span className="artifact__label">status</span>
                  <span className="artifact__value">approved</span>
                  <span className="artifact__label">routing</span>
                  <span className="artifact__value">ambrovia/landing</span>
                </div>
                <div className="artifact__body" style={{ maxHeight: 140 }}>
                  <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: 0 }}>
                    <strong style={{ color: "var(--text-primary)" }}>Cut your fixed costs without cutting your team.</strong>
                  </p>
                  <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "4px 0 0 0" }}>
                    Ambrovia gives operators a single dashboard for cost-cap negotiation, headroom alerts,
                    and revenue projections — built so a CFO and a frontline manager can read the same screen.
                  </p>
                </div>
              </div>
              <div className="verdict-strip" data-component="VerdictStrip" data-tier="2">
                <span className="status-chip status-chip--done"><span className="dot" />APPROVED</span>
                <span className="verdict-strip__actor">A. Founder</span>
                <span className="verdict-strip__time">· 14 min ago</span>
                <span className="verdict-strip__note">— Good copy; ship.</span>
              </div>
            </div>

            <blockquote className="reasoning">
              <span className="reasoning__label">REASONING</span>
              <ol>
                <li>Heading promise matches the latest pricing offer.</li>
                <li>Sub-line acknowledges both CFO and frontline reader.</li>
              </ol>
            </blockquote>
          </div>
        </li>
      );
    }

    function VerdictRow() {
      return (
        <li className="row" data-component="CommentRow" data-variant="verdict" data-tier="2">
          <span className="row__avatar">A</span>
          <div className="row__body">
            <div className="row__header">
              <span className="row__sender">A. Founder</span>
              <span className="row__role">· CEO</span>
              <span className="row__time">14 min ago</span>
            </div>
            <div className="row__verdict">
              <span className="status-chip status-chip--done"><span className="dot" />APPROVED</span>
              <span className="row__verdict-note">— Good copy; ship.</span>
            </div>
          </div>
        </li>
      );
    }

    function App() {
      return (
        <div className="pane" data-component="ThreadShell" data-tier="3"
             data-uses="ThinHeader,ThreadHostBanner,CommentRow,AnchorFrame,AnchoredActionStrip,VerdictStrip,ArtifactView,Composer">
          <ThinHeader />
          <HostBanner />
          <ul className="stream">
            <PlainRow name="Maya" role="Product Manager"
              text="Heads-up — submitting the v2.4 staging deploy for review. Cost-cap headroom looks healthy."
              time="22 min ago" />
            <ResolvedReviewRow />
            <VerdictRow />
            <ReviewRow blocking={true} />
            <PlainRow name="Bob" role="Builder"
              text="Quick note: I had to bump the integration test timeout to 90s. Flake on the migration step otherwise."
              time="9 min ago" />
          </ul>
          <div className="composer" data-component="Composer" data-tier="2">
            <textarea className="composer__textarea" placeholder="Reply to thread…" defaultValue="" />
            <button type="button" className="composer__send">Send</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script src="../themes/_switcher.js"></script>
</body>
</html>
