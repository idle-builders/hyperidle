<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HyperIdle</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #333;
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 13px;
      opacity: 0.6;
    }
    .migration-status {
      display: none;
      font-size: 12px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="status" id="status-text">Starting...</div>
  <div class="migration-status" id="migration-status"></div>
  <script>
    window.updateStatus = (text) => {
      var el = document.getElementById('status-text');
      if (el) el.textContent = text;
    };
    window.showMigrationStatus = (text) => {
      var el = document.getElementById('migration-status');
      if (el) {
        el.style.display = 'block';
        el.textContent = text;
      }
    };
  </script>
</body>
</html>
