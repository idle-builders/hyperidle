<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HyperIdle — Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="work-styles.css" />
<link rel="stylesheet" href="knowledge-styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel" src="work-data.jsx"></script>
<script type="text/babel" src="work-views.jsx"></script>
<script type="text/babel" src="knowledge-data.jsx"></script>
<script type="text/babel" src="knowledge-views.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "ice",
  "density": "default",
  "railDefault": "collapsed"
}/*EDITMODE-END*/;

const ACCENTS = {
  ice:    { primary: '#adc6ff', dim: 'rgba(173,198,255,0.12)', hover: 'rgba(173,198,255,0.18)', shadow: 'rgba(173,198,255,0.08)' },
  sage:   { primary: '#bbffb3', dim: 'rgba(187,255,179,0.10)', hover: 'rgba(187,255,179,0.16)', shadow: 'rgba(187,255,179,0.08)' },
  ember:  { primary: '#ffb98a', dim: 'rgba(255,185,138,0.12)', hover: 'rgba(255,185,138,0.18)', shadow: 'rgba(255,185,138,0.08)' },
};

const DELIVERABLES = [
  { key: 'curated',   label: '01 · Curated · Building' },
  { key: 'triage',    label: '02 · Triage view' },
  { key: 'detail',    label: '03 · Knowledge detail' },
  { key: 'edit',      label: '04 · Edit mode' },
  { key: 'merge',     label: '05 · Merge modal' },
  { key: 'factory',   label: '06 · Factory scope' },
  { key: 'empty',     label: '07 · Empty topic' },
];

function App() {
  const [tab, setTab] = useState(localStorage.getItem('hi.kbtab') || 'curated');
  const [scope, setScope] = useState('practice');
  const [selectedTopic, setSelectedTopic] = useState('building');
  const [quickFilter, setQuickFilter] = useState(null);
  const [railExpanded, setRailExpanded] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAKS_DEFAULTS);
  const [editMode, setEditMode] = useState(false);
  const [mergeOpen, setMergeOpen] = useState(false);

  useEffect(() => { localStorage.setItem('hi.kbtab', tab); }, [tab]);

  // Sync scope/topic to deliverable tab
  useEffect(() => {
    if (tab === 'curated' || tab === 'triage') {
      setScope('practice'); setSelectedTopic('building'); setEditMode(false); setMergeOpen(false);
    } else if (tab === 'detail') {
      setScope('practice'); setSelectedTopic('caching'); setEditMode(false); setMergeOpen(false);
    } else if (tab === 'edit') {
      setScope('practice'); setSelectedTopic('caching'); setEditMode(true); setMergeOpen(false);
    } else if (tab === 'merge') {
      setScope('practice'); setSelectedTopic('caching'); setEditMode(false); setMergeOpen(true);
    } else if (tab === 'factory') {
      setScope('factory'); setSelectedTopic('principles'); setEditMode(false); setMergeOpen(false);
    } else if (tab === 'empty') {
      setScope('practice'); setSelectedTopic('api_shape'); setEditMode(false); setMergeOpen(false);
    }
  }, [tab]);

  useEffect(() => {
    const a = ACCENTS[tweaks.accent] || ACCENTS.ice;
    document.documentElement.style.setProperty('--primary', a.primary);
    document.documentElement.style.setProperty('--primary-dim', a.dim);
    document.documentElement.style.setProperty('--primary-hover', a.hover);
    document.documentElement.style.setProperty('--float', `0 0 32px ${a.shadow}`);
  }, [tweaks.accent]);

  useEffect(() => {
    const base = tweaks.density === 'compact' ? 13 : tweaks.density === 'comfy' ? 15 : 14;
    document.body.style.fontSize = base + 'px';
  }, [tweaks.density]);

  useEffect(() => { setRailExpanded(tweaks.railDefault === 'expanded'); }, [tweaks.railDefault]);

  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const renderMain = () => {
    if (tab === 'curated')
      return <KnowledgeListCurated onOpenDetail={() => setTab('detail')} />;
    if (tab === 'triage')
      return <KnowledgeListTriage onOpenDetail={() => setTab('detail')} />;
    if (tab === 'detail')
      return <KnowledgeDetail
        item={KB_DETAIL_ITEM}
        editMode={false}
        onBack={() => setTab('curated')}
        onToggleEdit={() => setTab('edit')}
        onOpenMerge={() => setTab('merge')}
      />;
    if (tab === 'edit')
      return <KnowledgeDetail
        item={KB_DETAIL_ITEM}
        editMode={true}
        onBack={() => setTab('curated')}
        onToggleEdit={() => setTab('detail')}
        onOpenMerge={() => setTab('merge')}
      />;
    if (tab === 'merge')
      return (
        <>
          <KnowledgeDetail
            item={KB_DETAIL_ITEM}
            editMode={false}
            onBack={() => setTab('curated')}
            onToggleEdit={() => setTab('edit')}
            onOpenMerge={() => setMergeOpen(true)}
          />
          <MergeModal item={KB_DETAIL_ITEM} onClose={() => setTab('detail')} />
        </>
      );
    if (tab === 'factory')
      return <FactoryScope onOpenDetail={() => {}} />;
    if (tab === 'empty')
      return <EmptyTopic topic="API shape" />;
    return null;
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
      <div className="topbar">
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, paddingRight: 8 }}>
          <div style={{ width: 20, height: 20, background: 'var(--primary)', borderRadius: 2, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--s0)', fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600 }}>HI</div>
          <span style={{ fontSize: 12, fontWeight: 600 }}>HyperIdle</span>
          <span className="mono-sm">/ KNOWLEDGE</span>
        </div>
        {DELIVERABLES.map(d => (
          <button key={d.key} className={`tabitem ${tab === d.key ? 'active' : ''}`} onClick={() => setTab(d.key)}>{d.label}</button>
        ))}
        <div className="topbar-divider" />
        <a href="HyperIdle.html" className="tabitem" style={{ textDecoration: 'none' }}>← System</a>
        <a href="Work.html" className="tabitem" style={{ textDecoration: 'none' }}>Work</a>
      </div>

      <div style={{ flex: 1, minHeight: 0, position: 'relative' }}>
        <div className="shell">
          <nav className="iconrail">
            <div className="rail-top">
              <a href="Conversations.html" className="iconrail-item" title="Conversations">
                <Icon name="conversations" size={20} />
              </a>
              <a href="Work.html" className="iconrail-item" title="Work">
                <Icon name="work" size={20} />
              </a>
              <button className="iconrail-item active" title="Knowledge">
                <Icon name="knowledge" size={20} />
              </button>
              <button className="iconrail-item" title="Settings">
                <Icon name="settings" size={20} />
              </button>
            </div>
            <div className="rail-bottom">
              <div className="iconrail-avatar" title="Max Addison">MA</div>
            </div>
          </nav>

          <aside className="submenu">
            <KnowledgeSubmenuV2
              scope={scope}
              setScope={(s) => { setScope(s); if (s === 'factory') setTab('factory'); else if (tab === 'factory') setTab('curated'); }}
              selectedTopic={selectedTopic}
              setSelectedTopic={setSelectedTopic}
              quickFilter={quickFilter}
              setQuickFilter={setQuickFilter}
            />
          </aside>

          <main className="main" style={{ overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
            {renderMain()}
          </main>

          <Rail expanded={railExpanded} setExpanded={setRailExpanded} />
        </div>

        <div className="rail-toggle">
          <button className={!railExpanded ? 'active' : ''} onClick={() => setRailExpanded(false)}>Rail · collapsed</button>
          <button className={railExpanded ? 'active' : ''} onClick={() => setRailExpanded(true)}>Rail · expanded</button>
        </div>

        <div className={`tweaks-panel ${tweaksOpen ? 'open' : ''}`}>
          <div className="tweaks-head">
            <span className="tweaks-title">Tweaks</span>
            <button className="btn-ghost" onClick={() => setTweaksOpen(false)}><Icon name="close" size={14} /></button>
          </div>
          <div className="tweak-row">
            <label>Density</label>
            <div className="tweak-opts">
              {['compact', 'default', 'comfy'].map(d => (
                <button key={d} className={tweaks.density === d ? 'active' : ''} onClick={() => setTweak('density', d)}>{d}</button>
              ))}
            </div>
          </div>
          <div className="tweak-row">
            <label>Primary accent</label>
            <div className="tweak-opts">
              {['ice', 'sage', 'ember'].map(a => (
                <button key={a} className={tweaks.accent === a ? 'active' : ''} onClick={() => setTweak('accent', a)}>{a}</button>
              ))}
            </div>
          </div>
          <div className="tweak-row">
            <label>Rail default</label>
            <div className="tweak-opts">
              {['collapsed', 'expanded'].map(r => (
                <button key={r} className={tweaks.railDefault === r ? 'active' : ''} onClick={() => setTweak('railDefault', r)}>{r}</button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
