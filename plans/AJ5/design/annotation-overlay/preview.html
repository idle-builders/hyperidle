<!doctype html>
<!--
  AJ5 annotation-overlay — design embodiment (looked-at artifact, NOT a regression baseline).
  Standalone static render of the "Review pill" overlay states over a sample story element,
  using the Hearth tokens from packages/design-system/src/tokens.css so the screenshot reads
  in the real palette. This file lives under plans/ and is never globbed by the snapshot net
  or the viewer story discovery — it is a critique convenience only.
  Open at: http://localhost:8098/../../plans/AJ5/design/annotation-overlay/preview.html is NOT
  routable; instead screenshot via the file:// path or the inline copy below.
-->
<html data-theme="hearth-light">
  <head>
    <meta charset="utf-8" />
    <title>AJ5 — annotation overlay preview</title>
    <style>
      /* ── Hearth tokens (mirrored from packages/design-system/src/tokens.css, light mode) ── */
      :root {
        --r-subtle: 10px; --r-pill: 9999px;
        --motion-fast: 120ms; --motion-ease: cubic-bezier(0.25,0.1,0.25,1);
        --font-sans: system-ui,-apple-system,"Segoe UI",sans-serif;
        --font-mono: ui-monospace,"SF Mono","Cascadia Code",monospace;
        --tracking-caps-sm: 0.06em;
        --space-1:3px;--space-2:6px;--space-4:12px;
        --bw-thin:1px;--bw-default:1.5px;
        --surface-page:#f5f0e6;--surface-container:#ede7db;--surface-elevated:#ffffff;
        --text-primary:#2c241a;--text-secondary:#6b5d4d;--text-tertiary:#9a8d7e;--text-placeholder:#bfb5a5;
        --accent-primary:#16764f;--accent-primary-dim:rgba(22,118,79,0.08);
        --border-default:#d5cbb8;--border-subtle:#e8e0d0;
        --shadow-elevated:0 8px 24px rgba(44,36,26,0.1);
        --status-error:#dc4a3a;
      }
      *{box-sizing:border-box;margin:0;padding:0;}
      body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;}
      button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;}

      /* ── Sample story content (stand-in for a rendered variant) ── */
      .demo{max-width:1024px;margin:0 auto;padding:24px;}
      .demo-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;color:var(--text-tertiary);padding-bottom:8px;border-bottom:1px solid var(--border-default);margin-bottom:12px;}
      .demo-row{display:flex;gap:12px;align-items:center;}
      .btn{border-radius:var(--r-pill);padding:10px 16px;font-size:13px;font-weight:500;}
      .btn--primary{background:var(--accent-primary);color:#fff;}
      .btn--secondary{background:var(--surface-container);color:var(--text-primary);border:1px solid var(--border-default);}
      .btn--disabled{background:var(--surface-container);color:var(--text-placeholder);}

      /* ── annotation outlines (.anno-hover / selected / saved) ── */
      .anno-selected{outline:var(--bw-default) solid var(--accent-primary);outline-offset:2px;}
      .anno-saved{outline:var(--bw-thin) solid var(--accent-primary);outline-offset:2px;}

      /* ── review pill (sibling of .toolbar-pill, opposite corner) ── */
      .anno-pill{position:fixed;left:8px;bottom:8px;z-index:99998;display:flex;gap:4px;align-items:center;
        padding:4px;background:var(--surface-elevated);border:1px solid var(--border-default);border-radius:8px;
        font-family:var(--font-sans);font-size:11px;box-shadow:var(--shadow-elevated);}
      .toolbar-btn{padding:4px 10px;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;background:transparent;color:var(--text-secondary);transition:background 80ms;}
      .toolbar-btn--active{background:var(--accent-primary-dim);color:var(--accent-primary);}
      .toolbar-btn:disabled{color:var(--text-placeholder);cursor:default;}
      .anno-round{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);letter-spacing:var(--tracking-caps-sm);text-transform:uppercase;padding:0 6px;}
      .anno-count{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);padding:4px 8px;border-radius:6px;}
      .anno-count:hover{background:var(--accent-primary-dim);}
      .anno-divider{width:1px;align-self:stretch;background:var(--border-subtle);margin:2px 2px;}

      /* ── note popover (fixed above the pill) ── */
      .anno-popover{position:fixed;left:8px;bottom:48px;z-index:99999;width:320px;
        background:var(--surface-elevated);border:1px solid var(--border-default);border-radius:var(--r-subtle);
        box-shadow:var(--shadow-elevated);padding:12px;display:flex;flex-direction:column;gap:9px;
        font-family:var(--font-sans);}
      .anno-target{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .anno-target b{color:var(--text-secondary);font-weight:600;}
      .anno-popover textarea{width:100%;min-height:64px;resize:vertical;background:var(--surface-page);
        border:1px solid var(--border-default);border-radius:var(--r-subtle);color:var(--text-primary);
        font-family:var(--font-sans);font-size:13px;padding:8px;}
      .anno-popover textarea::placeholder{color:var(--text-placeholder);}
      .anno-actions{display:flex;gap:6px;justify-content:flex-end;}
      .anno-save{background:var(--accent-primary);color:#fff;padding:4px 14px;border-radius:var(--r-pill);}
      .anno-cancel{padding:4px 12px;border-radius:var(--r-pill);}
    </style>
  </head>
  <body>
    <div class="demo">
      <div class="demo-title">Button — All Variants</div>
      <div class="demo-row">
        <button class="btn btn--primary anno-saved">Save changes</button>
        <button class="btn btn--secondary">Cancel</button>
        <button class="btn btn--disabled anno-selected">Save</button>
      </div>
    </div>

    <!-- popover open over the selected element -->
    <div class="anno-popover">
      <div class="anno-target" title='Button · button.btn--disabled "Save"'><b>Button</b> · button.btn--disabled "Save"</div>
      <textarea placeholder="What should change about this element?">radius too tight on the disabled state — match the others</textarea>
      <div class="anno-actions">
        <button class="toolbar-btn anno-cancel">Cancel</button>
        <button class="anno-save">Save</button>
      </div>
    </div>

    <!-- review pill, armed, round 2 with 3 notes -->
    <div class="anno-pill">
      <button class="toolbar-btn toolbar-btn--active anno-arm">Selecting…</button>
      <div class="anno-divider"></div>
      <span class="anno-round">Round 2</span>
      <button class="anno-count">3 notes</button>
      <div class="anno-divider"></div>
      <button class="toolbar-btn anno-iterate">New iteration</button>
    </div>
  </body>
</html>
