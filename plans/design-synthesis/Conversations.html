<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HyperIdle — Conversations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel" src="conversations.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "default",
  "accent": "ice"
}/*EDITMODE-END*/;

const ACCENTS = {
  ice:    { primary: '#adc6ff', dim: 'rgba(173,198,255,0.12)', hover: 'rgba(173,198,255,0.18)', shadow: 'rgba(173,198,255,0.08)' },
  sage:   { primary: '#bbffb3', dim: 'rgba(187,255,179,0.10)', hover: 'rgba(187,255,179,0.16)', shadow: 'rgba(187,255,179,0.08)' },
  ember:  { primary: '#ffb98a', dim: 'rgba(255,185,138,0.12)', hover: 'rgba(255,185,138,0.18)', shadow: 'rgba(255,185,138,0.08)' },
};

// Selected thread per deliverable
const DELIVERABLES = [
  { key: 'full',          label: '01 · Full view',        selectedId: 'r1',  variant: 'data_metrics' },
  { key: 'text_diff',     label: '02 · text_diff',        selectedId: 'r5',  variant: 'text_diff' },
  { key: 'content',       label: '03 · content_preview',  selectedId: 'r3',  variant: 'content_preview' },
  { key: 'action',        label: '04 · action_summary',   selectedId: 'r2',  variant: 'action_summary' },
  { key: 'metrics',       label: '05 · data_metrics',     selectedId: 'r1',  variant: 'data_metrics' },
  { key: 'visual',        label: '06 · visual_compare',   selectedId: 'r4',  variant: 'visual_comparison' },
  { key: 'chat',          label: '07 · Chat (CoS)',       selectedId: 'cos', variant: null },
  { key: 'empty',         label: '08 · Empty state',      selectedId: null,  variant: null },
];

function AppShell({ children, selectedThreadId, railExpanded, setRailExpanded }) {
  return (
    <div className="shell">
      <nav className="iconrail">
        <div className="rail-top">
          <button className="iconrail-item active" title="Conversations">
            <Icon name="conversations" size={20} />
          </button>
          <button className="iconrail-item" title="Work">
            <Icon name="work" size={20} />
          </button>
          <button className="iconrail-item" title="Knowledge">
            <Icon name="knowledge" size={20} />
          </button>
          <button className="iconrail-item" title="Settings">
            <Icon name="settings" size={20} />
          </button>
        </div>
        <div className="rail-bottom">
          <div className="iconrail-avatar" title="Max">MA</div>
        </div>
      </nav>
      <aside className="submenu">
        <ConversationsSubmenuV2 selectedId={selectedThreadId} onSelect={() => {}} />
      </aside>
      {children}
      <Rail expanded={railExpanded} setExpanded={setRailExpanded} />
    </div>
  );
}

function App() {
  const [deliverable, setDeliverable] = useState(localStorage.getItem('hi2.deliverable') || 'full');
  const [railExpanded, setRailExpanded] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAKS_DEFAULTS);

  useEffect(() => { localStorage.setItem('hi2.deliverable', deliverable); }, [deliverable]);

  useEffect(() => {
    const a = ACCENTS[tweaks.accent] || ACCENTS.ice;
    document.documentElement.style.setProperty('--primary', a.primary);
    document.documentElement.style.setProperty('--primary-dim', a.dim);
    document.documentElement.style.setProperty('--primary-hover', a.hover);
    document.documentElement.style.setProperty('--float', `0 0 32px ${a.shadow}`);
  }, [tweaks.accent]);

  useEffect(() => {
    const base = tweaks.density === 'compact' ? 13 : tweaks.density === 'comfy' ? 15 : 14;
    document.body.style.fontSize = base + 'px';
  }, [tweaks.density]);

  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const d = DELIVERABLES.find(x => x.key === deliverable) || DELIVERABLES[0];

  let mainPane;
  if (d.key === 'empty') {
    mainPane = <EmptyConversationsMain />;
  } else if (d.variant) {
    mainPane = <ReviewThreadDetail variant={d.variant} />;
  } else {
    mainPane = <ChatThreadDetail />;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
      <div className="topbar">
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, paddingRight: 8 }}>
          <div style={{ width: 20, height: 20, background: 'var(--primary)', borderRadius: 2, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--s0)', fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600 }}>HI</div>
          <span style={{ fontSize: 12, fontWeight: 600 }}>HyperIdle</span>
          <span className="mono-sm">/ CONVERSATIONS</span>
        </div>
        {DELIVERABLES.map(x => (
          <button key={x.key} className={`tabitem ${deliverable === x.key ? 'active' : ''}`} onClick={() => setDeliverable(x.key)}>{x.label}</button>
        ))}
        <div className="topbar-divider" />
        <span className="mono-sm" style={{ paddingRight: 8 }}>REVIEW THREADS · v0.5</span>
      </div>

      <div style={{ flex: 1, minHeight: 0, position: 'relative' }}>
        <AppShell selectedThreadId={d.selectedId} railExpanded={railExpanded} setRailExpanded={setRailExpanded}>
          {mainPane}
        </AppShell>

        <div className="shortcut-hint">
          <span>Verdict</span>
          <span className="kbd">A</span>
          <span className="kbd">R</span>
          <span className="kbd">X</span>
          <span style={{ color: 'var(--t-low)' }}>·</span>
          <span>Snooze</span>
          <span className="kbd">S</span>
          <span style={{ color: 'var(--t-low)' }}>·</span>
          <span>Rail</span>
          <span className="kbd">⌘J</span>
        </div>

        <div className={`tweaks-panel ${tweaksOpen ? 'open' : ''}`}>
          <div className="tweaks-head">
            <span className="tweaks-title">Tweaks</span>
            <button className="btn-ghost" onClick={() => setTweaksOpen(false)}><Icon name="close" size={14} /></button>
          </div>
          <div className="tweak-row">
            <label>Density</label>
            <div className="tweak-opts">
              {['compact','default','comfy'].map(x => <button key={x} className={tweaks.density===x?'active':''} onClick={()=>setTweak('density',x)}>{x}</button>)}
            </div>
          </div>
          <div className="tweak-row">
            <label>Primary accent</label>
            <div className="tweak-opts">
              {['ice','sage','ember'].map(x => <button key={x} className={tweaks.accent===x?'active':''} onClick={()=>setTweak('accent',x)}>{x}</button>)}
            </div>
          </div>
          <div className="tweak-row">
            <label>Rail</label>
            <div className="tweak-opts">
              <button className={!railExpanded?'active':''} onClick={()=>setRailExpanded(false)}>collapsed</button>
              <button className={railExpanded?'active':''} onClick={()=>setRailExpanded(true)}>expanded</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
