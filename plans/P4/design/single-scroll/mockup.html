<!DOCTYPE html>
<html lang="en" data-theme="lucid-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P4 Variant A — Single Scroll</title>
<link rel="stylesheet" href="../../../../packages/design-system/src/tokens.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--ui);
    background: var(--surface-0);
    color: var(--text-mid);
    font-size: 15px;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 8vh;
  }
  .page { width: 100%; max-width: 480px; padding: 0 var(--density-page-gutter); }
  .page-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-lo);
    margin-bottom: 32px;
  }
  .section { margin-bottom: 28px; }
  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-lo);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 16px;
  }
  .field { margin-bottom: 12px; }
  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-mid);
    margin-bottom: 4px;
  }
  .field-input {
    width: 100%;
    height: 32px;
    padding: 0 12px;
    background: var(--surface-2);
    border: 1px solid var(--border-default);
    border-radius: var(--r1);
    color: var(--text-hi);
    font-family: var(--ui);
    font-size: 14px;
    outline: none;
  }
  .field-input:focus { border-color: var(--primary); }
  .field-input::placeholder { color: var(--text-lo); }
  .field-hint {
    font-size: 12px;
    color: var(--text-lo);
    margin-top: 4px;
  }
  .radio-group { display: flex; flex-direction: column; gap: 8px; }
  .radio-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-hi);
  }
  .radio-item input[type="radio"] {
    appearance: none;
    width: 14px; height: 14px;
    border: 1px solid var(--border-emphasis);
    border-radius: 50%;
    background: var(--surface-2);
    cursor: pointer;
    position: relative;
  }
  .radio-item input[type="radio"]:checked {
    border-color: var(--primary);
    background: var(--primary);
  }
  .radio-item input[type="radio"]:checked::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--surface-0);
  }
  .radio-hint { font-size: 12px; color: var(--text-lo); margin-left: 22px; margin-top: -4px; }
  .shared-fields {
    margin-left: 22px;
    margin-top: 8px;
    padding: 12px;
    background: var(--surface-1);
    border-radius: var(--r2);
    border: 1px solid var(--border-subtle);
  }
  .inline-row { display: flex; gap: 8px; align-items: center; }
  .btn-ghost {
    height: 28px;
    padding: 0 10px;
    background: transparent;
    border: 1px solid var(--border-default);
    border-radius: var(--r1);
    color: var(--text-mid);
    font-family: var(--ui);
    font-size: 12px;
    cursor: pointer;
  }
  .btn-ghost:hover { background: var(--surface-ghost); }
  .btn-primary {
    height: 32px;
    padding: 0 16px;
    background: var(--primary);
    border: none;
    border-radius: var(--r1);
    color: var(--surface-0);
    font-family: var(--ui);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
  }
  .cred-hint {
    font-size: 13px;
    color: var(--text-mid);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .skip-btn {
    height: 28px;
    padding: 0 10px;
    background: transparent;
    border: none;
    color: var(--text-mid);
    font-family: var(--ui);
    font-size: 12px;
    cursor: pointer;
  }
  .skip-btn:hover { color: var(--text-hi); }
  .repo-row { display: flex; gap: 4px; align-items: center; }
  .folder-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2);
    border: 1px solid var(--border-default);
    border-radius: var(--r1);
    color: var(--text-lo);
    cursor: pointer;
    flex-shrink: 0;
  }
  .folder-btn:hover { color: var(--text-mid); border-color: var(--border-emphasis); }
</style>
</head>
<body>

<div class="page">
  <div class="page-title">Configure HyperIdle</div>

  <!-- Section 1: Backend -->
  <div class="section">
    <div class="section-label">Backend</div>
    <div class="radio-group">
      <label class="radio-item">
        <input type="radio" name="backend" checked>
        Run locally
      </label>
      <div class="radio-hint">Embedded server, no external setup required</div>
      <label class="radio-item">
        <input type="radio" name="backend">
        Connect to shared backend
      </label>
    </div>
  </div>

  <!-- Section 2: Identity -->
  <div class="section">
    <div class="section-label">Identity</div>
    <div class="field">
      <label class="field-label">Name</label>
      <input class="field-input" type="text" value="Tobias Grund" placeholder="Your name">
    </div>
    <div class="field">
      <label class="field-label">Email</label>
      <input class="field-input" type="email" value="grundtob@gmail.com" placeholder="you@example.com">
    </div>
  </div>

  <!-- Section 3: First Product -->
  <div class="section">
    <div class="section-label">First Product</div>
    <div class="field">
      <label class="field-label">Product name</label>
      <input class="field-input" type="text" value="HyperIdle" placeholder="My App">
    </div>
    <div class="field">
      <label class="field-label">Repository path</label>
      <div class="repo-row">
        <button class="folder-btn" aria-label="Browse">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
        <input class="field-input" type="text" value="/Users/tg/hyperidle" placeholder="/path/to/repo">
      </div>
      <div class="field-hint">Local path to the git repository (optional)</div>
    </div>
  </div>

  <!-- Section 4: Credentials (optional) -->
  <div class="section">
    <div class="section-label">Credentials (optional)</div>
    <div class="cred-hint">Add your Anthropic API key so agents can start working. You can do this later in Settings.</div>
    <div class="field">
      <label class="field-label">Anthropic API Key</label>
      <input class="field-input" type="password" placeholder="sk-ant-...">
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="skip-btn">Skip credentials</button>
    <button class="btn-primary">Start HyperIdle</button>
  </div>
</div>

</body>
</html>
