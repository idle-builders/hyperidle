<!DOCTYPE html>
<html lang="en" data-theme="lucid-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P4 Variant B — Split Pane Overlay (Settings)</title>
<link rel="stylesheet" href="../../../../packages/design-system/src/tokens.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--ui);
    background: var(--surface-0);
    color: var(--text-mid);
    font-size: 15px;
    line-height: 1.55;
    height: 100vh;
    overflow: hidden;
  }

  /* Shell layout: IconRail | Submenu (Settings) | Main (Settings content) | Rail */
  .shell { display: flex; height: 100vh; }

  /* IconRail */
  .icon-rail {
    width: 48px;
    background: var(--surface-1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 4px;
    flex-shrink: 0;
    border-right: 1px solid var(--border-subtle);
  }
  .rail-icon {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r1);
    color: var(--text-lo);
    cursor: pointer;
    position: relative;
  }
  .rail-icon:hover { color: var(--text-mid); background: var(--surface-ghost); }
  .rail-icon.active { color: var(--text-hi); }
  .rail-icon.active::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 8px;
    width: 2px;
    height: 20px;
    background: var(--primary);
    border-radius: var(--r-pill);
  }
  .rail-spacer { flex: 1; }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface-4);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-hi);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid var(--primary);
  }

  /* Submenu — shows Settings sections */
  .submenu {
    width: 240px;
    background: var(--surface-2);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .submenu-header {
    padding: 12px 16px 8px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-lo);
  }
  .submenu-nav { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px; flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    height: 32px;
    padding: 0 8px;
    border-radius: var(--r1);
    font-size: 14px;
    color: var(--text-mid);
    cursor: pointer;
    text-decoration: none;
    position: relative;
  }
  .nav-item:hover { background: var(--surface-ghost); color: var(--text-hi); }
  .nav-item.active {
    background: var(--surface-4);
    color: var(--text-hi);
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    width: 2px;
    height: 20px;
    background: var(--primary);
    border-radius: var(--r-pill);
  }
  .submenu-footer { padding: 8px 16px 12px; }
  .back-btn {
    background: none;
    border: none;
    color: var(--text-lo);
    font-family: var(--ui);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 0;
  }
  .back-btn:hover { color: var(--text-mid); }

  /* Main — Settings content */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: var(--density-page-gutter);
    background: var(--surface-3);
  }
  .main-inner { max-width: 560px; }

  .section-heading {
    font-size: var(--density-text-h2);
    font-weight: 500;
    color: var(--text-hi);
    margin-bottom: 20px;
  }

  .field { margin-bottom: 16px; }
  .field-label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-lo);
    margin-bottom: 4px;
  }
  .field-input {
    width: 100%;
    height: 32px;
    padding: 0 12px;
    background: var(--surface-2);
    border: 1px solid var(--border-default);
    border-radius: var(--r1);
    color: var(--text-hi);
    font-family: var(--ui);
    font-size: 14px;
    outline: none;
  }
  .field-input:focus { border-color: var(--primary); }
  .field-input::placeholder { color: var(--text-lo); }

  .save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .btn-primary {
    height: 28px;
    padding: 0 12px;
    background: var(--primary);
    border: none;
    border-radius: var(--r1);
    color: var(--surface-0);
    font-family: var(--ui);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.9; }

  /* Edge table (OrgChart section shown as secondary view below Profile) */
  .edge-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .edge-table th {
    text-align: left;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-lo);
    padding: 4px 8px 8px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .edge-table td {
    padding: 8px 8px 8px 0;
    color: var(--text-hi);
    border-bottom: 1px solid var(--border-subtle);
    font-variant-numeric: tabular-nums;
  }
  .edge-table td:last-child { text-align: right; padding-right: 0; }
  .delete-btn {
    background: none;
    border: none;
    color: var(--text-lo);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: var(--r1);
  }
  .delete-btn:hover { color: var(--danger); background: var(--surface-ghost); }
  .add-edge-btn {
    background: none;
    border: 1px solid var(--border-default);
    border-radius: var(--r1);
    color: var(--text-mid);
    font-family: var(--ui);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    margin-top: 8px;
  }
  .add-edge-btn:hover { background: var(--surface-ghost); color: var(--text-hi); }

  /* Rail (dimmed) */
  .rail {
    width: 56px;
    background: var(--surface-1);
    border-left: 1px solid var(--border-subtle);
    opacity: 0.4;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 12px;
    flex-shrink: 0;
  }
  .rail-badge {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r1);
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text-lo);
  }

  /* Notification toggles */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    padding: 0;
  }
  .toggle-label { font-size: 14px; color: var(--text-hi); }
  .toggle {
    width: 36px; height: 20px;
    border-radius: var(--r-pill);
    background: var(--surface-5);
    position: relative;
    cursor: pointer;
    border: none;
  }
  .toggle.on { background: var(--primary); }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: white;
    transition: transform var(--motion-fast);
  }
  .toggle.on::after { transform: translateX(16px); }

  .divider {
    border: none;
    border-top: 1px solid var(--border-subtle);
    margin: 16px 0;
  }
  .divider-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-lo);
    margin-bottom: 12px;
  }

  .select-input {
    width: 100%;
    height: 32px;
    padding: 0 12px;
    background: var(--surface-2);
    border: 1px solid var(--border-default);
    border-radius: var(--r1);
    color: var(--text-hi);
    font-family: var(--ui);
    font-size: 14px;
    outline: none;
    appearance: none;
  }
</style>
</head>
<body>

<div class="shell">
  <!-- IconRail -->
  <div class="icon-rail">
    <div class="rail-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="rail-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    </div>
    <div class="rail-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </div>
    <div class="rail-spacer"></div>
    <div class="avatar" title="Settings open">TG</div>
  </div>

  <!-- Submenu: Settings sections -->
  <div class="submenu">
    <div class="submenu-header">Settings</div>
    <nav class="submenu-nav">
      <a class="nav-item active">Profile</a>
      <a class="nav-item">Org Chart</a>
      <a class="nav-item">Credentials</a>
      <a class="nav-item">Notifications</a>
      <a class="nav-item">Appearance</a>
      <a class="nav-item">Products</a>
      <a class="nav-item">Backend</a>
    </nav>
    <div class="submenu-footer">
      <button class="back-btn">&larr; Back to Conversations</button>
    </div>
  </div>

  <!-- Main: Profile section -->
  <div class="main">
    <div class="main-inner">
      <h2 class="section-heading">Profile</h2>

      <div class="field">
        <label class="field-label">Name</label>
        <input class="field-input" type="text" value="Tobias Grund">
      </div>

      <div class="field">
        <label class="field-label">Email</label>
        <input class="field-input" type="email" value="grundtob@gmail.com">
      </div>

      <div class="save-row">
        <button class="btn-primary">Save Profile</button>
      </div>
    </div>
  </div>

  <!-- Rail (dimmed) -->
  <div class="rail">
    <div class="rail-badge">0</div>
    <div class="rail-badge">$0</div>
  </div>
</div>

</body>
</html>
