<!DOCTYPE html>
<html lang="en" data-theme="hearth-light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>U6 Variant A — Minimal Scaffold</title>
<link rel="stylesheet" href="../../../../packages/design-system/src/tokens.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--surface-page);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 200px;
    min-width: 200px;
    height: 100vh;
    background: var(--surface-container);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-subtle);
    overflow-y: auto;
  }

  /* Brand */
  .brand {
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: var(--fw-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-caps);
    color: var(--text-tertiary);
  }

  /* Section */
  .section {
    display: flex;
    flex-direction: column;
  }
  .section + .section {
    border-top: 1px solid var(--border-subtle);
  }
  .section-label {
    padding: 8px 16px 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: var(--fw-medium);
    text-transform: uppercase;
    letter-spacing: var(--tracking-caps);
    color: var(--text-tertiary);
  }

  /* Nav item (primary) */
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    min-height: 36px;
    font-size: 14px;
    font-weight: var(--fw-medium);
    color: var(--text-secondary);
    border: none;
    background: none;
    cursor: pointer;
    width: 100%;
    text-align: left;
    border-radius: var(--r-subtle);
    border-left: 2px solid transparent;
    transition: background var(--motion-fast) var(--motion-ease);
  }
  .nav-item:hover {
    background: var(--accent-primary-dim);
  }
  .nav-item.active {
    background: var(--surface-elevated);
    color: var(--text-primary);
    font-weight: var(--fw-semibold);
    border-left-color: var(--accent-primary);
  }
  .nav-item .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--text-tertiary);
  }
  .nav-item.active .icon {
    color: var(--accent-primary);
  }
  .nav-item .count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: var(--fw-medium);
    color: var(--text-tertiary);
    background: color-mix(in oklab, var(--text-secondary) 8%, transparent);
    padding: 1px 6px;
    border-radius: var(--r-pill);
    min-width: 18px;
    text-align: center;
  }

  /* Sub-item (indented, no icon) */
  .sub-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 16px 4px 40px;
    min-height: 28px;
    font-size: 13px;
    color: var(--text-secondary);
    border: none;
    background: none;
    cursor: pointer;
    width: 100%;
    text-align: left;
    border-radius: var(--r-subtle);
    transition: background var(--motion-fast) var(--motion-ease);
    overflow: hidden;
  }
  .sub-item:hover {
    background: var(--accent-primary-dim);
  }
  .sub-item.active {
    background: var(--surface-elevated);
    box-shadow: var(--shadow-subtle);
    color: var(--text-primary);
    font-weight: var(--fw-medium);
  }
  .sub-item .label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .sub-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-warning { background: var(--status-warning); }
  .dot-error { background: var(--status-error); }
  .dot-success { background: var(--status-success); }

  /* Bottom area */
  .bottom {
    margin-top: auto;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
  }

  /* Main */
  .main {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
  }
  .main-header {
    font-size: 20px;
    font-weight: var(--fw-semibold);
    color: var(--text-primary);
    margin-bottom: 12px;
  }
  .pill-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .pill {
    padding: 4px 12px;
    font-size: 13px;
    font-weight: var(--fw-medium);
    border-radius: var(--r-pill);
    border: 1px solid var(--border-default);
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background var(--motion-fast) var(--motion-ease);
  }
  .pill:hover { background: var(--accent-primary-dim); }
  .pill.active {
    background: var(--surface-elevated);
    border-color: var(--border-strong);
    color: var(--text-primary);
    font-weight: var(--fw-semibold);
    box-shadow: var(--shadow-subtle);
  }
  .content-placeholder {
    color: var(--text-tertiary);
    font-size: 14px;
    line-height: var(--leading-normal);
  }
</style>
</head>
<body>
  <nav class="sidebar" aria-label="Main navigation">
    <div class="brand">HyperIdle</div>

    <!-- Conversations section -->
    <div class="section">
      <div class="section-label">Conversations</div>
      <button class="nav-item active">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12a1 1 0 011 1v8a1 1 0 01-1 1H6l-3 3v-3H2a1 1 0 01-1-1V3a1 1 0 011-1z"/></svg>
        <span>All Conversations</span>
        <span class="count">12</span>
      </button>
      <button class="sub-item active">
        <span class="dot dot-error"></span>
        <span class="label">Review: Agent refactoring PR</span>
      </button>
      <button class="sub-item">
        <span class="dot dot-warning"></span>
        <span class="label">Deploy pipeline stuck on staging</span>
      </button>
      <button class="sub-item">
        <span class="label">Weekly planning with Aria</span>
      </button>
      <button class="sub-item">
        <span class="label">Knowledge indexing progress</span>
      </button>
      <button class="sub-item">
        <span class="label">Cost optimization discussion</span>
      </button>
    </div>

    <!-- Work section -->
    <div class="section">
      <div class="section-label">Work</div>
      <button class="nav-item">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor"><path d="M6 1v2H2a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1V4a1 1 0 00-1-1h-4V1H6zm0 2h4v1H6V3z"/></svg>
        <span>Portfolio</span>
        <span class="count">3</span>
      </button>
      <button class="sub-item">
        <span class="label">Platform</span>
      </button>
      <button class="sub-item">
        <span class="label">Growth</span>
      </button>
      <button class="sub-item">
        <span class="label">Infrastructure</span>
      </button>
    </div>

    <!-- Knowledge section -->
    <div class="section">
      <div class="section-label">Knowledge</div>
      <button class="nav-item">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1h5a2 2 0 012 2v11l-2.5-1.5L4 14V3a2 2 0 00-2-2zm12 0H9a2 2 0 00-2 2v11l2.5-1.5L12 14V3a2 2 0 012-2z"/></svg>
        <span>All Knowledge</span>
      </button>
      <button class="sub-item">
        <span class="dot dot-success"></span>
        <span class="label">Practices</span>
      </button>
      <button class="sub-item">
        <span class="dot dot-warning"></span>
        <span class="label">Teams</span>
      </button>
    </div>

    <!-- Bottom: Settings + CoC -->
    <div class="bottom">
      <button class="nav-item">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 3.5H2.5A1 1 0 001.5 4.5v6A1 1 0 002.5 11.5h2l2 2 2-2h4.5a1 1 0 001-1v-6a1 1 0 00-1-1z"/></svg>
        <span>Chief of Staff</span>
      </button>
      <button class="nav-item">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a1 1 0 01.993.883L9 1v.5a5.002 5.002 0 013.5 3.5h.5a1 1 0 010 2H12.5a5 5 0 01-3.5 3.5V11a1 1 0 01-2 0v-.5A5 5 0 013.5 7H3a1 1 0 010-2h.5A5 5 0 017 1.5V1a1 1 0 011-1zM8 4a3 3 0 100 6 3 3 0 000-6z"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <main class="main">
    <h1 class="main-header">Conversations</h1>
    <div class="pill-bar">
      <button class="pill active">All</button>
      <button class="pill">Blocking</button>
      <button class="pill">Async</button>
    </div>
    <div class="content-placeholder">
      Thread list renders here. Filters moved from sidebar to this pill bar in the main pane header.
    </div>
  </main>
</body>
</html>
