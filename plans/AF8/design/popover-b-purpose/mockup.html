<!doctype html>
<html data-theme="hearth-dark">
<head>
<meta charset="utf-8" />
<style>
  :root{
    --r-subtle:10px; --r-pill:9999px; --motion-fast:120ms;
    --tracking-caps-sm:.06em;
    --surface-container:#231e16; --surface-elevated:#2c261c; --surface-overlay:#352e23;
    --accent-primary:#2eaa7a; --status-error:#dc4a3a;
    --text-primary:#ede5d8; --text-secondary:#a89880; --text-tertiary:#9a8e7e;
    --border-subtle:#3d342a; --border-default:#554a3c; --border-strong:#756850;
    --shadow-elevated:0 8px 24px rgba(0,0,0,.5);
    --font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code",monospace;
  }
  body{background:var(--surface-container);margin:0;font-family:var(--font-sans);height:100vh;display:flex;align-items:flex-end;padding:16px;}
  .popover{width:360px;max-height:70vh;display:flex;flex-direction:column;overflow:hidden;
    border-radius:var(--r-subtle);border:1px solid var(--border-default);background:var(--surface-overlay);box-shadow:var(--shadow-elevated);}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border-subtle);}
  .hdr h2{font-size:15px;font-weight:600;color:var(--text-primary);margin:0;}
  .x{width:24px;height:24px;border:none;background:none;color:var(--text-secondary);cursor:pointer;}
  .list{overflow-y:auto;padding:3px;}
  .row{display:flex;align-items:center;gap:9px;min-height:36px;padding:9px 12px;border-radius:var(--r-subtle);transition:background var(--motion-fast);cursor:pointer;}
  .row:hover{background:color-mix(in oklab,var(--accent-primary) 4%,var(--surface-elevated));}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .dot.imm{background:var(--status-error);}
  .dot.amb{background:var(--border-strong);}
  .title{flex:1;font-size:15px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .type{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:var(--tracking-caps-sm);color:var(--text-tertiary);}
  .time{font-size:12px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .acts{display:flex;gap:6px;opacity:0;transition:opacity var(--motion-fast);}
  .row:hover .acts{opacity:1;}
  .acts button{width:16px;height:16px;border:none;background:none;color:var(--text-tertiary);cursor:pointer;padding:0;line-height:1;}
  .acts button:hover{color:var(--text-secondary);}
  .sec-label{padding:6px 12px 3px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:var(--tracking-caps-sm);color:var(--text-tertiary);}
</style>
</head>
<body>
  <div class="popover">
    <div class="hdr"><h2>Notifications</h2><button class="x">✕</button></div>
    <div class="list">
      <div class="row">
        <span class="dot imm"></span>
        <span class="title">Review needed: pricing-page copy v3</span>
        <span class="type">REVIEW</span><span class="time">4m</span>
        <span class="acts"><button title="Mute REVIEW">⊘</button><button title="Dismiss">✕</button></span>
      </div>
      <div class="row">
        <span class="dot imm"></span>
        <span class="title">Factory spend hit 100% of cap</span>
        <span class="type">COST</span><span class="time">1h</span>
        <span class="acts"><button title="Mute COST">⊘</button><button title="Dismiss">✕</button></span>
      </div>
      <div class="row">
        <span class="dot imm"></span>
        <span class="title">Agent Wren blocked on auth-service task</span>
        <span class="type">BLOCKER</span><span class="time">2h</span>
        <span class="acts"><button title="Mute BLOCKER">⊘</button><button title="Dismiss">✕</button></span>
      </div>
      <div class="row">
        <span class="dot amb"></span>
        <span class="title">Review needed: onboarding email draft</span>
        <span class="type">REVIEW</span><span class="time">yest</span>
        <span class="acts"><button title="Mute REVIEW">⊘</button><button title="Dismiss">✕</button></span>
      </div>
      <div class="row">
        <span class="dot amb"></span>
        <span class="title">Review needed: changelog entry for v2.4</span>
        <span class="type">REVIEW</span><span class="time">yest</span>
        <span class="acts"><button title="Mute REVIEW">⊘</button><button title="Dismiss">✕</button></span>
      </div>
    </div>
  </div>
</body>
</html>
