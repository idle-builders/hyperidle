# HyperIdle shared backend — Helm chart defaults. A deployment supplies its own
# values (image tag, host, sign-in) from wherever it keeps its deployment.
# The namespace must provide the secrets `database-url` (key DATABASE_URL) and
# `app-secrets` (key HYPERIDLE_API_KEY).

replicaCount: 1

image:
  # Published for every commit on main by .github/workflows/server-image.yml.
  repository: ghcr.io/idle-builders/hyperidle-server
  # The commit SHA to run. Required: an image is never "latest".
  tag: ""
  pullPolicy: IfNotPresent

# Only for a private image registry.
imagePullSecrets: []

database:
  # A secret holding `ca.crt`, for a database whose certificate a private CA
  # signed. Empty → the system's trusted CAs.
  caSecret: ""

service:
  port: 3001

ingress:
  # No TLS block: HTTPS ends at the edge in front of the cluster (e.g. a
  # Cloudflare Tunnel). The host must be one the namespace may claim.
  enabled: false
  host: ""
  rateLimit: 20

# Where people sign in to join — any OpenID Connect provider — and the desktop
# app's client id there. Empty → nobody can join this backend.
signIn:
  issuer: ""
  clientId: ""

# Drizzle table migrations run as an init-container on every deploy (additive
# only — old pods keep serving during rollout). drizzle-kit reads DATABASE_URL
# and applies framework/db/drizzle/*.sql against the tenant schema.
migration:
  enabled: true
  # Custom runner (not drizzle-kit) — the schema-scoped tenant role can't
  # CREATE SCHEMA, so the tracking table is created in the search_path schema.
  command: ["npx", "tsx", "framework/db/src/migrate-pg.ts"]

# Extra plain (non-secret) env. Profile is baked into the image but pinned here
# too so it's visible/overridable. DATABASE_URL + HYPERIDLE_API_KEY come from
# secrets and are wired in the deployment template, not here.
env:
  - name: HYPERIDLE_PROFILE
    value: "cloud"

resources:
  requests:
    cpu: 25m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /api/health
  liveness:
    path: /api/health
