{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  # No TLS here: Cloudflare ends HTTPS at its edge and the tunnel reaches nginx over plain HTTP.
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "{{ .Values.ingress.rateLimit | default 10 }}"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    # Live updates ride one long-lived WebSocket; nginx's 60 s default would cut it.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    # Single host -> server. The server serves both the web SPA (/) and the
    # API (/api/*); desktop shared-mode clients loadURL() the root.
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
