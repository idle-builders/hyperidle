<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AZ15 spacing comparisons</title>
  <style>
    :root {
      --surface-page: #fcf8e8;
      --surface-container: #f6f0d8;
      --surface-elevated: #fff;
      --border-subtle: #e5ddc3;
      --border-default: #d5c9a6;
      --text-primary: #2c241a;
      --text-secondary: #665b4a;
      --text-tertiary: #8d806b;
      --accent: #8f5e28;
      --accent-dim: #f0dfc3;
      --success: #397457;
      --shadow-default: 0 4px 12px rgb(44 36 26 / 8%);
      --r-default: 8px;
      --r-subtle: 5px;
      --space-1: 3px;
      --space-2: 6px;
      --space-3: 9px;
      --space-4: 12px;
      --space-6: 18px;
      --space-8: 24px;
      --space-12: 36px;
      --space-16: 48px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      background: #e9e2cb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; }
    button, input, select { font: inherit; color: inherit; }
    .evidence-header {
      max-width: 1400px;
      margin: 0 auto 18px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border: 1px solid var(--border-default);
      border-radius: var(--r-default);
      background: var(--surface-elevated);
    }
    .evidence-header h1 { margin: 0 0 3px; font-size: 16px; }
    .evidence-header p { margin: 0; color: var(--text-secondary); font-size: 12px; }
    .badge { padding: 3px 9px; border-radius: 999px; background: var(--accent-dim); color: var(--accent); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .comparison-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }
    .variant {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border-default);
      border-radius: var(--r-default);
      background: var(--surface-container);
    }
    .variant-bar {
      min-height: 46px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border-default);
      background: var(--surface-elevated);
    }
    .variant-bar strong { display: block; font-size: 13px; }
    .variant-bar span { display: block; margin-top: 3px; font-size: 11px; color: var(--text-tertiary); }
    .measure { color: var(--accent); font: 700 13px ui-monospace, monospace; white-space: nowrap; }
    .app-frame { padding: 9px; background: var(--surface-container); }
    .surface {
      min-height: 640px;
      overflow: hidden;
      border-radius: var(--r-default);
      background: var(--surface-page);
      box-shadow: var(--shadow-default);
    }
    .page-header { padding: 18px 24px; border-bottom: 1px solid var(--border-subtle); background: var(--surface-elevated); }
    .page-header h2 { margin: 0 0 3px; font-size: 20px; line-height: 1.2; }
    .page-header p { margin: 0; color: var(--text-tertiary); font-size: 13px; }
    .page-body { padding: 24px; }
    .settings-stack, .agent-stack { display: flex; flex-direction: column; gap: var(--section-gap); }
    .section { min-width: 0; }
    .section-title {
      margin: 0 0 var(--close-gap);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .group-stack { display: flex; flex-direction: column; gap: var(--group-gap); }
    .field-group { display: flex; flex-direction: column; gap: var(--close-gap); }
    .field-group label { font-size: 12px; font-weight: 650; color: var(--text-secondary); }
    .control-row { display: flex; align-items: center; gap: 9px; }
    .input {
      height: 34px;
      width: 100%;
      padding: 0 12px;
      border: 1px solid var(--border-default);
      border-radius: var(--r-subtle);
      background: var(--surface-elevated);
      font-size: 13px;
    }
    .button {
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border-default);
      border-radius: var(--r-subtle);
      background: var(--surface-elevated);
      font-size: 12px;
      font-weight: 650;
    }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .row-list { overflow: hidden; border: 1px solid var(--border-subtle); border-radius: var(--r-default); background: var(--surface-elevated); }
    .row { min-height: 44px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border-subtle); }
    .row:last-child { border-bottom: 0; }
    .row-main { min-width: 0; display: flex; align-items: center; gap: 9px; }
    .avatar { width: 27px; height: 27px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 999px; background: var(--accent-dim); color: var(--accent); font-size: 11px; font-weight: 800; }
    .row strong { display: block; font-size: 13px; }
    .row small { display: block; margin-top: 3px; color: var(--text-tertiary); font-size: 11px; }
    .status { color: var(--success); font-size: 11px; font-weight: 700; }
    .toggle { width: 30px; height: 18px; padding: 3px; border-radius: 999px; background: var(--success); }
    .toggle::after { content: ""; display: block; width: 12px; height: 12px; margin-left: 12px; border-radius: 50%; background: white; }
    .identity { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .identity-main { display: flex; align-items: center; gap: 12px; }
    .identity .avatar { width: 42px; height: 42px; font-size: 15px; }
    .identity h3 { margin: 0 0 3px; font-size: 18px; }
    .identity p { margin: 0; color: var(--text-tertiary); font-size: 12px; }
    .panel { padding: 12px; border: 1px solid var(--border-subtle); border-radius: var(--r-default); background: var(--surface-elevated); }
    .panel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--group-gap); }
    .stat { min-width: 0; }
    .stat span { display: block; margin-bottom: var(--close-gap); color: var(--text-tertiary); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .stat strong { font-size: 14px; }
    .capabilities { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 3px 9px; border: 1px solid var(--border-default); border-radius: 999px; background: var(--surface-container); color: var(--text-secondary); font-size: 11px; }
    .note { margin: 0; color: var(--text-secondary); font-size: 13px; line-height: 1.55; }
    .comparison-note { margin-top: 12px; padding: 9px 12px; border-top: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 11px; background: color-mix(in srgb, var(--accent-dim) 35%, white); }
    @media (max-width: 820px) {
      body { padding: 12px; }
      .evidence-header { margin-bottom: 12px; padding: 9px 12px; }
      .comparison-grid { gap: 9px; }
      .variant-bar { align-items: flex-start; }
      .page-body { padding: 18px; }
      .page-header { padding: 18px; }
      .surface { min-height: 720px; }
      .identity { align-items: flex-start; flex-direction: column; }
      .panel-grid { grid-template-columns: 1fr; }
      .row { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="evidence-header">
    <div>
      <h1 id="evidence-title">AZ15 controlled comparison</h1>
      <p id="evidence-subtitle">Same Hearth surface and content; only the named relationship changes.</p>
    </div>
    <span class="badge" id="viewport-badge">comparison evidence</span>
  </header>
  <main class="comparison-grid" id="comparison"></main>
  <script>
    const params = new URLSearchParams(location.search);
    const surface = params.get("surface") || "dense";
    const relation = params.get("relation") || "section";
    const candidates = {
      section: { a: 24, b: 36, fixed: { group: 12, close: 6 }, name: "major section break" },
      group: { a: 12, b: 18, fixed: { section: 24, close: 6 }, name: "peer group separation" },
      close: { a: 6, b: 9, fixed: { section: 24, group: 12 }, name: "label / close relation" }
    };
    const test = candidates[relation];
    document.querySelector("#evidence-title").textContent = `${surface === "dense" ? "Dense Settings" : "Sparse Agent detail"}: ${test.name}`;
    document.querySelector("#evidence-subtitle").textContent = `Controlled ${test.a}px versus ${test.b}px; content, typography, borders, padding, and other gaps are fixed.`;

    function vars(value) {
      const section = relation === "section" ? value : test.fixed.section;
      const group = relation === "group" ? value : test.fixed.group;
      const close = relation === "close" ? value : test.fixed.close;
      return `--section-gap:${section}px;--group-gap:${group}px;--close-gap:${close}px`;
    }

    function denseSurface() {
      return `<div class="surface dense-surface">
        <header class="page-header"><h2>Settings</h2><p>Manage your profile, team, and app preferences.</p></header>
        <div class="page-body settings-stack">
          <section class="section"><h3 class="section-title">Profile</h3><div class="group-stack">
            <div class="field-group"><label>Display name</label><input class="input" value="Taylor Gray" readonly /></div>
            <div class="field-group"><label>Email</label><input class="input" value="taylor@hyperidle.test" readonly /></div>
          </div></section>
          <section class="section"><h3 class="section-title">Agents</h3><div class="row-list">
            <div class="row"><div class="row-main"><span class="avatar">B</span><div><strong>Builder</strong><small>Codex · normal reasoning</small></div></div><span class="status">Available</span></div>
            <div class="row"><div class="row-main"><span class="avatar">R</span><div><strong>Reviewer</strong><small>Codex · high reasoning</small></div></div><button class="button">Configure</button></div>
          </div></section>
          <section class="section"><h3 class="section-title">Agent behavior</h3><div class="group-stack">
            <div class="field-group"><label>Default autonomy</label><select class="input"><option>Ask before consequential actions</option></select></div>
            <div class="field-group"><label>Workspace instructions</label><input class="input" value="Read AGENTS.md before changes" readonly /></div>
          </div></section>
          <section class="section"><h3 class="section-title">Appearance</h3><div class="row-list">
            <div class="row"><div><strong>Follow system theme</strong><small>Use the current device appearance</small></div><span class="toggle"></span></div>
            <div class="row"><div><strong>Reduced motion</strong><small>Limit non-essential transitions</small></div><button class="button">Off</button></div>
          </div></section>
        </div>
      </div>`;
    }

    function sparseSurface() {
      return `<div class="surface sparse-surface">
        <header class="page-header"><h2>Agent profile</h2><p>Configuration, capabilities, and recent outcomes.</p></header>
        <div class="page-body agent-stack">
          <section class="section identity"><div class="identity-main"><span class="avatar">B</span><div><h3>Builder</h3><p>Acme team · available</p></div></div><button class="button primary">Start session</button></section>
          <section class="section"><h3 class="section-title">Configuration</h3><div class="panel group-stack">
            <div class="panel-grid"><div class="stat"><span>Harness</span><strong>Codex</strong></div><div class="stat"><span>Reasoning</span><strong>Normal</strong></div></div>
            <p class="note">Works autonomously inside the assigned repository and stops before external side effects.</p>
          </div></section>
          <section class="section"><h3 class="section-title">Capabilities</h3><div class="panel group-stack">
            <div class="capabilities"><span class="chip">TypeScript</span><span class="chip">UI implementation</span><span class="chip">Testing</span><span class="chip">Git</span></div>
            <p class="note">Best for bounded product work with explicit acceptance criteria.</p>
          </div></section>
          <section class="section"><h3 class="section-title">Recent activity</h3><div class="row-list">
            <div class="row"><div><strong>Pricing page overhaul</strong><small>Completed 18 minutes ago</small></div><span class="status">Passed</span></div>
            <div class="row"><div><strong>Knowledge cleanup</strong><small>Completed yesterday</small></div><span class="status">Passed</span></div>
          </div></section>
        </div>
      </div>`;
    }

    const markup = surface === "dense" ? denseSurface : sparseSurface;
    document.querySelector("#comparison").innerHTML = [test.a, test.b].map((value, index) => `
      <article class="variant" data-variant="${index === 0 ? "a" : "b"}" style="${vars(value)}">
        <header class="variant-bar"><div><strong>${index === 0 ? "Candidate A" : "Candidate B"}</strong><span>${surface === "dense" ? "dense settings stack" : "sparse detail stack"}</span></div><div class="measure">${value} px</div></header>
        <div class="app-frame">${markup()}<div class="comparison-note">Only ${test.name} is ${value}px in this panel.</div></div>
      </article>`).join("");
    document.querySelector("#viewport-badge").textContent = `${innerWidth}px viewport`;
  </script>
</body>
</html>
