# HyperIdle VPS deployment profile.
# Brings up Postgres, runs migrations, then starts the production server.
# The server also serves the built web SPA (HYPERIDLE_STATIC_DIR).
#
# Usage:
#   cp .env.example .env     # set POSTGRES_PASSWORD and HYPERIDLE_API_KEY
#   docker compose up -d --build
#
# See docs/deployment/self-hosting.md for details.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hyperidle}
      POSTGRES_USER: ${POSTGRES_USER:-hyperidle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # @lore Bound to the loopback interface so a VPS operator who runs
    # `docker compose up -d` does not accidentally publish Postgres to
    # 0.0.0.0. If you need external access, front with a VPN or SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperidle} -d ${POSTGRES_DB:-hyperidle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hyperidle}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-hyperidle}}
    command: ["npx", "tsx", "framework/db/src/migrate-pg.ts"]

  server:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # @lore HYPERIDLE_PROFILE=vps is load-bearing: validateStartupEnv
      # (applications/remote-server/src/validate-startup-env.ts) requires an
      # explicit HYPERIDLE_API_KEY for vps/cloud profiles rather than falling
      # back to the laptop-dev default — a real security gate for a
      # network-exposed deployment.
      HYPERIDLE_PROFILE: vps
      # @lore HYPERIDLE_API_KEY must be set in .env — the vps profile exits at
      # startup without it (validate-startup-env.ts:12-13).
      HYPERIDLE_API_KEY: ${HYPERIDLE_API_KEY:?HYPERIDLE_API_KEY must be set in .env}
      # @lore Interpolated from POSTGRES_* so setting POSTGRES_PASSWORD in
      # .env actually takes effect. Previously hard-coded to hyperidle:hyperidle
      # which silently ignored operator changes (H4 review finding).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hyperidle}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-hyperidle}}
      PG_POOL_SIZE: ${PG_POOL_SIZE:-10}
      PORT: 3001
    # @lore Server bound to loopback on the host; operators front it with a
    # reverse proxy (nginx/Caddy) for TLS + auth rather than exposing the
    # Hono server directly.
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
