# HyperIdle VPS deployment profile (H4).
# Brings up Postgres + server + web as a single Docker Compose stack.
#
# Usage:
#   cp .env.example .env     # and set POSTGRES_PASSWORD (at minimum)
#   docker compose up -d
#   bun run db:migrate:pg
#   bun run db:seed:pg
#
# See docs/DEPLOYMENT.md for details.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hyperidle}
      POSTGRES_USER: ${POSTGRES_USER:-hyperidle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperidle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperidle} -d ${POSTGRES_DB:-hyperidle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HYPERIDLE_PROFILE: vps
      DATABASE_URL: ${DATABASE_URL:-postgres://hyperidle:hyperidle@postgres:5432/hyperidle}
      PG_POOL_SIZE: ${PG_POOL_SIZE:-10}
      PORT: 3001
    ports:
      - "3001:3001"
    command: ["bun", "run", "--filter", "@hyperidle/server", "dev"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://server:3001
    ports:
      - "5173:5173"
    command: ["bun", "run", "--filter", "@hyperidle/web", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
