name: Server image

# Publishes the shared-backend server image (Dockerfile.deploy) for every commit
# on main, tagged with the commit SHA and `main`, so anyone can run a HyperIdle
# server without building it. Deploying is the deployment's own business.
# A new GHCR package starts private: its visibility is set to Public once, in
# the package's settings on GitHub.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.deploy
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hyperidle-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/hyperidle-server:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
