name: Release Guard

# PR gate for the release pipeline. If a PR bumps the root package.json version,
# it must ALSO carry proof that the notarized DMG for that version was staged:
#   - version sources in sync (root == desktop == chart appVersion)
#   - applications/desktop/release-manifest.json present + matching the new version
#   - a DRAFT GitHub Release v<version> exists on this repo with the DMG asset,
#     whose sha256 matches the manifest
#
# Bumping the version without staging the DMG (via applications/desktop/__scripts__/release.sh)
# fails this check — so a version bump can never merge without its artifact.
# PRs that don't touch the version are a no-op.
on:
  pull_request:
    branches: [main]

permissions:
  # `write` (not read) is required: the staged release is a DRAFT, and GitHub
  # only exposes draft releases to tokens with push access. Read-only can't see
  # it, so `gh release view` would 404. Same-repo PRs get this; forks are
  # downgraded to read (a fork PR can't stage a draft anyway).
  contents: write

jobs:
  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Detect version bump
        id: bump
        run: |
          BASE=$(git show "origin/${{ github.base_ref }}:package.json" | jq -r .version)
          HEAD=$(jq -r .version package.json)
          echo "base=$BASE head=$HEAD"
          if [ "$BASE" = "$HEAD" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No version change — Release Guard is a no-op."
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$HEAD" >> "$GITHUB_OUTPUT"
          fi

      # The three version sources that must move together:
      #   root package.json `version`             — source of truth, release trigger
      #   applications/desktop/package.json       — names the DMG via electron-builder
      #   deploy/chart/Chart.yaml `appVersion`    — app version the deployed backend reports
      # Inline rather than a script: it is three file reads, and a workflow step
      # cannot silently no-op the way a moved/deleted script path can.
      - name: Version sources in sync
        if: steps.bump.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          DESKTOP_PKG=applications/desktop/package.json
          CHART=deploy/chart/Chart.yaml

          for f in "$DESKTOP_PKG" "$CHART"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f missing — version sync cannot be checked"
              exit 1
            fi
          done

          DESKTOP=$(jq -er .version "$DESKTOP_PKG")
          APPVERSION=$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' "$CHART")
          if [ -z "$APPVERSION" ]; then
            echo "::error::$CHART has no appVersion field"
            exit 1
          fi

          echo "root=$VERSION desktop=$DESKTOP chart appVersion=$APPVERSION"
          FAIL=0
          [ "$DESKTOP" = "$VERSION" ] || { echo "::error::$DESKTOP_PKG version $DESKTOP != root $VERSION"; FAIL=1; }
          [ "$APPVERSION" = "$VERSION" ] || { echo "::error::$CHART appVersion $APPVERSION != root $VERSION"; FAIL=1; }
          if [ "$FAIL" = 1 ]; then
            echo "::error::Run applications/desktop/__scripts__/release.sh $VERSION to bump all sources together."
            exit 1
          fi
          echo "✓ all version sources at $VERSION"

      - name: Manifest present and matches
        if: steps.bump.outputs.bumped == 'true'
        id: manifest
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          MF=applications/desktop/release-manifest.json
          if [ ! -f "$MF" ]; then
            echo "::error::$MF missing — run applications/desktop/__scripts__/release.sh $VERSION to stage the DMG"
            exit 1
          fi
          MV=$(jq -r .version "$MF")
          if [ "$MV" != "$VERSION" ]; then
            echo "::error::manifest version $MV != bumped version $VERSION"
            exit 1
          fi
          echo "sha256=$(jq -r .sha256 "$MF")" >> "$GITHUB_OUTPUT"
          echo "dmg=$(jq -r .dmgName "$MF")" >> "$GITHUB_OUTPUT"

      - name: Staged DMG exists with matching sha256
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="v$VERSION"
          DMG="${{ steps.manifest.outputs.dmg }}"
          EXPECTED="${{ steps.manifest.outputs.sha256 }}"

          # The staged release is a DRAFT on this private repo — GITHUB_TOKEN can read it.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft > rel.json 2>/dev/null; then
            echo "::error::No staged release $TAG found. Run applications/desktop/__scripts__/release.sh $VERSION (it uploads the DMG to a draft release)."
            exit 1
          fi
          if [ "$(jq -r .isDraft rel.json)" != "true" ]; then
            echo "::warning::release $TAG is already published (expected a draft pre-merge)"
          fi
          if ! jq -e --arg n "$DMG" '.assets[] | select(.name == $n)' rel.json >/dev/null; then
            echo "::error::staged release $TAG has no asset named $DMG"
            jq -r '.assets[].name' rel.json
            exit 1
          fi

          echo "Downloading $DMG to verify sha256…"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$DMG" --dir _staged
          ACTUAL=$(sha256sum "_staged/$DMG" | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::sha256 mismatch — manifest $EXPECTED vs staged $ACTUAL"
            exit 1
          fi
          echo "✓ staged DMG $DMG verified (sha256 $ACTUAL)"

  # Full suite, on version-bump PRs only. E2E needs a signed-in agent program, so it runs locally
  # in `npm run verify:release`.
  release-tests:
    name: Release tests
    needs: release-guard
    if: needs.release-guard.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:full
      - run: npm run test:integration:service

  # Required status check. The lanes above skip on non-bump PRs, and a required
  # context that never reports blocks the PR forever — so this always runs.
  release-verify:
    name: release verify
    needs: [release-guard, release-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for r in "${{ needs.release-guard.result }}" "${{ needs.release-tests.result }}"; do
            case "$r" in success|skipped) ;; *) echo "::error::release lane: $r"; exit 1 ;; esac
          done
