name: Deploy Shared Backend

# "Always latest" = the latest tagged RELEASE, not every commit. Push a version
# tag (vX.Y.Z) to build an immutable image and roll it onto the shared cluster.
# Manual workflow_dispatch is available for re-deploys / rollbacks.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/sha) to build and deploy"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ambrovia/hyperidle
  NAMESPACE: hyperidle

permissions:
  contents: read
  packages: write

# Never roll two deploys at once; never cancel a deploy mid-rollout.
concurrency:
  group: deploy-shared-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          # SHA tag is the immutable deploy target; the version tag + latest are
          # human-friendly aliases.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: ${{ secrets.KUBE_SERVER }}
                certificate-authority-data: ${{ secrets.KUBE_CA_CERT }}
              name: infra
          contexts:
            - context:
                cluster: infra
                namespace: ${{ env.NAMESPACE }}
                user: deployer
              name: deployer
          current-context: deployer
          users:
            - name: deployer
              user:
                token: ${{ secrets.KUBE_TOKEN }}
          EOF
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        # The deployer SA has no Secret RBAC — Helm stores release state in
        # ConfigMaps. --wait gates success on the migrate init-container + the
        # readiness probe; a failed rollout leaves the old pods serving.
        env:
          HELM_DRIVER: configmap
        run: |
          helm upgrade --install ${{ env.NAMESPACE }} ./chart \
            --namespace ${{ env.NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Smoke check
        run: |
          kubectl --namespace ${{ env.NAMESPACE }} rollout status \
            deployment/hyperidle --timeout=120s
