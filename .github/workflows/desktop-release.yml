name: Desktop Release — Distribute

# Triggered when a release is published on this repo (by the local release script).
# Downloads the signed+notarized DMG from this release, computes its sha256,
# and updates the Homebrew tap. Runs on ubuntu — no macOS minutes needed.
on:
  # Direct trigger for manual/local PAT-published releases (back-compat).
  release:
    types: [published]
  # Called by release.yml after it publishes on merge. A release published by
  # the Actions GITHUB_TOKEN does NOT emit `release: published` to other
  # workflows, so the CD path invokes this reusable workflow explicitly.
  workflow_call:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.5.0)"
        required: true
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve version
        id: release
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Distributing HyperIdle v$VERSION"

      - name: Download DMG from this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          DMG_NAME="HyperIdle-${VERSION}-arm64.dmg"

          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "$DMG_NAME" \
            --dir .

          echo "Downloaded: $DMG_NAME ($(du -sh "$DMG_NAME" | cut -f1))"

      - name: Compute sha256 checksum
        id: sha
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          DMG_NAME="HyperIdle-${VERSION}-arm64.dmg"
          ARM64_SHA=$(sha256sum "$DMG_NAME" | cut -d' ' -f1)
          echo "arm64_sha=${ARM64_SHA}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${ARM64_SHA}"

      - name: Dispatch cask update to Homebrew tap
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: idle-builders/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ steps.release.outputs.version }}",
              "arm64_sha256": "${{ steps.sha.outputs.arm64_sha }}"
            }
