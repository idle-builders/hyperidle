name: Desktop Release — Distribute

# Triggered when a release is published on this repo (by the local release script).
# Downloads the signed+notarized DMG, mirrors it to the public releases repo,
# and updates the Homebrew tap. Runs on ubuntu — no macOS minutes needed.
on:
  release:
    types: [published]

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Extract version from tag
        id: release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Distributing HyperIdle $TAG"

      - name: Download DMG from this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          DMG_NAME="HyperIdle-${VERSION}-arm64.dmg"

          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "$DMG_NAME" \
            --dir .

          echo "Downloaded: $DMG_NAME ($(du -sh "$DMG_NAME" | cut -f1))"

      - name: Upload DMG to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          DMG_NAME="HyperIdle-${VERSION}-arm64.dmg"

          if ! gh release view "$TAG" --repo ambrovia/hyperidle-releases &>/dev/null; then
            gh release create "$TAG" \
              --repo ambrovia/hyperidle-releases \
              --title "HyperIdle $TAG" \
              --notes "Desktop release $TAG (arm64)"
          fi

          gh release upload "$TAG" "$DMG_NAME" --clobber \
            --repo ambrovia/hyperidle-releases

      - name: Compute sha256 checksum
        id: sha
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          DMG_NAME="HyperIdle-${VERSION}-arm64.dmg"
          ARM64_SHA=$(sha256sum "$DMG_NAME" | cut -d' ' -f1)
          echo "arm64_sha=${ARM64_SHA}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${ARM64_SHA}"

      - name: Dispatch cask update to Homebrew tap
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: ambrovia/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ steps.release.outputs.version }}",
              "arm64_sha256": "${{ steps.sha.outputs.arm64_sha }}"
            }
