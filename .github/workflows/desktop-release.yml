name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0, 1.0.0)"
        required: true
        type: string
      bump:
        description: "Bump type (for changelog context only — version is explicit)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Only one release build at a time — do not cancel in-progress (a partial
# release would leave assets missing from the GitHub Release).
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

  build:
    needs: tag
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      # Notarization — Apple ID + app-specific password
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Verbose logging for signing + notarization diagnostics
      DEBUG: "electron-builder,electron-notarize*"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up code signing keychain
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Allow codesign to access the key without UI prompt (critical on Sonoma+)
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "Imported identities:"
          security find-identity -v "$KEYCHAIN_PATH"

          # CSC_KEYCHAIN tells electron-builder to use our keychain.
          # CSC_LINK is NOT set at job level — this prevents electron-builder
          # from creating its own keychain (which lacks set-key-partition-list).
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Verify notarytool credentials
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json 2>&1 | head -5
          echo "Notarytool credentials verified."

      - name: Install dependencies
        run: bun install

      - name: Build web SPA
        run: bun run --filter @hyperidle/web build

      - name: Bundle desktop (esbuild → dist/main.cjs)
        run: bun packages/desktop/scripts/bundle.ts

      - name: Generate package-lock.json for electron-rebuild
        # @lore N5: electron-rebuild needs a package-lock.json but npm cannot
        # parse bun's workspace:* protocol. npm also walks up the directory
        # tree and discovers the root workspace config, so even a minimal
        # package.json in packages/desktop/ gets workspace-resolved.
        # Fix: run npm in an isolated temp dir outside the monorepo, then
        # copy the generated package-lock.json into packages/desktop/.
        run: |
          ISOLATED=$(mktemp -d)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/desktop/package.json', 'utf-8'));
            const minimal = {
              name: pkg.name,
              version: pkg.version,
              dependencies: { 'better-sqlite3': pkg.dependencies['better-sqlite3'] }
            };
            fs.writeFileSync(process.argv[1] + '/package.json', JSON.stringify(minimal, null, 2));
          " "$ISOLATED"
          (cd "$ISOLATED" && npm install --package-lock-only --ignore-scripts)
          cp "$ISOLATED/package-lock.json" packages/desktop/package-lock.json
          rm -rf "$ISOLATED"

      - name: Build and sign
        working-directory: packages/desktop
        run: npx electron-builder --config electron-builder.yml --mac --arm64 --publish never

      - name: Notarize DMG
        working-directory: packages/desktop
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          echo "DMG to notarize: $DMG ($(du -sh "$DMG" | cut -f1))"

          echo "::group::Submitting to Apple notarization"
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json 2>&1)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Submission ID: $SUBMISSION_ID"
          echo "::endgroup::"

          echo "::group::Waiting for Apple processing (up to 60 min)"
          xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --timeout 60m 2>&1 || true
          echo "::endgroup::"

          echo "::group::Notarization result"
          RESULT=$(xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json 2>&1)
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Status: $STATUS"
          echo "::endgroup::"

          if [ "$STATUS" != "Accepted" ]; then
            echo "::group::Notarization log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1 || true
            echo "::endgroup::"
            echo "::error::Notarization failed with status: $STATUS"
            exit 1
          fi

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG"
          echo "Notarization complete."

      - name: Upload DMG to public releases repo
        # @lore N5: DMGs are uploaded to ambrovia/hyperidle-releases (public)
        # instead of the main repo (private). This lets Homebrew download
        # the DMGs without authentication. The RELEASES_TOKEN needs repo
        # scope on ambrovia/hyperidle-releases.
        uses: softprops/action-gh-release@v2
        with:
          repository: ambrovia/hyperidle-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ inputs.version }}
          name: HyperIdle v${{ inputs.version }}
          files: packages/desktop/dist/*.dmg

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get release version from inputs
        id: release
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Wait for release asset to be uploaded
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          BASE_URL="https://github.com/ambrovia/hyperidle-releases/releases/download/${TAG}"
          DMG_URL="${BASE_URL}/HyperIdle-${VERSION}-arm64.dmg"

          echo "Waiting for DMG: ${DMG_URL}"
          for i in $(seq 1 30); do
            if curl -sILf "${DMG_URL}" > /dev/null 2>&1; then
              echo "DMG available."
              exit 0
            fi
            echo "Attempt ${i}/30: DMG not yet available. Retrying in 10s..."
            sleep 10
          done
          echo "::error::DMG not available after 5 minutes. Aborting."
          exit 1

      - name: Download DMG and compute sha256 checksum
        id: sha
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          BASE_URL="https://github.com/ambrovia/hyperidle-releases/releases/download/${TAG}"

          curl -sL "${BASE_URL}/HyperIdle-${VERSION}-arm64.dmg" -o arm64.dmg

          # @lore N5: Use sha256sum (GNU coreutils, available on ubuntu-latest).
          # The macOS equivalent (shasum with -a flag) is NOT available on ubuntu.
          ARM64_SHA=$(sha256sum arm64.dmg | cut -d' ' -f1)
          echo "arm64_sha=${ARM64_SHA}" >> "$GITHUB_OUTPUT"

      - name: Dispatch cask update to homebrew tap
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: ambrovia/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ steps.release.outputs.version }}",
              "arm64_sha256": "${{ steps.sha.outputs.arm64_sha }}"
            }
