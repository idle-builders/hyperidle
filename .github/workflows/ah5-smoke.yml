##
# AH5: Live agent-path smoke lane.
#
# Triggers:
#   - Nightly cron (0 6 * * * = 06:00 UTC daily)
#   - Manual workflow_dispatch (any branch)
#   - PR labeled 'run-smoke' (opt-in — never automatic on every PR)
#
# CRITICAL: This workflow is OFF the hot per-PR path. ci.yml is NOT modified.
# The per-PR gate (check + lint + test:all + build) continues to run fast
# without OpenRouter latency or cost.
#
# Requires: secrets.OPENROUTER_API_KEY
# The job is skipped if the secret is empty (safe for forks).
##

name: AH5 live agent-path smoke

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      model_override:
        description: "Override model id (optional, skips selection step)"
        required: false
        type: string
  pull_request:
    types: [labeled]

jobs:
  smoke:
    # Only run on labeled-PR if the label is 'run-smoke'.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-smoke'))
    runs-on: ubuntu-latest
    # Skip the entire job if the secret is absent (fork safety).
    # The 'if' above gates on event type; this env check gates on secret presence.
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AH5_MAX_COST_CENTS: "5"
      AH5_MAX_TOKENS: "20000"
      RESOLVE_MODEL_FILE: "/tmp/ah5-model-selection.json"

    steps:
      - name: Check secret availability
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set. Skipping smoke lane (fork or missing secret)."
            exit 0
          fi
          echo "OPENROUTER_API_KEY is set. Proceeding with smoke lane."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Run model-selection unit tests (gate on policy correctness)
        run: npm run test -- --project eval

      - name: Run no-mock static guard
        run: npx tsx scripts/ah5-no-mock-guard.ts

      - name: Resolve smoke model
        if: ${{ !inputs.model_override }}
        run: npx tsx packages/web/scripts/ah5-resolve-model.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESOLVE_MODEL_FILE: ${{ env.RESOLVE_MODEL_FILE }}

      - name: Use override model (workflow_dispatch with model_override)
        if: ${{ inputs.model_override != '' }}
        run: |
          mkdir -p /tmp
          echo '{"routedId":"${{ inputs.model_override }}"}' > ${{ env.RESOLVE_MODEL_FILE }}
          echo "Using override model: ${{ inputs.model_override }}"

      - name: Run real-turn probe (production seam, no mocks)
        run: npx tsx packages/web/scripts/ah5-real-turn-probe.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESOLVE_MODEL_FILE: ${{ env.RESOLVE_MODEL_FILE }}
          AH5_MAX_COST_CENTS: ${{ env.AH5_MAX_COST_CENTS }}
          AH5_MAX_TOKENS: ${{ env.AH5_MAX_TOKENS }}

      - name: Run Playwright smoke lane (UI proof — AH3-gated tests are fixme)
        run: npm run -w @hyperidle/web test:e2e:ah5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESOLVE_MODEL_FILE: ${{ env.RESOLVE_MODEL_FILE }}
          AH5_MAX_COST_CENTS: ${{ env.AH5_MAX_COST_CENTS }}
          AH5_MAX_TOKENS: ${{ env.AH5_MAX_TOKENS }}

      - name: Assert budget (fail-closed — runs even if lane fails)
        if: always()
        run: npx tsx packages/web/scripts/ah5-assert-budget.ts
        env:
          AH5_MAX_COST_CENTS: ${{ env.AH5_MAX_COST_CENTS }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ah5
          path: packages/web/playwright-report-ah5/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload cost report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ah5-cost-report
          path: packages/web/playwright-report-ah5/ah5-cost.json
          retention-days: 14
          if-no-files-found: warn
