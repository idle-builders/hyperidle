name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel stale runs when a fresh push lands. Recurrence (L7 + L10): without
# this, concurrent CI runs piled up at long Playwright timeouts and masked
# real failures behind queue backpressure. See `.pipeline/retro-log.jsonl`
# entries for L7 ("CI should auto-cancel previous in-progress runs on push")
# and L10 ("Concurrent CI runs piled up at 30s × 2 retries × 1 worker
# instead of cancelling stale in-progress runs").
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: packages/web

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        working-directory: packages/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 14
