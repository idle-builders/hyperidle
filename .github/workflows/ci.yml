name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI runs EVERY per-merge gate live. Nothing is trusted from a local machine.
#
# @lore ci-move: this replaces the HMAC-signed local attestation
# (scripts/verify-attest.ts + scripts/check-attestation.ts, both deleted). That
# design had CI re-run the fast checks and trust a locally-signed record of the
# slow test suite. It failed structurally: the attestation fingerprinted the
# WHOLE tracked tree, so any commit after it — a progress JSON, a rebase, main
# advancing under a PR — invalidated it and forced a 10+ minute local re-verify
# that outran an agent's foreground budget; and it was only ever as honest as
# the machine that signed it (Z8-166).
#
# Split by cost, not by trust:
#   here (every PR + push to main) — all static gates at full scope, plus the
#     unit and service-integration slices AFFECTED by the diff;
#   release-guard.yml (version bump only) — the full unfiltered suite + e2e.
# The harness lane (real CLI binaries + real LLM calls) has no CI job by
# design; see docs/guides/developer/testing.md.
#
# @lore ci-move parallel jobs: the heavy lanes run as SEPARATE jobs, not steps
# in one job, because a GitHub-hosted runner for a private repo is 2 vCPU and
# wall time was the sum of the lanes (~30 min, past the timeout). Split, it is
# the max instead.
#
# @lore ci-move fixed overhead: every extra job costs a full runner setup, and
# that is not small here — measured 53s (3s provision + 26s checkout + 7s
# setup-node + 17s npm ci). The 103 MiB / 1080-commit history is why checkout
# was 26s, and 771 MB across 717 packages is why npm ci was 17s. Nine jobs
# meant ~8 minutes of pure setup, paid whether the diff selected 300 test files
# or three. Two things fix that, and both depend on `scope` doing the work once:
#   1. `scope` LISTS the affected test files, so the shards receive an explicit
#      file list and never need `--changed`. No git history required ⇒ they use
#      fetch-depth 1 instead of 0.
#   2. `scope` SIZES each lane to that list — an empty lane is skipped entirely
#      rather than starting shards that run nothing, and a small lane gets one
#      shard rather than three.
# The counting costs `scope` one install; it buys back far more than it spends
# on any diff that is not near-total.
#
# @lore ci-move affected-selection is near-total in CI, and nobody knows why:
# for the same commit, same base sha, same clean tree, same Node 24 and the same
# `vitest list --changed=<sha>` invocation, CI reports 561 affected unit files
# (the ENTIRE suite) where a local run reports 29. Ruled out: the vitest/vite
# module-graph cache (no cache dir existed locally, and clearing it changed
# nothing), missing `dist/` shifting workspace resolution from build output to
# source (removing all 48 dist dirs locally still gave 29), and the PR merge ref
# differing from the branch tip (`git diff HEAD origin/pr-N/merge` was empty).
# TEST_BASE was verified correct in the CI log, so it is not the empty-base
# fallback either.
#
# The direction is SAFE — CI over-selects, so no test is missed; it only costs
# minutes. The corollary is less comfortable: a local `npm run test` may be
# under-selecting, which is a property of `--changed` this workflow inherited
# rather than introduced. Do not "fix" the lane sizing by trusting the local
# number. If you resolve this, the sizing thresholds below become worth tuning;
# until then they mostly pick the maximum fan-out and the real wins are in
# making the suite itself cheaper (see AU38).
#
# @lore ci-move required-check name: the `main-protection` ruleset requires
# exactly one status context, "npm run verify". Moving the tests into their own
# jobs would silently un-gate them, since new contexts are not required until
# someone edits the ruleset. So `verify` below is an AGGREGATOR: it owns the
# required name and fails if any lane failed. Adding a lane means adding it to
# BOTH `needs` and the result check — a lane absent from that check is a lane
# that cannot block a merge.
#
# @lore docs-only fast-path: `npm run verify` is a REQUIRED status check, so it
# must always run and report — workflow-level `paths-ignore` would leave the
# check forever pending and block docs-only PRs. Instead the `scope` job always
# runs and the heavy jobs are gated off its output. Any non-`.md` file in the
# diff forces the full run — the fast-path is conservative by construction.
jobs:
  scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      only_docs: ${{ steps.changes.outputs.only_docs }}
      unit_shards: ${{ steps.plan.outputs.unit_shards }}
      integration_shards: ${{ steps.plan.outputs.integration_shards }}
      unit_files: ${{ steps.plan.outputs.unit_files }}
      integration_files: ${{ steps.plan.outputs.integration_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Unknown/absent base (new branch, force-push, first push) → run
          # everything, unfiltered. An unresolvable base must never silently
          # select zero tests.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            echo "test_base=" >> "$GITHUB_OUTPUT"
            echo "Base '$BASE' unavailable — running full (unfiltered) test scope."
            exit 0
          fi
          echo "test_base=$BASE" >> "$GITHUB_OUTPUT"
          FILES=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$FILES"
          NON_MD=$(printf '%s\n' "$FILES" | grep -ivE '\.md$' || true)
          if [ -z "$FILES" ]; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            echo "Empty diff — running full verify."
          elif [ -n "$NON_MD" ]; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            echo "Non-docs file(s) changed — running full verify:"; echo "$NON_MD"
          else
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change — heavy jobs skipped."
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.only_docs != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.only_docs != 'true'
        run: npm ci

      # Resolve the affected file set ONCE and size each lane to it. `vitest
      # list` walks the same module graph `vitest run --changed` would, so the
      # selection is identical — it is just computed here instead of nine times.
      - name: Plan the test lanes
        id: plan
        if: steps.changes.outputs.only_docs != 'true'
        env:
          TEST_BASE: ${{ steps.changes.outputs.test_base }}
        run: |
          set -uo pipefail

          list_files() {
            # $@ = extra vitest args. Empty base ⇒ list everything (unfiltered).
            if [ -n "$TEST_BASE" ]; then
              npx vitest list "$@" --changed="$TEST_BASE" --filesOnly 2>/dev/null || true
            else
              npx vitest list "$@" --filesOnly 2>/dev/null || true
            fi
          }

          # `vitest list --filesOnly` prefixes every path with its project name —
          # "[core-api] layers/core-api/src/__tests__/x.test.ts". That prefix must
          # be stripped: fed back to vitest as a filter it matches nothing, and the
          # lane would silently run zero tests while reporting success.
          strip() { sed -E 's/^\[[^]]*\][[:space:]]*//'; }

          UNIT=$(list_files | strip | grep -E '\.test\.(ts|tsx)$' | sort -u || true)
          INTEG=$(list_files --config vitest.integration.config.ts --project service \
                    | strip | grep -E '\.integration\.test\.ts$' | sort -u || true)

          UNIT_N=$(printf '%s' "$UNIT" | grep -c . || true)
          INTEG_N=$(printf '%s' "$INTEG" | grep -c . || true)
          echo "affected unit files: $UNIT_N"
          echo "affected service-integration files: $INTEG_N"

          # Size the lane to the work. Thresholds are deliberately coarse: the
          # point is to stop paying nine runner setups for three test files, not
          # to balance shards perfectly.
          shards_for() {
            n=$1; max=$2
            if   [ "$n" -eq 0 ];   then echo "[]"
            elif [ "$n" -le 40 ];  then echo "[1]"
            elif [ "$n" -le 150 ] || [ "$max" -eq 2 ]; then echo "[1,2]"
            elif [ "$max" -eq 3 ]; then echo "[1,2,3]"
            else echo "[1,2,3,4]"
            fi
          }

          echo "unit_shards=$(shards_for "$UNIT_N" 3)" >> "$GITHUB_OUTPUT"
          echo "integration_shards=$(shards_for "$INTEG_N" 4)" >> "$GITHUB_OUTPUT"

          # Pass the resolved lists to the shards so they need neither git
          # history nor a second module-graph walk.
          {
            echo "unit_files<<EOF_UNIT"; echo "$UNIT"; echo "EOF_UNIT"
            echo "integration_files<<EOF_INTEG"; echo "$INTEG"; echo "EOF_INTEG"
          } >> "$GITHUB_OUTPUT"

      # A docs-only change never reaches the planning step, so the outputs are
      # empty and every lane below is skipped by its `if`.

  static:
    name: Static gates
    needs: scope
    if: needs.scope.outputs.only_docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The typecheck gate pre-builds ~30 leaf declaration sets with `tsc -b`
      # before it can measure anything, and on a cold tree that is the majority
      # of its runtime (143s of 248s, measured). `tsc -b` is incremental and
      # decides what to rebuild from `.tsbuildinfo`, so caching those alongside
      # the emitted `dist/` turns the pre-build into near-no-op work for the
      # projects a diff did not touch. Correctness is tsc's own input hashing,
      # not the cache key — a stale entry causes a rebuild, never a false pass.
      - name: Restore TypeScript build cache
        uses: actions/cache@v4
        with:
          path: |
            **/dist
            **/*.tsbuildinfo
          key: tsbuild-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuild-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            tsbuild-${{ runner.os }}-

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            eslint-${{ runner.os }}-

      - name: Typecheck gate
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Knip
        run: npm run knip
      # @lore ci-move: knip:production and deps:check are in `npm run verify`
      # locally but were absent from this workflow — CI was a WEAKER gate than
      # the local chain. Added so the required check covers what its name claims.
      - name: Knip (production)
        run: npm run knip:production
      - name: Dependency manifest
        run: npm run deps:check
      - name: Mock inventory
        run: npm run mock-inventory:check
      - name: Build (web)
        run: npm run build
      - name: Build (desktop)
        run: npm run -w @hyperidle/desktop build

  # Both test lanes receive an explicit file list from `scope`, so they need no
  # git history — hence fetch-depth 1 rather than the 103 MiB full clone. The
  # full unfiltered suite is the release gate (release-guard.yml); that is the
  # backstop for anything affected-selection under-selects.
  test_unit:
    name: Tests (unit, affected) ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.unit_shards != '[]' && needs.scope.outputs.unit_shards != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Never cancel siblings — one shard failing must not hide what the others found.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.unit_shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run affected unit tests
        env:
          FILES: ${{ needs.scope.outputs.unit_files }}
          TOTAL: ${{ strategy.job-total }}
          INDEX: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          # An empty list cannot reach here (the lane is skipped), so a blank
          # FILES means the plan and the matrix disagree — fail loudly rather
          # than run the whole suite by accident.
          if [ -z "$(printf '%s' "$FILES" | tr -d '[:space:]')" ]; then
            echo "::error::unit lane started with an empty file list"; exit 1
          fi
          echo "$FILES" | sed '/^$/d' > /tmp/unit-files.txt
          echo "running $(wc -l < /tmp/unit-files.txt) file(s), shard $INDEX/$TOTAL"
          # mapfile + one invocation, deliberately NOT xargs: xargs splits a long
          # list across several runs, and --shard applied to each subset silently
          # runs the wrong tests rather than failing.
          FILE_ARR=(); while IFS= read -r l; do FILE_ARR+=("$l"); done < /tmp/unit-files.txt
          npx vitest run --shard="$INDEX/$TOTAL" "${FILE_ARR[@]}"

  test_integration:
    name: Tests (service integration, affected) ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.integration_shards != '[]' && needs.scope.outputs.integration_shards != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.integration_shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run affected service-integration tests
        env:
          FILES: ${{ needs.scope.outputs.integration_files }}
          TOTAL: ${{ strategy.job-total }}
          INDEX: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          if [ -z "$(printf '%s' "$FILES" | tr -d '[:space:]')" ]; then
            echo "::error::integration lane started with an empty file list"; exit 1
          fi
          echo "$FILES" | sed '/^$/d' > /tmp/integ-files.txt
          echo "running $(wc -l < /tmp/integ-files.txt) file(s), shard $INDEX/$TOTAL"
          # See the unit lane: one invocation, never xargs.
          FILE_ARR=(); while IFS= read -r l; do FILE_ARR+=("$l"); done < /tmp/integ-files.txt
          npx vitest run --config vitest.integration.config.ts --project service \
            --shard="$INDEX/$TOTAL" "${FILE_ARR[@]}"

  # THE required status check. Owns the name the ruleset gates on; fails if any
  # lane failed. `skipped` counts as success — a lane with nothing affected is
  # correctly skipped, and a docs-only change skips all of them — but
  # `cancelled` and `failure` do not, because an unknown result must not merge.
  verify:
    name: npm run verify
    needs: [scope, static, test_unit, test_integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate lane results
        run: |
          set -u
          FAILED=0
          check() {
            echo "$1: $2"
            case "$2" in
              success|skipped) ;;
              *) FAILED=1 ;;
            esac
          }
          check "scope"            "${{ needs.scope.result }}"
          check "static"           "${{ needs.static.result }}"
          check "test_unit"        "${{ needs.test_unit.result }}"
          check "test_integration" "${{ needs.test_integration.result }}"
          if [ "$FAILED" = 1 ]; then
            echo "::error::one or more verify lanes did not pass"
            exit 1
          fi
          echo "All verify lanes passed."
