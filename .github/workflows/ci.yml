name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is the required status context in the `main-protection` ruleset.
  # Renaming it un-gates main.
  #
  # Runs the FULL suite, deliberately. `vitest --changed` is wired in the local
  # `npm run test` but selects 563 of 563 files in CI — it is not a working
  # optimisation here, and CI should not imply otherwise. Affected selection is
  # its own piece of work; so is AU38, which is worth ~2790 CPU-seconds of the
  # runtime below (see .pipeline/work/AU38/plan.md).
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:full
      - run: npm run test:integration:service
