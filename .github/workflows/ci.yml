name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel stale runs when a fresh push lands. Without this, concurrent CI runs
# pile up at long Playwright timeouts and mask real failures behind queue
# backpressure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI validates a locally-signed attestation from `npm run verify` instead of
# re-running all tools. The HMAC secret (VERIFY_SECRET) must match the one at
# ~/.config/hyperidle/verify-secret on the developer's machine.
jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Check attestation
        run: npx tsx scripts/check-attestation.ts
        env:
          VERIFY_SECRET: ${{ secrets.VERIFY_SECRET }}
