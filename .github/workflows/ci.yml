name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel stale runs when a fresh push lands. Without this, concurrent CI runs
# pile up at long Playwright timeouts and mask real failures behind queue
# backpressure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run through the same `bun run verify` orchestrator (tool list in
# `scripts/verify.ts`). Splitting via `--only` keeps the two required-check
# names branch protection expects while running everything in parallel.
jobs:
  validate:
    name: Check / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (check, lint, test)
        run: bun run verify --only=check,lint:biome,lint:eslint,test --raw

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: packages/web

      - name: Verify (e2e)
        run: bun run verify --only=e2e --raw

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 14
