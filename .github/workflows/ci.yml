name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel stale runs when a fresh push lands. Without this, concurrent CI runs
# pile up at long Playwright timeouts and mask real failures behind queue
# backpressure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI runs the same `bun run verify` orchestrator as local. The tool list lives
# in `scripts/verify.ts` — adding a step there adds it here. Browser install
# for Playwright is the one CI-specific setup.
jobs:
  verify:
    name: bun run verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: packages/web

      - name: apply migrations
        run: bun run db:migrate

      - name: Verify
        run: bun run verify --raw

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 14
