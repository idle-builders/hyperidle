<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HyperIdle</title>
  <style>
    /* The Paper canvas, ink and line colours from layers/core-ui/src/tokens.css, light and dark. */
    :root {
      --canvas: #faf8f4;
      --ink: #1b1a17;
      --line: #d3ccbf;
      --ink-3: #7a746b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #141310;
        --ink: #f5f1e8;
        --line: #423d33;
        --ink-3: #918b7f;
      }
    }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--line);
      border-top-color: var(--ink-3);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 13px;
      opacity: 0.6;
    }
    .migration-status {
      display: none;
      font-size: 12px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="status" id="status-text">Starting...</div>
  <div class="migration-status" id="migration-status"></div>
  <script>
    window.updateStatus = (text) => {
      var el = document.getElementById('status-text');
      if (el) el.textContent = text;
    };
    window.showMigrationStatus = (text) => {
      var el = document.getElementById('migration-status');
      if (el) {
        el.style.display = 'block';
        el.textContent = text;
      }
    };
  </script>
</body>
</html>
