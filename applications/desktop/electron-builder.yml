# electron-builder production configuration for HyperIdle desktop.
# Signing, notarization, DMG distribution, Homebrew support.
#
# @lore: extraMetadata.main — points packaged app at dist/main.cjs; package.json main stays src/main.ts for dev

appId: com.hyperidle.app
productName: HyperIdle
copyright: Copyright © 2025-2026 HyperIdle

# @lore: directories.output — must not be dist/ (esbuild output); overlap causes circular inclusion (+262MB)
directories:
  output: release

# Override main entry for production bundle without modifying source package.json
extraMetadata:
  main: dist/main.cjs

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  # Required for macOS notarization. Hardened runtime restricts what code can
  # execute — see build/entitlements.mac.plist for the required exceptions.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarize via App Store Connect API key (APPLE_API_KEY / APPLE_API_KEY_ID /
  # APPLE_API_ISSUER env vars set by CI secrets). electron-builder 25+ handles
  # notarytool natively when this is true.
  notarize: true
  icon: build/icon.icns

# Files included in the asar (app bundle)
# @lore: pglite dist — @electric-sql/pglite/dist must be in the asar; removing it breaks the app at runtime
files:
  - "dist/**/*"
  - "!dist/**/*.map"
  - "node_modules/@electric-sql/pglite/**"

# Resources outside the asar, accessible via process.resourcesPath at runtime.
# resolveMigrationsFolder() uses process.resourcesPath + "/drizzle" in packaged mode.
extraResources:
  - from: "../../framework/db/drizzle"
    to: "drizzle"
    filter:
      - "**/*.sql"
      - "meta/**/*"
  - from: "../../layers/core-ui/dist"
    to: "web-dist"
  # The plugins that ship inside the app — Settings › Plugins lists them as
  # available; main.ts points HYPERIDLE_BUNDLED_PLUGINS_DIR here.
  - from: "../../plugins"
    to: "plugins"

npmRebuild: false

# DMG window layout (standard Drag-to-Applications style)
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Explicit artifact naming so Homebrew cask URLs are predictable and stable.
# Pattern: HyperIdle-0.0.1-arm64.dmg / HyperIdle-0.0.1-x64.dmg
artifactName: "${productName}-${version}-${arch}.${ext}"

# No auto-update server — distribution is via Homebrew only (v1).
# @lore: publish null — CI also omits --publish; both are required to prevent an accidental release
publish: null
