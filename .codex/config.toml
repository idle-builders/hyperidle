# Repo-scoped Codex compatibility for the existing Claude setup.
# @lore Codex can symlink skills, but custom agents require TOML files. Keep
# repo-scoped Codex agents as direct TOML copies; do not runtime-load .md agents.
[agents.reviewer]
description = "Evaluator persona for design, architecture, and code-review passes."
config_file = "./agents/reviewer.toml"

[agents.designer]
description = "Pre-implementation persona for concept, UX/UI, and architecture planning."
config_file = "./agents/designer.toml"

[agents.builder]
description = "Implementation persona for production code, tests, and review fixes."
config_file = "./agents/builder.toml"

[agents.auditor]
description = "Deep-review persona for high-stakes security and product audits."
config_file = "./agents/auditor.toml"
