<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperIdle</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f0c419" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // K3/U4 theme persistence — runs synchronously before React mounts.
      // @lore FOIT prevention: we MUST set data-theme before the first paint
      // or the user sees a flash on every reload (the body briefly renders
      // with default styles before the React tree applies the chosen theme).
      // Mirrors framework/design-system/html/themes/_switcher.js but writes a
      // single data-theme attribute (no stylesheet swap — Hearth tokens are in
      // a single sheet keyed by [data-theme]).
      // U4: Hearth is light-first — default changed from "dark" to "light".
      (() => {
        let resolved = "light";
        try {
          const raw = window.localStorage.getItem("hyperidle-theme");
          const theme =
            raw === "light" || raw === "dark" || raw === "system" ? raw : "system";
          resolved =
            theme === "system"
              ? window.matchMedia?.("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
        } catch (_e) {
          /* localStorage blocked — fall back to light default */
        }
        document.documentElement.setAttribute(
          "data-theme",
          resolved === "dark" ? "hearth-dark" : "hearth-light",
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
